name: jurvio-public

services:
  app:
    image: ${JURVIO_IMAGE:?JURVIO_IMAGE is required}
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RAW_ARTIFACT_DIR: /var/lib/jurvio/artifacts
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /mnt/jurvio-artifacts:/var/lib/jurvio/artifacts:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ready"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 30s
