name: Diagnose federal publication holds (read-only)

# Read-only breakdown of WHY federal draft cases are being held out of publication, so we can tell
# whether a rising hold count is correct quality gating (true duplicates / thin / unverified /
# sealed) or over-holding introduced by a rule change. Publishes nothing, changes nothing.
#
# Motivation: after the candidate-query speed fix (#525) normalized docket matching to reuse
# legal_case_normalized_docket_idx, the `duplicate_identity_collision` hold
# (identityCollisionCount > 1 in src/modules/ingestion/domain/federal-stream.ts) can fire for
# punctuation/spacing docket variants that previously did not match. This surfaces whether the
# cases it now holds are genuine duplicates (correct) or distinct cases sharing a normalized
# docket within one court (over-hold to fix).

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Collision-legitimacy sample size"
        required: false
        default: "2000"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-federal-holds
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 8
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      SAMPLE: ${{ inputs.sample }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Hold breakdown over private VPC
        run: |
          set -uo pipefail
          case "${SAMPLE:-2000}" in ''|*[!0-9]*) echo "::error::sample must be numeric"; exit 1;; esac
          ssh "$INGESTION_USER@$DB_HOST" "SAMPLE='${SAMPLE:-2000}' bash -se" <<'REMOTE'
          set -uo pipefail
          SAMPLE="${SAMPLE:-2000}"
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          pg="$(find_svc postgres)"
          [ -n "$pg" ] || { echo "::error::postgres missing"; exit 1; }
          q() { sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "$1" 2>/dev/null; }

          echo "=============================================================="
          echo " FEDERAL PUBLICATION HOLD DIAGNOSIS @ $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "=============================================================="
          echo "total_holds=$(q "SELECT count(*) FROM federal_publication_hold")"
          echo "holds_last_24h=$(q "SELECT count(*) FROM federal_publication_hold WHERE held_at > now() - interval '24 hours'")"

          echo "--- reason breakdown (ALL holds) ---"
          q "SELECT '  '||reason||' = '||count(*) FROM federal_publication_hold, unnest(reasons) AS reason GROUP BY reason ORDER BY count(*) DESC"

          echo "--- reason breakdown (holds in last 24h) ---"
          q "SELECT '  '||reason||' = '||count(*) FROM federal_publication_hold, unnest(reasons) AS reason WHERE held_at > now() - interval '24 hours' GROUP BY reason ORDER BY count(*) DESC"

          echo "--- holds by rule_version ---"
          q "SELECT '  '||rule_version||' = '||count(*) FROM federal_publication_hold GROUP BY rule_version ORDER BY count(*) DESC"

          echo "--- collision legitimacy (sample of ${SAMPLE} collision-held cases) ---"
          echo "  For each sampled case held for duplicate_identity_collision, is its court+normalized-docket"
          echo "  group a TRUE duplicate (one distinct case name) or a POSSIBLE over-hold (multiple names)?"
          q "
          WITH held AS (
            SELECT lc.court_id,
                   lower(regexp_replace(lc.docket_number,'[^a-zA-Z0-9]','','g')) AS nd
              FROM federal_publication_hold h
              JOIN legal_case lc ON lc.id = h.case_id
             WHERE 'duplicate_identity_collision' = ANY(h.reasons)
               AND nullif(lower(regexp_replace(lc.docket_number,'[^a-zA-Z0-9]','','g')),'') IS NOT NULL
             ORDER BY random()
             LIMIT ${SAMPLE}
          ),
          grp AS (
            SELECT (SELECT count(DISTINCT lower(coalesce(c2.case_name,'')))
                      FROM legal_case c2
                     WHERE c2.court_id = held.court_id
                       AND lower(regexp_replace(c2.docket_number,'[^a-zA-Z0-9]','','g')) = held.nd
                   ) AS distinct_names,
                   (SELECT count(*)
                      FROM legal_case c3
                     WHERE c3.court_id = held.court_id
                       AND lower(regexp_replace(c3.docket_number,'[^a-zA-Z0-9]','','g')) = held.nd
                       AND c3.publication = 'published'
                   ) AS already_published_twin
              FROM held
          )
          SELECT '  sampled='||count(*)
               ||'  true_duplicate(one_name)='||count(*) FILTER (WHERE distinct_names <= 1)
               ||'  possible_overhold(multi_name)='||count(*) FILTER (WHERE distinct_names > 1)
               ||'  group_has_published_twin='||count(*) FILTER (WHERE already_published_twin > 0)
            FROM grp"
          echo "=============================================================="
          echo "READING: if possible_overhold is a large share, #525 normalization is suppressing distinct"
          echo "cases and the collision check needs tightening (e.g. require a published twin, or compare"
          echo "case name/decided date). If ~all are true_duplicate, the holds are correct dedup."
          echo "=============================================================="
          REMOTE
