name: Emergency production recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-production-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-emergency-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Free disposable Docker space and recover web app
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DO_USER@$DO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          echo "Disk before cleanup"
          df -h /
          docker system df || true

          # Intentionally do not prune volumes. PostgreSQL and artifact volumes remain intact.
          docker image prune -af || true
          docker builder prune -af || true
          docker container prune -f || true

          echo "Disk after disposable cleanup"
          df -h /
          docker system df || true

          app_id="$(docker ps -a --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}" | head -n1)"
          postgres_id="$(docker ps -a --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=postgres" --format "{{.ID}}" | head -n1)"
          test -n "$app_id"
          test -n "$postgres_id"

          echo "Pausing Jurvio ingestion workers"
          mapfile -t worker_ids < <(docker ps -a --filter "label=com.docker.compose.project=jurvio" --format "{{.ID}} {{.Label \"com.docker.compose.service\"}}" | awk '$2 ~ /^worker/ {print $1}')
          for worker_id in "${worker_ids[@]}"; do
            docker stop --time 30 "$worker_id" >/dev/null || true
            docker update --restart=no "$worker_id" >/dev/null || true
          done

          echo "PostgreSQL readiness"
          docker start "$postgres_id" >/dev/null
          for attempt in $(seq 1 24); do
            if docker exec "$postgres_id" pg_isready -U jurvio -d jurvio >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker exec "$postgres_id" pg_isready -U jurvio -d jurvio

          echo "Restarting web application"
          docker update --restart=unless-stopped "$app_id" >/dev/null
          docker restart --time 30 "$app_id" >/dev/null

          ready=0
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done

          echo "Route checks"
          route_ok=1
          for path in /api/ready /cases /supreme-court; do
            code="$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "http://127.0.0.1:3000$path" || true)"
            printf '%s %s\n' "$path" "$code"
            test "$code" = "200" || route_ok=0
          done

          echo "Sanitized app log tail"
          docker logs --tail 250 "$app_id" 2>&1 |
            sed -E               -e 's#https?://[^[:space:]"'\''<>]+#<url>#g'               -e 's#(DATABASE_URL|PASSWORD|TOKEN|SECRET|AUTHORIZATION|COOKIE)[=:][^[:space:]]+#\1=<redacted>#gI' |
            tail -n 250

          test "$ready" -eq 1
          test "$route_ok" -eq 1
          REMOTE
