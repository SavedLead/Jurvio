name: Emergency production recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-production-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-emergency-production-recovery
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Measure production volumes
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DO_USER@$DO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app_id="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}" | head -n1)"
          postgres_id="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=postgres" --format "{{.ID}}" | head -n1)"
          test -n "$app_id"
          test -n "$postgres_id"

          echo "Filesystem"
          df -h /
          echo "Docker volumes"
          docker system df -v || true
          echo "Artifact directories"
          docker exec "$app_id" sh -lc 'du -h -d 2 /var/lib/jurvio/artifacts 2>/dev/null | sort -h | tail -n 80' || true
          echo "Largest artifact files"
          docker exec "$app_id" sh -lc 'find /var/lib/jurvio/artifacts -type f -printf "%s %p\n" 2>/dev/null | sort -nr | head -n 60' || true
          echo "PostgreSQL directories"
          docker exec "$postgres_id" sh -lc 'du -h -d 2 /var/lib/postgresql/data 2>/dev/null | sort -h | tail -n 40' || true
          REMOTE
