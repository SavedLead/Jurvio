name: Verify DigitalOcean district public feed audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/district-do-validation-once.yml]

permissions:
  contents: read

concurrency:
  group: district-court-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/audit-federal-district-court-feeds.ts > district-court-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: district-court-coverage
          path: district-court-coverage.json
          retention-days: 7
      - name: Inspect scheduler and administrative access
        run: |
          command -v crontab || true
          sudo -n -l 2>/dev/null || true
          systemctl --user is-system-running 2>/dev/null || true
