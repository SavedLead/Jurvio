            FROM ce
            JOIN document_content dc ON dc.document_id=ce.doc_id
            JOIN judicial_opinion jo ON jo.document_id=ce.doc_id
            JOIN raw_artifact da ON da.id=dc.source_artifact_id JOIN provider dp ON dp.id=da.provider_id
