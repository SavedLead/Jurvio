            ('circtdoh'),('circtdor'),('circtdpa'),('circtdpamptico'),('circtdri'),('circtdsc'),('circtdsd'),('circtdterrar'),('circtdtx'),('circtdut'),('circtdva'),('circtdvt'),
            ('circtdwa'),('circtdwi'),('circtdwilm'),('circtdwv'),('circtdwy'),('circtedar'),('circtedil'),('circtedky'),('circtedla'),('circtedmi'),('circtedmo'),('circtednc'),
