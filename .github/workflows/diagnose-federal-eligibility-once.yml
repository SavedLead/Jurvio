            ('sdd'),('southcarolinaed'),('southcarolinawd'),('tax'),('tecoa'),('tennessed'),('tennesseeb'),('texd'),('tneb'),('tned'),('tnmb'),('tnmd'),
            ('tnwb'),('tnwd'),('txeb'),('txed'),('txnb'),('txnd'),('txsb'),('txsd'),('txwb'),('txwd'),('usberlinct'),('uscfc'),
            ('uscirct'),('usdistct'),('usprovctla'),('utb'),('utd'),('vad'),('vaeb'),('vaed'),('vawb'),('vawd'),('vib'),('vid'),
            ('vtb'),('vtd'),('waeb'),('waed'),('washd'),('wawb'),('wawd'),('wieb'),('wied'),('wisd'),('wiwb'),('wiwd'),
            ('wvad'),('wvnb'),('wvnd'),('wvsb'),('wvsd'),('wyb'),('wyd')
          ), cidk AS (
            SELECT case_id, array_agg(identifier_value) AS vals
            FROM case_identifier WHERE identifier_type='courtlistener_docket_id' GROUP BY case_id
          ), dup AS (
            SELECT court_id, lower(trim(docket_number)) AS dk FROM legal_case
            WHERE nullif(trim(docket_number),'') IS NOT NULL GROUP BY 1,2 HAVING count(*)>1
          ), rej AS (
            SELECT DISTINCT source_record_id FROM ingestion_rejection WHERE resolved_at IS NULL
          ), blk AS (
            SELECT DISTINCT object_id FROM publication_decision WHERE NOT displayable
          ), base AS (
            SELECT c.id AS case_id, d.id AS doc_id, dc.word_count, dc.content_hash AS doc_content_hash,
              (ct.provider_court_id IN (SELECT provider_court_id FROM reg)) AS court_ok,
              (lower(coalesce(ct.jurisdiction,'')) IN ('f','fd','fb','fbp','fs','federal')
                OR lower(coalesce(ct.jurisdiction,'')) LIKE '%federal district%'
                OR lower(coalesce(ct.jurisdiction,'')) LIKE '%federal appellate%'
                OR lower(coalesce(ct.jurisdiction,'')) LIKE '%bankruptcy%'
                OR lower(coalesce(ct.jurisdiction,'')) LIKE '%federal special%'
                OR lower(coalesce(ct.jurisdiction,'')) LIKE '%appellate panel%') AS jur_ok,
              (coalesce(c.caption,'')<>'') AS caption_present,
              (coalesce(c.docket_number,'')<>'') AS docket_present,
              (ca.source_record_id IS NOT NULL AND cidk.vals IS NOT NULL AND ca.source_record_id = ANY(cidk.vals)) AS resolves,
              (ct.provider_court_id IS NOT NULL AND cidk.case_id IS NOT NULL) AS linkage,
              (c.source_artifact_id IS NOT NULL AND ca.source_uri ~ '^https?://'
                AND ca.content_hash ~ '^[a-f0-9]{64}\$' AND ca.retrieved_at IS NOT NULL) AS source_ok,
              (dc.word_count IS NOT NULL AND dc.word_count>0) AS readable,
              (coalesce(c.docket_number,'')<>'' AND dup.court_id IS NOT NULL) AS collision,
              (rej.source_record_id IS NOT NULL) AS rejected,
              (concat_ws(' ',c.caption,c.docket_number,d.title) ~* '\m(sealed|restricted|under seal|minor|juvenile|grand jury|qui tam)\M') AS restricted,
              (c.verification IN ('conflict','needs_review')) AS case_conflict
            FROM legal_case c JOIN court ct ON ct.id=c.court_id
            JOIN document d ON d.case_id=c.id AND d.publication='draft'
            JOIN judicial_opinion jo ON jo.document_id=d.id
            JOIN document_content dc ON dc.document_id=d.id
            LEFT JOIN raw_artifact ca ON ca.id=c.source_artifact_id
            LEFT JOIN cidk ON cidk.case_id=c.id
            LEFT JOIN dup ON dup.court_id=c.court_id AND dup.dk=lower(trim(c.docket_number))
            LEFT JOIN rej ON rej.source_record_id=ca.source_record_id
            WHERE c.publication='draft' AND coalesce(ct.provider_court_id,'')<>'scotus'
          ), ce AS (
            SELECT *, (court_ok AND jur_ok AND caption_present AND (docket_present OR (resolves AND linkage))
              AND source_ok AND readable AND NOT collision AND NOT rejected AND NOT restricted AND NOT case_conflict) AS case_eligible
            FROM base
          )
          SELECT 'federal_draft_opinion_docs='||count(*)
             ||' | distinct_cases='||count(DISTINCT case_id)
             ||' | CASE_eligible_docs='||count(*) FILTER (WHERE case_eligible)
             ||' | CASE_eligible_distinct_cases='||count(DISTINCT case_id) FILTER (WHERE case_eligible)
             ||' | blocked_court='||count(*) FILTER (WHERE NOT court_ok)
             ||' | blocked_identity='||count(*) FILTER (WHERE NOT (caption_present AND (docket_present OR (resolves AND linkage))))
             ||' | blocked_source='||count(*) FILTER (WHERE NOT source_ok)
             ||' | blocked_collision='||count(*) FILTER (WHERE collision)
             ||' | blocked_restricted='||count(*) FILTER (WHERE restricted)
             ||' | blocked_case_conflict='||count(*) FILTER (WHERE case_conflict)
          FROM ce;"
          echo "=== (B) OPINION DOCUMENT eligibility among case-eligible ==="
          q "WITH reg(provider_court_id) AS (VALUES
