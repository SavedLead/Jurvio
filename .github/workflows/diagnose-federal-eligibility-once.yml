              AND source_ok AND readable AND NOT collision AND NOT rejected AND NOT restricted AND NOT case_conflict) AS case_eligible
            FROM base
          ), de AS (
            SELECT ce.doc_id,
              (ce.word_count<100) AS thin,
              NOT (ce.doc_content_hash ~ '^[a-f0-9]{64}\$' AND da.content_hash IS NOT NULL) AS no_provenance,
              NOT (dp.code='courtlistener' AND (
                   da.source_uri ~ '^https://www\.courtlistener\.com/api/rest/v[34]/opinions/[0-9]+/\$'
                   OR (da.response_metadata->>'source'='courtlistener_bulk'
                       AND da.source_uri ~ '^https://www\.courtlistener\.com/help/api/bulk-data/#opinion-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+\$'
                       AND da.source_record_id = jo.provider_opinion_id AND oc.id IS NOT NULL))) AS bad_opinion_source,
              (left(dc.content_text,100000) ~* '[0-9]{3}-[0-9]{2}-[0-9]{4}|date of birth|social security number') AS sensitive,
