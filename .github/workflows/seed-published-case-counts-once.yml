name: Seed published case counts (once)

# Replaces each court's published total from the displayable rule, one court
# at a time. It does not run during deploy. A canceled or timed-out run
# resumes from published_count_seed_cursor. It does not cancel bulk publish
# or the search catch-up.
#
# confirm=SEED_PUBLISHED_CASE_COUNTS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SEED_PUBLISHED_CASE_COUNTS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seed-published-case-counts
  cancel-in-progress: false

jobs:
  seed:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    # The walk is one court per transaction. A stopped run resumes from the cursor.
    timeout-minutes: 2880
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "SEED_PUBLISHED_CASE_COUNTS" ]; then
            echo "::error::Refusing to run. confirm must be SEED_PUBLISHED_CASE_COUNTS."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
      - name: Run on the ingestion host
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "bash -s" < scripts/seed-published-case-counts.sh
