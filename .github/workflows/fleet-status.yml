name: Fleet status (read-only)

# TEMPORARY (branch claude/jurvio-website-migration-b764s5 only).
# Safe, additive firewall remediation on jurvio-private-data:
#   - restore all-outbound on the ingestion server (empty outbound blocks it)
#   - allow Postgres(5432)/NFS(2049) inbound from the CURRENT jurvio-public-01 private IP
# Adds only; removes nothing. Never touches inbound SSH openness used by production.
# Restored to original contents before the migration PR is finalized.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-migration-ssh-diagnostic
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 8
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Fix jurvio-private-data outbound + public data-path inbound
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${DO_TOKEN:-}" ] || { echo "::error::DO_TOKEN empty"; exit 1; }
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          pub_priv="$(jq -r '.droplets[] | select(.name=="jurvio-public-01") | (.networks.v4[]|select(.type=="private")|.ip_address)' <<<"$droplets")"
          [ -n "$pub_priv" ] || { echo "::error::could not resolve jurvio-public-01 private IP"; exit 1; }
          echo "jurvio-public-01 private IP = $pub_priv"
          fws="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          fid="$(jq -r '.firewalls[] | select(.name=="jurvio-private-data") | .id' <<<"$fws" | head -1)"
          [ -n "$fid" ] || { echo "::error::jurvio-private-data firewall not found"; exit 1; }
          echo "firewall id = $fid"

          echo "----- BEFORE -----"
          jq -r --arg id "$fid" '.firewalls[] | select(.id==$id) | "in=\(.inbound_rules|map(.protocol+":"+((.ports//"-")|tostring)+"<-"+((.sources.addresses//[])|tostring)))\nout=\(.outbound_rules|map(.protocol+":"+((.ports//"-")|tostring)))"' <<<"$fws"

          out_count="$(jq -r --arg id "$fid" '.firewalls[] | select(.id==$id) | (.outbound_rules // []) | length' <<<"$fws")"
          if [ "$out_count" -eq 0 ]; then
            echo "Adding allow-all outbound to jurvio-private-data (was empty -> blocking ingestion egress)"
            curl -fsS -X POST "${auth[@]}" "$api/firewalls/$fid/rules" -d '{"outbound_rules":[{"protocol":"tcp","ports":"all","destinations":{"addresses":["0.0.0.0/0","::/0"]}},{"protocol":"udp","ports":"all","destinations":{"addresses":["0.0.0.0/0","::/0"]}},{"protocol":"icmp","destinations":{"addresses":["0.0.0.0/0","::/0"]}}]}' >/dev/null
          else
            echo "Outbound rules already present ($out_count); leaving as-is"
          fi

          for port in 5432 2049; do
            if jq -e --arg id "$fid" --arg p "$port" --arg src "$pub_priv/32" '.firewalls[] | select(.id==$id) | .inbound_rules[]? | select(.protocol=="tcp" and .ports==$p and ((.sources.addresses // []) | index($src)))' <<<"$fws" >/dev/null; then
              echo "inbound tcp:$port from $pub_priv already present"
            else
              echo "Adding inbound tcp:$port from $pub_priv/32"
              curl -fsS -X POST "${auth[@]}" "$api/firewalls/$fid/rules" -d "$(jq -n --arg p "$port" --arg src "$pub_priv/32" '{inbound_rules:[{protocol:"tcp",ports:$p,sources:{addresses:[$src]}}]}')" >/dev/null
            fi
          done

          echo "----- AFTER -----"
          fws2="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          jq -r --arg id "$fid" '.firewalls[] | select(.id==$id) | "droplets=\(.droplet_ids)\nin=\(.inbound_rules|map(.protocol+":"+((.ports//"-")|tostring)+"<-addr"+((.sources.addresses//[])|tostring)+"+drop"+((.sources.droplet_ids//[])|tostring)))\nout=\(.outbound_rules|map(.protocol+":"+((.ports//"-")|tostring)+"->"+((.destinations.addresses//[])|tostring)))"' <<<"$fws2"
          echo "REMEDIATION COMPLETE"
