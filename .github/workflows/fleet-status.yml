name: Fleet status (read-only)

# Read-only production heartbeat for the full federal fleet
# (1 Supreme Court + 13 Courts of Appeals + 94 District Courts).
# Reports credential MODE (never secret values), per-court health, queues,
# publishing state, failures, stalled workers, and PACER cost ($0 expected).
# Performs NO writes, NO ingestion, and NO publication.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-fleet-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure production SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            ids="$(docker ps \
              --filter "label=com.docker.compose.project=jurvio" \
              --filter "label=com.docker.compose.service=app" \
              --format "{{.ID}}")"
            set -- $ids
            if [ "$#" -eq 0 ]; then echo "No running Jurvio app container found" >&2; exit 1; fi
            if [ "$#" -ne 1 ]; then echo "Multiple app containers; ambiguous" >&2; exit 1; fi
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE" || { echo "::error::Running Jurvio app container has no configured image"; exit 1; }
          case "$JURVIO_IMAGE" in
            *[!A-Za-z0-9._/@:-]*) echo "::error::Resolved image contains unexpected characters"; exit 1 ;;
          esac
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"
          echo "Resolved active image from the running app container."

      - name: Credential modes (no secret values printed)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T worker-coa sh -lc '
            if [ -n \"\${GOVINFO_API_KEY:-}\" ] && [ \"\$GOVINFO_API_KEY\" != \"DEMO_KEY\" ]; then
              echo \"govinfo=configured\"
            else
              echo \"govinfo=demo-or-missing\"
            fi
            if [ -n \"\${COURTLISTENER_API_TOKEN:-}\" ]; then
              echo \"courtlistener=configured\"
            else
              echo \"courtlistener=unauthenticated\"
            fi
          '"

      - name: Fleet status report (read-only)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/report-fleet-status.mjs"
