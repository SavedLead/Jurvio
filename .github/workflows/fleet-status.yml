name: Fleet status (read-only)

# TEMPORARY DIAGNOSTIC (branch claude/jurvio-website-migration-b764s5 only).
# Read-only. Runs on the builder. Core TCP route test needs no secrets, so it
# works the moment the builder runner is online. Restored before PR is finalized.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-migration-ssh-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 8
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Builder identity (proves runner online)
        shell: bash
        run: |
          set -uo pipefail
          echo "BUILDER ONLINE: host=$(hostname) user=$(whoami) time=$(date -u +%FT%TZ)"
          echo "secret_scope: DO_TOKEN=$([ -n "${DO_TOKEN:-}" ] && echo present || echo empty) DO_SSH_KEY=$([ -n "${DO_SSH_KEY_B64:-}" ] && echo present || echo empty) DO_USER=$([ -n "${INGESTION_USER:-}" ] && echo present || echo empty)"

      - name: TCP route probes builder -> ingestion (no secrets needed)
        shell: bash
        run: |
          set -uo pipefail
          probe() {
            local h="$1" p="$2" rc
            if timeout 8 bash -c "exec 3<>/dev/tcp/$h/$p" 2>/tmp/perr; then echo "TCP $h:$p => OPEN";
            else rc=$?; if [ "$rc" -eq 124 ]; then echo "TCP $h:$p => TIMEOUT (dropped)"; else echo "TCP $h:$p => REFUSED/FAIL rc=$rc ($(tr -d '\n' </tmp/perr))"; fi; fi
          }
          echo "===== builder -> ingestion route probes ====="
          probe 10.116.0.2 22       # ingestion PRIVATE VPC
          probe 104.248.239.68 22   # ingestion PUBLIC
          probe 10.116.0.5 22       # jurvio-public-01 PRIVATE (sanity)

      - name: SSH auth test over each route (needs DO_SSH_KEY + DO_USER)
        if: ${{ env.DO_SSH_KEY_B64 != '' && env.INGESTION_USER != '' }}
        shell: bash
        run: |
          set -uo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for h in 10.116.0.2 104.248.239.68; do ssh-keyscan -T 6 -H "$h" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan $h failed"; done
          sshtest() {
            echo "--- ssh $INGESTION_USER@$1 ---"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new "$INGESTION_USER@$1" '
              echo "  ok connected_as=$(id -un) host=$(hostname)";
              echo "  listen_22=$(ss -tlnH "( sport = :22 )" 2>/dev/null | awk "{print \$4}" | paste -sd, -)";
              echo "  run_sshd=$(test -d /run/sshd && echo present || echo MISSING)";
              echo "  sudo_n=$(sudo -n true 2>/dev/null && echo ok || echo no)"
            ' 2>&1 | sed "s/^/  /" || echo "  SSH FAILED to $1"
          }
          echo "===== SSH auth: PRIVATE route ====="; sshtest 10.116.0.2
          echo "===== SSH auth: PUBLIC route ====="; sshtest 104.248.239.68

      - name: Firewall + droplet power state (needs DO_TOKEN)
        if: ${{ env.DO_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          echo "===== DROPLETS (name/id/status/public/private) ====="
          jq -r '.droplets[] | [.name,(.id|tostring),.status,((.networks.v4[]|select(.type=="public")|.ip_address)//"-"),((.networks.v4[]|select(.type=="private")|.ip_address)//"-")]|@tsv' <<<"$droplets" | sort
          fw="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          echo "===== FIREWALLS ====="
          jq -r '.firewalls[] | "FW \(.name) id=\(.id) droplets=\(.droplet_ids)\n  in=\(.inbound_rules|map(.protocol+":"+((.ports//"-")|tostring)+" addr="+((.sources.addresses//[])|tostring)+" drop="+((.sources.droplet_ids//[])|tostring)))\n  out=\(.outbound_rules|map(.protocol+":"+((.ports//"-")|tostring)+"->"+((.destinations.addresses//[])|tostring)))"' <<<"$fw"
