name: Clear stale Phase 1 builder queue

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=CLEAR_PHASE_ONE_QUEUE.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CLEAR_PHASE_ONE_QUEUE to run this workflow against production"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: jurvio-clear-phase-one-queue
  cancel-in-progress: false

jobs:
  clear:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require confirm=CLEAR_PHASE_ONE_QUEUE
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "CLEAR_PHASE_ONE_QUEUE" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=CLEAR_PHASE_ONE_QUEUE."
            exit 1
          fi
      - name: Cancel stale phase-one runs only
        run: |
          set -euo pipefail
          current="$GITHUB_RUN_ID"
          names='^(CI|Deploy production|Nightly database backup \(out-of-band\)|Verify backup restore \(weekly rehearsal\)|Phase 1 launch gate audit)$'
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id,.name,.status] | @tsv' |
          while IFS=$'\t' read -r id name status; do
            [ "$id" = "$current" ] && continue
            [[ "$status" == queued || "$status" == in_progress || "$status" == waiting || "$status" == pending ]] || continue
            [[ "$name" =~ $names ]] || continue
            echo "Cancelling stale run $id: $name ($status)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
          done
          gh issue comment 426 --repo "$GITHUB_REPOSITORY" --body '1.3 recovery: stale Phase 1 builder runs cleared; preparing one clean backup run.'
