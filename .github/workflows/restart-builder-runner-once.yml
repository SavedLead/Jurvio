name: Restart builder runner once

# Hosted (ubuntu-latest) helper. Ensures jurvio-builder-01 is powered on, then
# SSHes in with the management key and restarts the GitHub Actions runner
# service so queued self-hosted jobs get picked up. Touches only the builder's
# runner service. No ingestion, no DB access, no DNS change.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-restart-builder-runner
  cancel-in-progress: false

jobs:
  restart-runner:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
    steps:
      - name: Resolve builder IP and ensure powered on
        id: builder
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          id="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .id' <<<"$droplets" | head -1)"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::builder not found"; exit 1; }
          status="$(jq -r --argjson id "$id" '.droplets[] | select(.id==$id) | .status' <<<"$droplets")"
          ip="$(jq -r --argjson id "$id" '.droplets[] | select(.id==$id) | .networks.v4[] | select(.type=="public") | .ip_address' <<<"$droplets" | head -1)"
          echo "builder id=$id status=$status ip=$ip"
          if [ "$status" != "active" ]; then
            curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d '{"type":"power_on"}' >/dev/null
            for _ in $(seq 1 30); do
              st="$(curl -fsS "${auth[@]}" "$api/droplets/$id" | jq -r '.droplet.status')"
              [ "$st" = "active" ] && break; sleep 5
            done
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Restart the runner service on the builder
        env:
          BUILDER_IP: ${{ steps.builder.outputs.ip }}
        run: |
          set -euo pipefail
          [ -n "${BUILDER_IP:-}" ] || { echo "::error::no builder IP"; exit 1; }
          # sshd is up whenever the droplet is active, independent of the
          # Actions runner service. Give sshd a moment if the droplet just booted.
          for _ in $(seq 1 20); do
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 \
              "root@$BUILDER_IP" true 2>/dev/null && break
            sleep 5
          done
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "root@$BUILDER_IP" bash -s <<'REMOTE'
          set +e
          echo "===== whoami / uptime ====="
          whoami; uptime
          echo "===== runner service unit ====="
          unit="$(systemctl list-units --type=service --all 2>/dev/null | awk '/actions\.runner/{print $1; exit}')"
          echo "unit=${unit:-<none>}"
          [ -n "$unit" ] && systemctl cat "$unit" 2>/dev/null
          echo "===== ExecStopPost/hook props ====="
          [ -n "$unit" ] && systemctl show "$unit" -p ExecStopPost -p ExecStartPost -p ExecStartPre -p Restart 2>/dev/null
          echo "===== runner dir + .env + hooks ====="
          for d in /opt/actions-runner /root/actions-runner /home/*/actions-runner; do
            [ -d "$d" ] || continue
            echo "dir=$d"; ls -la "$d" 2>/dev/null | head -30
            echo "--- .env ---"; cat "$d/.env" 2>/dev/null
            echo "--- ACTIONS_RUNNER_HOOK refs ---"; grep -rIn 'ACTIONS_RUNNER_HOOK' "$d" 2>/dev/null | head
            echo "--- poweroff/shutdown refs ---"; grep -rIlnE 'poweroff|shutdown|halt|init 0' "$d" 2>/dev/null | head
          done
          echo "===== systemd timers + shutdown-ish units ====="
          systemctl list-timers --all 2>/dev/null | head -30
          systemctl list-unit-files 2>/dev/null | grep -iE 'shutdown|poweroff|idle|autostop|auto-stop|stop-runner'
          echo "===== cron/at ====="
          crontab -l 2>/dev/null; ls -la /etc/cron.d 2>/dev/null; grep -rIsnE 'poweroff|shutdown|halt' /etc/cron* /var/spool/cron 2>/dev/null | head; atq 2>/dev/null
          echo "===== shutdown scripts anywhere obvious ====="
          grep -rIlnE 'poweroff|shutdown -h|halt|init 0' /usr/local/bin /usr/local/sbin /etc/rc.local /etc/systemd/system 2>/dev/null | head
          echo "===== recent shutdown journal ====="
          journalctl --no-pager 2>/dev/null | grep -iE 'poweroff|Powering off|shutdown|reached target Power-Off|systemd-halt' | tail -20
          last -x -n 15 2>/dev/null | grep -iE 'shutdown|reboot' | head
          echo "===== START the runner so queued jobs land ====="
          if [ -n "$unit" ]; then
            systemctl start "$unit" 2>/dev/null; sleep 2
            systemctl is-active "$unit"; systemctl status "$unit" --no-pager 2>/dev/null | head -12
          elif [ -x /opt/actions-runner/svc.sh ]; then
            ( cd /opt/actions-runner && ./svc.sh start; ./svc.sh status )
          else
            echo "::warning::runner service not found"
          fi
          echo "done"
          REMOTE
