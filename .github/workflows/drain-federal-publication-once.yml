name: Drain federal publication (full speed, once)

# Publishes the federal DRAFT backlog at full speed by running the deterministic
# publication-quarantine loop with a high item cap and normal concurrency (NOT the
# single-threaded doc-capped pilot path). Every case still passes the publication gate, so
# sealed/restricted/sensitive and thin/duplicate records are HELD, never published -- that
# protection is independent of speed. Idempotent: already-published cases are skipped, so this
# can be re-run to drain the remaining backlog in successive passes (each pass publishes up to
# max_items, the absolute runaway ceiling being 100000). Prints before/after published counts
# and the publisher's own result line.

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Max cases to publish this pass (clamped to 100000)"
        required: false
        default: "100000"
        type: string
      max_concurrency:
        description: "Publisher concurrency (1-16)"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-production
  cancel-in-progress: false

jobs:
  drain:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 120
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      MAX_ITEMS: ${{ inputs.max_items }}
      MAX_CC: ${{ inputs.max_concurrency }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Full-speed publication drain over private VPC
        run: |
          set -uo pipefail
          case "${MAX_ITEMS:-100000}" in ''|*[!0-9]*) echo "::error::max_items must be numeric"; exit 1;; esac
          case "${MAX_CC:-8}" in ''|*[!0-9]*) echo "::error::max_concurrency must be numeric"; exit 1;; esac
          ssh "$INGESTION_USER@$DB_HOST" "MAX_ITEMS='${MAX_ITEMS:-100000}' MAX_CC='${MAX_CC:-8}' bash -se" <<'REMOTE'
          set -uo pipefail
          MAX="${MAX_ITEMS:-100000}"; CC="${MAX_CC:-8}"
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          worker="$(find_svc worker-core)"; pg="$(find_svc postgres)"
          [ -n "$worker" ] && [ -n "$pg" ] || { echo "::error::worker/pg missing"; exit 1; }
          q() { sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "$1" 2>/dev/null; }
          FED="(court.verification='verified' OR lower(coalesce(court.jurisdiction,'')) IN ('f','fd','fb','fbp','fs','federal'))"

          BEFORE="$(q "SELECT count(*) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE legal_case.publication='published' AND ${FED}")"
          echo "federal_cases_published_before=${BEFORE}  (cap this pass: ${MAX}, concurrency ${CC})"
          echo "=== running publication-quarantine --publish=1 --max-items=${MAX} ==="
          sudo -n docker exec "$worker" node jobs/run-federal-ingestion-loop.mjs \
            --loop=publication-quarantine --publish=1 --max-items="${MAX}" \
            --max-concurrency="${CC}" --start-concurrency="${CC}" 2>&1 | tail -n 40
          rc="${PIPESTATUS[0]}"
          AFTER="$(q "SELECT count(*) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE legal_case.publication='published' AND ${FED}")"
          REMAIN="$(q "SELECT count(*) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE legal_case.publication='draft' AND ${FED}")"
          echo "=== DRAIN RESULT: published_before=${BEFORE} published_after=${AFTER} newly_published=$(( AFTER - BEFORE )) federal_draft_remaining=${REMAIN} node_rc=${rc} ==="
          echo "=== DONE ==="
          REMOTE
