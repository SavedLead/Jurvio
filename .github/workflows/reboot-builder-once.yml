name: Reboot builder once

# Stays on ubuntu-latest. This job power-cycles jurvio-builder-01. A job
# placed on that machine cannot reboot it, and cannot start when the runner
# is already down.
#
# Hosted helper that power-cycles jurvio-builder-01 via the
# DigitalOcean API. Inbound SSH to the builder is firewalled, so the only way
# to run anything on it is a self-hosted job; but the runner exits after one
# job and only re-registers on boot. Rebooting makes the runner come back and
# claim queued self-hosted jobs. Touches only the builder droplet's power
# state. No ingestion, no public-server, no DNS change.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=REBOOT_BUILDER.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REBOOT_BUILDER to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-reboot-builder
  cancel-in-progress: false

jobs:
  reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Require confirm=REBOOT_BUILDER
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REBOOT_BUILDER" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=REBOOT_BUILDER."
            exit 1
          fi
      - name: Power-cycle jurvio-builder-01
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          id="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .id' <<<"$droplets" | head -1)"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::builder not found"; exit 1; }
          status="$(jq -r --argjson id "$id" '.droplets[] | select(.id==$id) | .status' <<<"$droplets")"
          echo "jurvio-builder-01 id=$id status=$status"
          if [ "$status" = "active" ]; then
            echo "Issuing power_cycle (reboot) ..."
            curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d '{"type":"power_cycle"}' >/dev/null
          else
            echo "Issuing power_on ..."
            curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d '{"type":"power_on"}' >/dev/null
          fi
          for _ in $(seq 1 40); do
            st="$(curl -fsS "${auth[@]}" "$api/droplets/$id" | jq -r '.droplet.status')"
            echo "status=$st"
            [ "$st" = "active" ] && { echo "Builder active."; break; }
            sleep 5
          done
