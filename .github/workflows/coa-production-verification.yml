name: COA production verification

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=COA_PRODUCTION_VERIFICATION.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type COA_PRODUCTION_VERIFICATION to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-coa-production-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 25
    steps:
      - name: Require confirm=COA_PRODUCTION_VERIFICATION
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "COA_PRODUCTION_VERIFICATION" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=COA_PRODUCTION_VERIFICATION."
            exit 1
          fi
      - name: Configure production SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run GovInfo production cycle and report
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          compose=(docker compose -f docker-compose.production.yml)

          echo "=== COA worker ==="
          "${compose[@]}" ps worker-coa

          echo "=== GovInfo credential ==="
          "${compose[@]}" exec -T worker-coa sh -lc '
            if [ -n "$${GOVINFO_API_KEY:-}" ] && [ "$GOVINFO_API_KEY" != "DEMO_KEY" ]; then
              echo "personal-key-configured"
            else
              echo "demo-or-missing"
              exit 2
            fi
          '

          echo "=== Baseline ledger ==="
          "${compose[@]}" exec -T worker-coa node jobs/report-appellate-backfill.mjs

          echo "=== Personal-key GovInfo cycle ==="
          timeout 18m "${compose[@]}" exec -T worker-coa node jobs/ingest-govinfo-appellate.mjs --court=all --pages-per-court=1

          echo "=== Updated ledger ==="
          "${compose[@]}" exec -T worker-coa node jobs/report-appellate-backfill.mjs

          echo "=== Recent GovInfo scheduler evidence ==="
          "${compose[@]}" logs --since 2h worker-coa 2>&1 | grep -Ei 'govinfo|429|published|staged|inserted|summary' | tail -n 250 || true
          REMOTE
