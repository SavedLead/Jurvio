name: CourtListener citation map import on builder (throttled)

# Plan C8 (ADR 0090): streams the CourtListener bulk citation map (78.4M rows),
# parentheticals (~6.6M) and, for cluster mapping, one pass of the opinions
# export straight from the free public bulk-data bucket (never the REST API) on
# THIS builder runner, and writes throttled batches to Postgres on web-01 over
# the private VPC. Nothing is stored on either disk. Each phase checkpoints and
# resumes; run with dry_run=true first to size DB growth.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts); fails closed
  # unless confirm=CITATION_MAP_IMPORT.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CITATION_MAP_IMPORT to run against production"
        required: true
        type: string
      phase:
        description: "all, or a comma list of edges,parentheticals,clusters,finalize"
        required: false
        default: 'all'
        type: string
      dry_run:
        description: "true = read and count only, write nothing"
        required: false
        default: 'true'
        type: string
      snapshot:
        description: CourtListener bulk snapshot date
        required: false
        default: '2026-09-30'
        type: string
      minutes:
        description: Stop starting batches after this many minutes (max 330)
        required: false
        default: '320'
        type: string
      batch:
        description: Rows per write batch (100-100000)
        required: false
        default: '20000'
        type: string
      pause_ms:
        description: Pause between batches in ms
        required: false
        default: '200'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: jurvio-citation-map-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 350
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_CPUS: '2'
      JOB_MEMORY: 3000m
      PHASE: ${{ inputs.phase }}
      DRY_RUN: ${{ inputs.dry_run }}
      SNAPSHOT: ${{ inputs.snapshot }}
      MINUTES: ${{ inputs.minutes }}
      BATCH: ${{ inputs.batch }}
      PAUSE_MS: ${{ inputs.pause_ms }}
    steps:
      - name: Require confirm=CITATION_MAP_IMPORT
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "CITATION_MAP_IMPORT" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=CITATION_MAP_IMPORT."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$PHASE" =~ ^(all|(edges|parentheticals|clusters|finalize)(,(edges|parentheticals|clusters|finalize))*)$ ]] || { echo "::error::bad phase"; exit 1; }
          [[ "$DRY_RUN" =~ ^(true|false)$ ]] || { echo "::error::dry_run true|false"; exit 1; }
          [[ "$SNAPSHOT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::snapshot YYYY-MM-DD"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 330 ] || { echo "::error::minutes 1-330"; exit 1; }
          [[ "$BATCH" =~ ^[0-9]+$ ]] && [ "$BATCH" -ge 100 ] && [ "$BATCH" -le 100000 ] || { echo "::error::batch 100-100000"; exit 1; }
          [[ "$PAUSE_MS" =~ ^[0-9]+$ ]] && [ "$PAUSE_MS" -le 60000 ] || { echo "::error::pause_ms 0-60000"; exit 1; }
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Stream and import the citation map
        run: |
          set -euo pipefail
          out="$(mktemp)"
          bash scripts/ops/builder-job.sh jobs/import-courtlistener-citation-map.mjs \
            --phase="$PHASE" --dry-run="$DRY_RUN" --snapshot="$SNAPSHOT" \
            --budget-seconds="$((MINUTES * 60))" --batch="$BATCH" --pause-ms="$PAUSE_MS" 2>&1 | tee "$out"
          grep -E '^\{"citationMap"' "$out" | grep -E '"state":"(done|stopped|end)"' | while IFS= read -r line; do
            echo "::notice title=Citation map import::${line}"
          done || true
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config
