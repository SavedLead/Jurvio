name: Scout CourtListener bulk people-db (one-shot, read-only)

# Discovers the current CourtListener bulk-data people-db files (people +
# positions CSVs on public S3 — no token, no rate limit) and dumps their headers
# + a couple of sample rows, so the Article I enrichment importer is written
# against the real columns. Runs on the builder. No VPC and no writes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-scout-cl-bulk-people-once
  cancel-in-progress: false

jobs:
  scout:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 12
    env:
      BULK: https://com-courtlistener-storage.s3.amazonaws.com
    steps:
      - name: Discover people-db bulk files and dump headers
        run: |
          set +e  # never let a broken pipe / empty match fail the recon
          people=$(curl -s "$BULK/?list-type=2&prefix=bulk-data/people-db-people" | tr '<' '\n' | grep -ioE 'bulk-data/people-db-people-[0-9-]*\.csv\.bz2' | sort -u | tail -1)
          positions=$(curl -s "$BULK/?list-type=2&prefix=bulk-data/people-db-positions" | tr '<' '\n' | grep -ioE 'bulk-data/people-db-positions-[0-9-]*\.csv\.bz2' | sort -u | tail -1)
          echo "latest people file:    $people"
          echo "latest positions file: $positions"

          echo ""
          echo "=== people-db-people: HEADER ==="
          curl -s "$BULK/$people" | bzcat 2>/dev/null | head -1 | tr ',' '\n' | cat -n
          echo "--- 1 sample row (first 1200 chars) ---"
          curl -s "$BULK/$people" | bzcat 2>/dev/null | sed -n '2p' | cut -c1-1200

          echo ""
          echo "=== people-db-positions: HEADER ==="
          curl -s "$BULK/$positions" | bzcat 2>/dev/null | head -1 | tr ',' '\n' | cat -n
          echo "--- sample position rows 2-4 (codes + court_id format) ---"
          curl -s "$BULK/$positions" | bzcat 2>/dev/null | sed -n '2,4p' | cut -c1-800
          echo "done"
