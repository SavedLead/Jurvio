name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "ops/deploy-hosted-login.trigger"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional verified main commit SHA (defaults to current main)"
        required: false
        type: string

permissions:
  checks: read
  contents: read
  packages: write

concurrency:
  # THE single deploy lock for jurvio-web-01. Only one production deployment can
  # run at a time; a second dispatch queues rather than running concurrently.
  # cancel-in-progress:false so a queued release never kills an active one — and
  # because GitHub keeps only the latest pending run per group, an older run can
  # never jump ahead of a newer one. deploy-ingestion.yml no longer deploys, so
  # this workflow is the only writer to the box and this is the only lock needed.
  group: jurvio-production
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.resolve.outputs.current }}
      deploy: ${{ steps.resolve.outputs.deploy }}
    steps:
      - id: resolve
        name: Resolve deploy commit (always current main, never older)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          LATEST_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ -n "${INPUT_SHA:-}" ]; then
            # A pinned commit may deploy ONLY if it is still the tip of main. This
            # makes it impossible to (re)deploy an older or side commit — an
            # older queued/manual run is refused here instead of overwriting a
            # newer release.
            if [ "$INPUT_SHA" = "$LATEST_MAIN_SHA" ]; then
              echo "deploy=$LATEST_MAIN_SHA" >> "$GITHUB_OUTPUT"
              echo "current=true" >> "$GITHUB_OUTPUT"
              echo "Deploying pinned commit $INPUT_SHA (== current main)."
            else
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "Refusing pinned commit $INPUT_SHA; current main is $LATEST_MAIN_SHA. Not deploying an older/other commit."
            fi
          else
            # No pin: always deploy the CURRENT tip of main, resolved now — so a
            # queued or manual run always releases current main, never a stale
            # dispatch-time commit.
            echo "deploy=$LATEST_MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Deploying current main commit $LATEST_MAIN_SHA."
          fi

  build:
    needs: release-gate
    if: ${{ needs.release-gate.outputs.current == 'true' }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    env:
      # The commit resolved by the gate (current main). All build steps below
      # check out and tag this exact commit.
      DEPLOY_COMMIT: ${{ needs.release-gate.outputs.deploy }}
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Require successful CI for commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ env.DEPLOY_COMMIT }}
        run: |
          set -euo pipefail
          echo "CI completed successfully for $COMMIT_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:$DEPLOY_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [release-gate, build]
    # Deploy from the fixed DigitalOcean builder network. GitHub-hosted runner
    # addresses rotate and are blocked by the production SSH firewall.
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    env:
      DEPLOY_COMMIT: ${{ needs.release-gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
      - id: guard
        name: Abort if superseded by a newer main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Final safety check at the moment of release: if main advanced while
          # this run was building, this (now-older) release must NOT overwrite
          # the newer one. The box-mutating steps below are gated on fresh=true,
          # so a superseded run copies nothing and swaps nothing — it just ends
          # cleanly. The concurrency lock + latest-pending-wins already order
          # runs; this closes the build-duration window as defence in depth.
          # Uses the raw-SHA media type so no jq/gh is needed on the builder.
          LATEST_MAIN_SHA="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main")"
          if [ "$DEPLOY_COMMIT" = "$LATEST_MAIN_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Confirmed $DEPLOY_COMMIT is still current main; releasing."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded release skipped::main advanced to $LATEST_MAIN_SHA after this release ($DEPLOY_COMMIT) was gated; skipping box changes so this older run cannot overwrite the newer release."
          fi
      - name: Configure SSH
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64" || { echo "::error::DO_SSH_KEY_B64 is empty"; exit 1; }
          case "$DO_SSH_KEY_B64" in *[!A-Za-z0-9+/=]*) echo "::error::DO_SSH_KEY_B64 is not one-line base64"; exit 1;; esac
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { rm -f ~/.ssh/id_ed25519; echo "::error::Decoded SSH private key is invalid or passphrase-protected"; exit 1; }
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Reuse a single SSH connection across every deploy step (multiplexing)
          # so the release does not open ~6 separate connections in quick
          # succession. Bursty connections were being dropped by the droplet
          # (ssh "Connection timed out" at a later step, after earlier ones
          # succeeded) — the signature of SSH connection-rate limiting
          # (fail2ban / sshd MaxStartups). One persistent master connection
          # stays well under any such limit.
          {
            echo "Host *"
            echo "  ControlMaster auto"
            echo "  ControlPath ~/.ssh/cm-%r@%h:%p"
            echo "  ControlPersist 600"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 4"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Copy release controls
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          timeout --signal=TERM --kill-after=30s 120s ssh $SSH_OPTS "$DO_USER@$DO_HOST" 'mkdir -p /opt/jurvio/scripts'
          timeout --signal=TERM --kill-after=30s 180s scp $SSH_OPTS docker-compose.production.yml "$DO_USER@$DO_HOST:/opt/jurvio/docker-compose.production.yml"
          timeout --signal=TERM --kill-after=30s 180s scp $SSH_OPTS scripts/release-production.sh scripts/backup-production.sh "$DO_USER@$DO_HOST:/opt/jurvio/scripts/"
          timeout --signal=TERM --kill-after=30s 180s scp $SSH_OPTS ops/nginx-jurvio.conf "$DO_USER@$DO_HOST:/opt/jurvio/nginx-jurvio.conf"
      - name: Install reverse proxy configuration
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        id: nginx
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -uo pipefail
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          # nginx refresh is best-effort so it can NEVER block the application
          # image release + worker restart. A failure here is reported LOUDLY
          # (warning annotation + job summary + full remote output) — it is not
          # swallowed silently. The proper fix is to restore the deploy user's
          # limited passwordless sudo for the nginx commands (see PR body).
          set +e
          out="$(timeout --signal=TERM --kill-after=30s 120s ssh $SSH_OPTS "$DO_USER@$DO_HOST" \
            "sudo -n install -m 644 /opt/jurvio/nginx-jurvio.conf /etc/nginx/sites-available/jurvio && sudo -n nginx -t && sudo -n systemctl reload nginx" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
            echo "nginx configuration installed, validated, and reloaded."
          else
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            printf 'nginx refresh FAILED (exit %s):\n%s\n' "$rc" "$out"
            echo "::warning title=nginx not refreshed::nginx reverse-proxy config could NOT be refreshed (exit ${rc}). The application image and workers still deploy; the running nginx config is left in place. Restore the deploy user's passwordless sudo for the nginx commands to re-enable automatic refresh."
            {
              echo "### ⚠️ nginx was NOT refreshed on this release"
              echo ""
              echo "The application image release and worker restart proceeded. The nginx reverse-proxy config on the droplet was **left in place** because it could not be updated (exit ${rc})."
              echo ""
              echo "**Remote output:**"
              echo '```'
              printf '%s\n' "$out"
              echo '```'
              echo ""
              echo "**Consequence:** any pending nginx change (e.g. new \`server_name\` routing) is NOT applied until this is resolved. Public case-page serving is unaffected when its config is unchanged."
              echo "**Fix:** restore the deploy user's limited passwordless sudo for the nginx commands (\`install\`, \`nginx -t\`, \`systemctl reload nginx\`), then re-run the deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Authenticate image registry
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          printf '%s' "$GH_TOKEN" | timeout --signal=TERM --kill-after=30s 120s ssh $SSH_OPTS "$DO_USER@$DO_HOST" 'docker login ghcr.io -u SavedLead --password-stdin'
      - name: Release and verify
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          JURVIO_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4"
          timeout --signal=TERM --kill-after=30s 1500s ssh $SSH_OPTS "$DO_USER@$DO_HOST" "chmod 700 /opt/jurvio/scripts/*.sh && JURVIO_IMAGE='$JURVIO_IMAGE' /opt/jurvio/scripts/release-production.sh"
      - name: Verify hosted command-center login externally
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        run: |
          set -euo pipefail
          login_body="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --max-time 30 https://z.jurvio.com/login)"
          # Case-insensitive match: the page renders "Private command center" in the
          # HTML and only APPEARS uppercase via CSS (text-transform). A case-sensitive
          # grep for the uppercase string never matched the served markup, which
          # false-failed every deploy at this gate even though the release succeeded.
          printf '%s' "$login_body" | grep -Fiq "PRIVATE COMMAND CENTER" || {
            echo "::error::z.jurvio.com/login did not return the hosted Jurvio login page"
            exit 1
          }
          public_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 https://jurvio.com/login)"
          test "$public_status" = "404" || {
            echo "::error::jurvio.com/login must remain hidden; received HTTP $public_status"
            exit 1
          }
          echo "Hosted login is live and the public-domain admin boundary remains closed."
