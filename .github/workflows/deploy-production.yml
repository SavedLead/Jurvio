name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - ".github/deploy-kickoff"
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_commit:
        description: "Tested commit SHA to deploy"
        required: true

permissions:
  checks: read
  contents: read
  packages: write

env:
  DEPLOY_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'push' && github.sha || inputs.image_commit }}

concurrency:
  group: jurvio-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Require successful CI for commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ env.DEPLOY_COMMIT }}
        run: |
          successful=0
          for attempt in $(seq 1 60); do
            successful=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/check-runs" --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success")] | length')
            if [ "$successful" -ge 1 ]; then break; fi
            sleep 15
          done
          test "$successful" -ge 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
      - name: Configure SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64" || { echo "::error::DO_SSH_KEY_B64 is empty"; exit 1; }
          case "$DO_SSH_KEY_B64" in *[!A-Za-z0-9+/=]*) echo "::error::DO_SSH_KEY_B64 is not one-line base64"; exit 1;; esac
          if ! printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::DO_SSH_KEY_B64 could not be decoded"
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::Decoded SSH private key is invalid or passphrase-protected"
            exit 1
          fi
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy release controls
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" 'mkdir -p /opt/jurvio/scripts'
          scp docker-compose.production.yml "$DO_USER@$DO_HOST:/opt/jurvio/docker-compose.production.yml"
          scp scripts/release-production.sh scripts/backup-production.sh "$DO_USER@$DO_HOST:/opt/jurvio/scripts/"
      - name: Authenticate image registry
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | ssh "$DO_USER@$DO_HOST" 'docker login ghcr.io -u SavedLead --password-stdin'
      - name: Release and verify
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          JURVIO_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh "$DO_USER@$DO_HOST" "chmod 700 /opt/jurvio/scripts/*.sh && JURVIO_IMAGE='$JURVIO_IMAGE' /opt/jurvio/scripts/release-production.sh"
