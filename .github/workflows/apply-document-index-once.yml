name: Apply document index once

# Self-hosted (builder) job that applies migration 0101 (the missing
# document.case_id index) to the production DB and confirms the homepage query
# is now fast. It runs a single additive CREATE INDEX IF NOT EXISTS (no data,
# schema-column, role, or security change), records the migration as applied so
# the normal migrate path stays consistent, refreshes stats, and re-times the
# homepage query. No ingestion data is modified; no DNS change.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-apply-document-index
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 12
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Create index, record migration, re-time homepage
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -e
          cid="$(sudo -n docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')"
          if [ -z "$cid" ]; then echo "No postgres container found"; exit 1; fi
          echo "postgres container: $cid"
          sudo -n docker exec -i "$cid" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 <<'SQL'
          \timing on
          \echo '--- create the missing document.case_id index (idempotent) ---'
          CREATE INDEX IF NOT EXISTS document_case_idx ON document (case_id, updated_at DESC);
          \echo '--- record migration 0101 as applied (keeps db:migrate consistent) ---'
          CREATE TABLE IF NOT EXISTS schema_migration (name text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());
          INSERT INTO schema_migration (name) VALUES ('0101_document_case_id_index.sql') ON CONFLICT DO NOTHING;
          \echo '--- refresh stats for the new index ---'
          ANALYZE document;
          \echo '--- homepage query timing after index (bounded 60s) ---'
          SET statement_timeout='60s';
          SELECT legal_case.public_id AS "publicId",
            legal_case.caption,
            legal_case.docket_number AS "docketNumber",
            court.name AS "courtName",
            GREATEST(
              legal_case.updated_at,
              COALESCE(legal_case.source_updated_at, legal_case.updated_at),
              COALESCE((SELECT max(docket_entry.updated_at) FROM docket_entry WHERE docket_entry.case_id = legal_case.id), legal_case.updated_at),
              COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)), legal_case.updated_at)
            )::text AS "activityDate",
            EXISTS (SELECT 1 FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)) AS "hasPublicDocument"
          FROM legal_case
          JOIN court ON court.id = legal_case.court_id
          WHERE legal_case.publication = 'published'
            AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'legal_case' AND decision.object_id = legal_case.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)
          ORDER BY "activityDate" DESC, legal_case.id
          LIMIT 6;
          SQL
          REMOTE
