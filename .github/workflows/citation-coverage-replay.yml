name: Refresh citation coverage after rollout
on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=CITATION_COVERAGE_REPLAY.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CITATION_COVERAGE_REPLAY to run this workflow against production"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: jurvio-citation-coverage-replay
  cancel-in-progress: false
jobs:
  replay:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Require confirm=CITATION_COVERAGE_REPLAY
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "CITATION_COVERAGE_REPLAY" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=CITATION_COVERAGE_REPLAY."
            exit 1
          fi
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Requeue existing content only after the new worker is running
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          app="$(sudo -n docker ps --filter label=com.docker.compose.project=jurvio --filter label=com.docker.compose.service=worker-core --format '{{.ID}}' | head -n1)"
          postgres="$(sudo -n docker ps --filter label=com.docker.compose.project=jurvio --filter label=com.docker.compose.service=postgres --format '{{.ID}}' | head -n1)"
          test -n "$app" && test -n "$postgres"
          # Refuse a replay under the old worker: the public migration can finish
          # before production's backup and worker replacement.
          sudo -n docker exec "$app" node -e 'const fs=require("node:fs"); if(!fs.readFileSync("jobs/run-case-citations.mjs","utf8").includes("reporter-citations-v2-flp-3.2.66"))process.exit(1)'
          sudo -n docker exec "$app" node -e 'const fs=require("node:fs"); if(!fs.readFileSync("jobs/run-case-citations.mjs","utf8").includes("visible_sources AS MATERIALIZED"))process.exit(1)'
          worker_started_at="$(sudo -n docker inspect -f '{{.State.StartedAt}}' "$app")"
          sudo -n docker exec -i "$postgres" psql -v ON_ERROR_STOP=1 -v worker_started_at="$worker_started_at" -U jurvio -d jurvio <<'SQL'
          BEGIN;
          SET LOCAL statement_timeout='120s';
          -- A disconnected old worker can leave a long SELECT running and its
          -- session advisory lock held until PostgreSQL notices the disconnect.
          -- Inspect that exact lock, then release ONLY a holder whose
          -- connection predates the running worker container's replacement.
          -- A current worker or an unrelated database session is never targeted.
          SELECT a.pid,a.backend_start,a.state,a.wait_event_type,a.wait_event,
            left(a.query,240) AS query_prefix
          FROM pg_stat_activity a JOIN pg_locks l ON l.pid=a.pid
          WHERE l.locktype='advisory' AND l.granted AND l.objsubid=1
            AND l.database=(SELECT oid FROM pg_database WHERE datname=current_database())
            AND l.objid=((hashtext('jurvio-case-citations-v1')::bigint & 4294967295)::oid)
            AND l.classid=(((hashtext('jurvio-case-citations-v1')::bigint >> 32) & 4294967295)::oid);
          SELECT a.pid,pg_terminate_backend(a.pid) AS released_orphaned_citation_lock
          FROM pg_stat_activity a JOIN pg_locks l ON l.pid=a.pid
          WHERE l.locktype='advisory' AND l.granted AND l.objsubid=1
            AND l.database=(SELECT oid FROM pg_database WHERE datname=current_database())
            AND l.objid=((hashtext('jurvio-case-citations-v1')::bigint & 4294967295)::oid)
            AND l.classid=(((hashtext('jurvio-case-citations-v1')::bigint >> 32) & 4294967295)::oid)
            AND a.backend_type='client backend'
            AND a.backend_start<:'worker_started_at'::timestamptz
            AND a.pid<>pg_backend_pid();
          INSERT INTO case_citation_work(case_id)
          SELECT id FROM legal_case c WHERE official_citation IS NOT NULL
            OR EXISTS(SELECT 1 FROM opinion_cluster cl WHERE cl.case_id=c.id)
          ON CONFLICT(case_id) DO NOTHING;
          INSERT INTO document_citation_work(document_id)
          SELECT document_id FROM document_content
          ON CONFLICT(document_id) DO NOTHING;
          COMMIT;
          SQL
          sudo -n docker exec "$app" node jobs/report-case-citations.mjs
          sudo -n docker logs --since 15m --tail 2000 "$app" 2>&1 | grep -Ei 'citation|"synced"|discovery_remaining' || true
          REMOTE
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
