name: Verify case citation graph
on:
  push:
    branches: [main]
    paths: ["ops/citation-report.trigger"]
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  report:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Report citation backfill and public samples
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          app="$(sudo -n docker ps --filter label=com.docker.compose.project=jurvio --filter label=com.docker.compose.service=worker-core --format '{{.ID}}' | head -n1)"
          test -n "$app"
          sudo -n docker exec "$app" node jobs/report-case-citations.mjs
          REMOTE
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
