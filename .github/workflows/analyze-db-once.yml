name: Analyze DB once

# Self-hosted (builder) maintenance: runs ANALYZE on the production DB to
# refresh planner statistics (they are badly stale: the planner estimates the
# 31-row document table at 81k rows, producing a 1.3e11-cost plan that makes
# the homepage query exceed 25s). ANALYZE only updates pg_statistic — it does
# NOT change table data, schema, roles, or security, and takes only a
# SHARE UPDATE EXCLUSIVE lock (reads/writes/ingestion continue). After ANALYZE
# it re-times the homepage query to confirm the fix. No DNS change.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-analyze-db
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 12
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: ANALYZE and re-time homepage query
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -e
          cid="$(sudo -n docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')"
          if [ -z "$cid" ]; then echo "No postgres container found"; exit 1; fi
          echo "postgres container: $cid"
          sudo -n docker exec -i "$cid" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 <<'SQL'
          \timing on
          \echo '--- ANALYZE (refresh planner statistics) ---'
          ANALYZE;
          \echo '--- corrected estimates ---'
          SELECT relname, n_live_tup, last_analyze, last_autoanalyze
          FROM pg_stat_user_tables
          WHERE relname IN ('legal_case','docket_entry','document','publication_decision','court')
          ORDER BY n_live_tup DESC;
          \echo '--- homepage query timing after ANALYZE (bounded 60s) ---'
          SET statement_timeout='60s';
          SELECT legal_case.public_id AS "publicId",
            legal_case.caption,
            legal_case.docket_number AS "docketNumber",
            court.name AS "courtName",
            GREATEST(
              legal_case.updated_at,
              COALESCE(legal_case.source_updated_at, legal_case.updated_at),
              COALESCE((SELECT max(docket_entry.updated_at) FROM docket_entry WHERE docket_entry.case_id = legal_case.id), legal_case.updated_at),
              COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)), legal_case.updated_at)
            )::text AS "activityDate",
            EXISTS (SELECT 1 FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)) AS "hasPublicDocument"
          FROM legal_case
          JOIN court ON court.id = legal_case.court_id
          WHERE legal_case.publication = 'published'
            AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'legal_case' AND decision.object_id = legal_case.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)
          ORDER BY "activityDate" DESC, legal_case.id
          LIMIT 6;
          \echo '--- plan cost after ANALYZE ---'
          EXPLAIN
          SELECT legal_case.public_id, GREATEST(legal_case.updated_at, COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = legal_case.id), legal_case.updated_at))::text
          FROM legal_case JOIN court ON court.id = legal_case.court_id
          WHERE legal_case.publication = 'published'
          ORDER BY 2 DESC, legal_case.id LIMIT 6;
          SQL
          REMOTE
