name: DigitalOcean inventory (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/do-inventory-temporary.yml
  push:
    branches:
      - agent/do-inventory-20260805
    paths-ignore:
      - .do-inventory-safe.json

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify scoped token and collect read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DO_TOKEN"
          mkdir -p inventory
          for endpoint in account projects droplets vpcs account/keys sizes; do
            file="${endpoint//\//_}.json"
            status=$(curl --silent --show-error --output "inventory/$file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $DO_TOKEN" \
              --header "Content-Type: application/json" \
              "https://api.digitalocean.com/v2/$endpoint")
            if [ "$status" != "200" ]; then
              echo "::error::DigitalOcean endpoint $endpoint returned HTTP $status"
              jq -r '.message // "Unknown API error"' "inventory/$file" || true
              exit 1
            fi
          done
          registry_status=$(curl --silent --show-error --output inventory/registry.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $DO_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/registry")
          if [ "$registry_status" = "404" ]; then
            echo '{"registry":null}' > inventory/registry.json
          elif [ "$registry_status" != "200" ]; then
            echo "::error::DigitalOcean endpoint registry returned HTTP $registry_status"
            exit 1
          fi
          jq '{account:{status:.account.status, droplet_limit:.account.droplet_limit}}' inventory/account.json > inventory/account.safe.json
          jq '{projects:[.projects[]|{id,name,purpose,environment,is_default}]}' inventory/projects.json > inventory/projects.safe.json
          jq '{droplets:[.droplets[]|{id,name,memory,vcpus,disk,status,features,region:{slug:.region.slug,name:.region.name},size:{slug:.size.slug,price_monthly:.size.price_monthly,price_hourly:.size.price_hourly},vpc_uuid,tags}]}' inventory/droplets.json > inventory/droplets.safe.json
          jq '{vpcs:[.vpcs[]|{id,name,region,ip_range,default}]}' inventory/vpcs.json > inventory/vpcs.safe.json
          jq '{ssh_keys:[.ssh_keys[]|{id,name,fingerprint}]}' inventory/account_keys.json > inventory/ssh_keys.safe.json
          jq '{sizes:[.sizes[]|select((.regions|index("nyc1")) and (.memory>=4096) and (.memory<=8192) and (.vcpus>=2) and (.vcpus<=4) and (.available==true))|{slug,memory,vcpus,disk,transfer,price_monthly,price_hourly,description}]}' inventory/sizes.json > inventory/sizes.safe.json
          jq '{registry:(if .registry then {name:.registry.name,region:.registry.region,storage_usage_bytes:.registry.storage_usage_bytes,subscription:.registry.subscription} else null end)}' inventory/registry.json > inventory/registry.safe.json
          jq -s 'add' inventory/*.safe.json > safe.json
      - name: Write safe inventory to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          content=$(base64 -w0 safe.json)
          jq -n --arg message "record safe DigitalOcean inventory" --arg content "$content" --arg branch "agent/do-inventory-20260805" \
            '{message:$message,content:$content,branch:$branch}' > payload.json
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.do-inventory-safe.json" \
            --data-binary @payload.json
