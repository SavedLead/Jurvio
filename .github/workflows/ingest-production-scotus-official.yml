name: Ingest official Supreme Court opinions

on:
  workflow_dispatch:
    inputs:
      term:
        description: Supreme Court term (two-digit year)
        required: true
        default: "25"
      limit:
        description: Maximum official opinions (1-100)
        required: true
        default: "10"
      resume:
        description: Resume after the last successful official-source checkpoint
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: jurvio-production-scotus-official-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate bounded batch
        env:
          TERM_YEAR: ${{ inputs.term }}
          LIMIT: ${{ inputs.limit }}
        run: |
          printf '%s' "$TERM_YEAR" | grep -Eq '^[0-9]{2}$'
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64" || { echo "::error::DO_SSH_KEY_B64 is empty"; exit 1; }
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ingest bounded official-source batch
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          TERM_YEAR: ${{ inputs.term }}
          LIMIT: ${{ inputs.limit }}
          RESUME: ${{ inputs.resume }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && docker compose -f docker-compose.production.yml exec -T app node jobs/ingest-official-scotus-opinions.mjs --term='$TERM_YEAR' --limit='$LIMIT' --resume='$RESUME'"

      - name: Report official-source staging queue
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('official_candidates', (SELECT count(*) FROM official_opinion_candidate), 'pending_review', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'pending_review'), 'failed_items', (SELECT count(*) FROM ingestion_run_item WHERE status = 'failed'));\""
