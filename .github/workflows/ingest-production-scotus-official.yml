name: Ingest official Supreme Court opinions

on:
  workflow_dispatch:
    inputs:
      term:
        description: Supreme Court term (two-digit year)
        required: true
        default: "25"
      limit:
        description: Maximum official opinions (1-100)
        required: true
        default: "100"
      resume:
        description: Resume after the last successful official-source checkpoint
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ingest-production-scotus-official.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-scotus-official-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Resolve batch inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TERM_YEAR: ${{ inputs.term }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_RESUME: ${{ inputs.resume }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TERM_YEAR="$INPUT_TERM_YEAR"
            LIMIT="$INPUT_LIMIT"
            RESUME="$INPUT_RESUME"
          else
            TERM_YEAR="25"
            LIMIT="100"
            RESUME="true"
          fi
          printf '%s' "$TERM_YEAR" | grep -Eq '^[0-9]{2}$'
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100
          case "$RESUME" in true|false) ;; *) echo "::error::Invalid resume value"; exit 1;; esac
          printf 'TERM_YEAR=%s\nLIMIT=%s\nRESUME=%s\n' "$TERM_YEAR" "$LIMIT" "$RESUME" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64" || { echo "::error::DO_SSH_KEY_B64 is empty"; exit 1; }
          case "$DO_SSH_KEY_B64" in *[!A-Za-z0-9+/=]*) echo "::error::DO_SSH_KEY_B64 is not one-line base64"; exit 1;; esac
          if ! printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::DO_SSH_KEY_B64 could not be decoded"
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::Decoded SSH private key is invalid or passphrase-protected"
            exit 1
          fi
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            container_ids="$(docker ps \
              --filter "label=com.docker.compose.project=jurvio" \
              --filter "label=com.docker.compose.service=app" \
              --format "{{.ID}}")"
            set -- $container_ids
            if [ "$#" -eq 0 ]; then
              echo "No running Jurvio app container found" >&2
              exit 1
            fi
            if [ "$#" -ne 1 ]; then
              echo "Multiple running Jurvio app containers found; refusing ambiguous ingestion target" >&2
              exit 1
            fi
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE" || { echo "::error::Running Jurvio app container has no configured image"; exit 1; }
          case "$JURVIO_IMAGE" in
            *[!A-Za-z0-9._/@:-]*) echo "::error::Resolved Jurvio image contains unexpected characters"; exit 1 ;;
          esac
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"
          echo "Resolved the image from the running Jurvio app container."

      - name: Enrich canonical SCOTUS opinions from CourtListener
        id: enrich
        continue-on-error: true
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/ingest-courtlistener-opinions.mjs --court scotus --since 1791-01-01 --limit 500 --order newest --delay-ms 100"

      - name: Ingest bounded official-source batch
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/ingest-official-scotus-opinions.mjs --term='$TERM_YEAR' --limit='$LIMIT' --resume='$RESUME'" | tee /tmp/scotus-ingestion.log

      - name: Publish exact verified matches
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit='$LIMIT'" | tee /tmp/scotus-publication.log

      - name: Report official-source staging queue
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5101767446"
          WORKFLOW_STATUS: ${{ job.status }}
          ENRICH_OUTCOME: ${{ steps.enrich.outcome }}
        run: |
          REPORT_EXIT=0
          if [ -z "${JURVIO_IMAGE:-}" ]; then
            QUEUE='{"report":"unavailable","reason":"active production image unresolved"}'
            REPORT_EXIT=1
          elif QUEUE="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('official_candidates', (SELECT count(*) FROM official_opinion_candidate), 'pending_review', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'pending_review'), 'approved', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'approved'), 'published_scotus_cases', (SELECT count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published'), 'published_scotus_documents', (SELECT count(DISTINCT document.id) FROM document JOIN judicial_opinion ON judicial_opinion.document_id = document.id JOIN opinion_cluster ON opinion_cluster.id = judicial_opinion.cluster_id JOIN legal_case ON legal_case.id = opinion_cluster.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND document.publication = 'published'), 'failed_items', (SELECT count(*) FROM ingestion_run_item WHERE status = 'failed'));\"" 2>/dev/null)"; then
            :
          else
            REPORT_EXIT=$?
            QUEUE='{"report":"unavailable","reason":"production database query failed"}'
          fi
          BATCH_RESULT="$(tail -n 1 /tmp/scotus-ingestion.log 2>/dev/null || true)"
          test -n "$BATCH_RESULT" || BATCH_RESULT='{"cycle":"no batch output available"}'
          PUBLICATION_RESULT="$(tail -n 1 /tmp/scotus-publication.log 2>/dev/null || true)"
          test -n "$PUBLICATION_RESULT" || PUBLICATION_RESULT='{"cycle":"no publication output available"}'
          BODY="$(printf '### SCOTUS ingestion and publication\n\n- Status: **%s**\n- CourtListener enrichment: **%s**\n- Updated: `%s`\n- Run: %s/%s/actions/runs/%s\n\nOfficial-source batch:\n\n```json\n%s\n```\n\nPublication batch:\n\n```json\n%s\n```\n\nLive totals:\n\n```json\n%s\n```' "$WORKFLOW_STATUS" "$ENRICH_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BATCH_RESULT" "$PUBLICATION_RESULT" "$QUEUE")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"
          exit "$REPORT_EXIT"

# Runtime-fixed production retry after PR #57 deployment.
