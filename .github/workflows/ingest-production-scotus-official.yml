name: Ingest official Supreme Court opinions

on:
  workflow_dispatch:
    inputs:
      term:
        description: Supreme Court term (two-digit year)
        required: true
        default: "25"
      limit:
        description: Maximum official opinions (1-100)
        required: true
        default: "100"
      resume:
        description: Resume after the last successful official-source checkpoint
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'schedule' && 'jurvio-production-scotus-official-ingestion' || 'jurvio-production-scotus-bound-assembly' }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - name: Resolve batch inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TERM_YEAR: ${{ inputs.term }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_RESUME: ${{ inputs.resume }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TERM_YEARS="$INPUT_TERM_YEAR"
            LIMIT="$INPUT_LIMIT"
            RESUME="$INPUT_RESUME"
            BOUND_RESUME="true"
          else
            CALENDAR_YEAR="$(date -u +%Y)"
            CALENDAR_MONTH="$(date -u +%m)"
            if [ "$CALENDAR_MONTH" -lt 10 ]; then
              CALENDAR_YEAR=$((CALENDAR_YEAR - 1))
            fi
            TERM_YEARS="$(printf '%02d' $((CALENDAR_YEAR % 100)))"
            LIMIT="100"
            RESUME="true"
            BOUND_RESUME="true"
          fi
          for TERM_YEAR in $TERM_YEARS; do
            printf '%s' "$TERM_YEAR" | grep -Eq '^[0-9]{2}$'
          done
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100
          case "$RESUME" in true|false) ;; *) echo "::error::Invalid resume value"; exit 1;; esac
          printf 'TERM_YEARS=%s\nLIMIT=%s\nRESUME=%s\nBOUND_RESUME=%s\n' "$TERM_YEARS" "$LIMIT" "$RESUME" "$BOUND_RESUME" >> "$GITHUB_ENV"

      - name: Start SCOTUS Assembly X-Ray
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XRAY_COMMENT_ID: "5133453027"
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$XRAY_COMMENT_ID" --raw-field body="### SCOTUS Assembly X-Ray

- Phase: **runner started**
- Target: U.S. Reports Volumes **567 → 502**
- PDF-to-text workers: 4 on GitHub runner
- Production staging workers: 8
- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
- Last heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64" || { echo "::error::DO_SSH_KEY_B64 is empty"; exit 1; }
          case "$DO_SSH_KEY_B64" in *[!A-Za-z0-9+/=]*) echo "::error::DO_SSH_KEY_B64 is not one-line base64"; exit 1;; esac
          if ! printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::DO_SSH_KEY_B64 could not be decoded"
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::Decoded SSH private key is invalid or passphrase-protected"
            exit 1
          fi
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            container_ids="$(docker ps \
              --filter "label=com.docker.compose.project=jurvio" \
              --filter "label=com.docker.compose.service=app" \
              --format "{{.ID}}")"
            set -- $container_ids
            if [ "$#" -eq 0 ]; then
              echo "No running Jurvio app container found" >&2
              exit 1
            fi
            if [ "$#" -ne 1 ]; then
              echo "Multiple running Jurvio app containers found; refusing ambiguous ingestion target" >&2
              exit 1
            fi
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE" || { echo "::error::Running Jurvio app container has no configured image"; exit 1; }
          case "$JURVIO_IMAGE" in
            *[!A-Za-z0-9._/@:-]*) echo "::error::Resolved Jurvio image contains unexpected characters"; exit 1 ;;
          esac
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"
          echo "Resolved the image from the running Jurvio app container."

      - name: Enrich canonical SCOTUS opinions from CourtListener
        if: github.event_name == 'schedule'
        id: enrich
        continue-on-error: true
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/ingest-courtlistener-opinions.mjs --court scotus --since 1791-01-01 --limit 500 --order newest --delay-ms 100"

      - name: Relay blocked official dockets into the artifact volume
        if: github.event_name == 'schedule'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XRAY_COMMENT_ID: "5133453027"
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$XRAY_COMMENT_ID" --raw-field body="### SCOTUS Assembly X-Ray

- Phase: **mirroring 66 official PDFs**
- Target: U.S. Reports Volumes **567 → 502**
- PDF-to-text workers: 4 on GitHub runner
- Production staging workers: 8
- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
- Last heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
          MIRROR_DIR="$(mktemp -d)"
          trap 'rm -rf "$MIRROR_DIR"' EXIT
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT legal_case.docket_number FROM legal_case JOIN court ON court.id = legal_case.court_id LEFT JOIN scotus_case_enrichment enrichment ON enrichment.case_id = legal_case.id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND (enrichment.completeness->>'docketEvents') IS DISTINCT FROM 'true' ORDER BY legal_case.decided_on DESC NULLS LAST;\"" > "$MIRROR_DIR/dockets.txt"
          DOWNLOADED=0
          while IFS= read -r DOCKET; do
            case "$DOCKET" in
              *[!0-9A-Za-z,.\ -]*|'') continue ;;
            esac
            SLUG="$DOCKET"
            if [[ "$DOCKET" =~ ^([0-9]+),[[:space:]]*Orig\.?$ ]]; then
              SLUG="22o${BASH_REMATCH[1]}"
            elif [[ "$DOCKET" =~ ^([0-9]{2}-[0-9]+)[[:space:]]+\([0-9]{2}A[0-9]+\)$ ]]; then
              SLUG="${BASH_REMATCH[1]}"
            fi
            if curl --fail --silent --show-error --location --retry 2 --max-time 30               -A "Mozilla/5.0 (compatible; JurvioBot/1.0; +https://jurvio.com)"               -H "Accept: text/html,application/xhtml+xml"               "https://www.supremecourt.gov/docket/docketfiles/html/public/$SLUG.html"               -o "$MIRROR_DIR/$SLUG.html"; then
              DOWNLOADED=$((DOWNLOADED + 1))
            fi
          done < "$MIRROR_DIR/dockets.txt"
          tar -C "$MIRROR_DIR" -czf /tmp/scotus-docket-mirror.tgz --exclude=dockets.txt .
          scp /tmp/scotus-docket-mirror.tgz "$DO_USER@$DO_HOST:/tmp/scotus-docket-mirror.tgz"
          ssh "$DO_USER@$DO_HOST" "set -eu; STAGE=\$(mktemp -d); trap 'rm -rf \"\$STAGE\" /tmp/scotus-docket-mirror.tgz' EXIT; tar -xzf /tmp/scotus-docket-mirror.tgz -C \"\$STAGE\"; CONTAINER_ID=\$(cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml ps -q app); test -n \"\$CONTAINER_ID\"; docker exec \"\$CONTAINER_ID\" mkdir -p /var/lib/jurvio/artifacts/scotus-docket-mirror; docker cp \"\$STAGE/.\" \"\$CONTAINER_ID:/var/lib/jurvio/artifacts/scotus-docket-mirror/\""
          echo "Relayed $DOWNLOADED official Supreme Court dockets."

      - name: Ingest, fully enrich, and publish verified SCOTUS cases
        if: github.event_name == 'schedule'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          : > /tmp/scotus-ingestion.log
          : > /tmp/scotus-publication.log
          for TERM_YEAR in $TERM_YEARS; do
            echo "Processing enriched Supreme Court term $TERM_YEAR"
            ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/ingest-enriched-official-scotus.mjs --term='$TERM_YEAR' --limit='$LIMIT' --resume='$RESUME' --attempts=10" | tee -a /tmp/scotus-ingestion.log /tmp/scotus-publication.log
          done

      - name: Report SCOTUS assembly host capacity
        if: github.event_name != 'schedule'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" '
            set -eu
            echo "CPU_COUNT=$(nproc)"
            free -m
            docker stats --no-stream --format "CONTAINER={{.Name}} CPU={{.CPUPerc}} MEMORY={{.MemUsage}}"
            echo "ACTIVE_PDFTOTEXT=$(pgrep -c pdftotext || true)"
          '

      - name: Mirror official U.S. Reports volumes 502 through 567
        if: github.event_name != 'schedule'
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XRAY_COMMENT_ID: "5133453027"
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$XRAY_COMMENT_ID" --raw-field body="### SCOTUS Assembly X-Ray

- Phase: **mirroring and converting 66 official PDFs**
- Target: U.S. Reports Volumes **567 → 502**
- PDF-to-text workers: 4 on GitHub runner
- Production staging workers: 8
- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
- Last heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
          MIRROR_DIR="$(mktemp -d)"
          trap 'rm -rf "$MIRROR_DIR" /tmp/scotus-bound-mirror.tar' EXIT
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            -A "Mozilla/5.0 (compatible; JurvioBot/1.0; +https://jurvio.com)" \
            "https://www.supremecourt.gov/opinions/USReports.aspx" \
            -o "$MIRROR_DIR/USReports.aspx"
          for VOLUME in $(seq 567 -1 502); do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 \
              -A "Mozilla/5.0 (compatible; JurvioBot/1.0; +https://jurvio.com)" \
              "https://www.supremecourt.gov/opinions/boundvolumes/${VOLUME}BV.pdf" \
              -o "$MIRROR_DIR/${VOLUME}BV.pdf"
            test "$(head -c 4 "$MIRROR_DIR/${VOLUME}BV.pdf")" = "%PDF"
            ln -s "${VOLUME}BV.pdf" "$MIRROR_DIR/${VOLUME}bv.pdf"
          done
          command -v pdftotext >/dev/null || { sudo apt-get update; sudo apt-get install -y poppler-utils; }
          convert_volume() {
            VOLUME="$1"
            pdftotext -layout "$MIRROR_DIR/${VOLUME}BV.pdf" "$MIRROR_DIR/${VOLUME}BV.txt"
            test -s "$MIRROR_DIR/${VOLUME}BV.txt"
            echo "::notice title=SCOTUS PDF-to-text $VOLUME::conversion completed"
          }
          export -f convert_volume
          export MIRROR_DIR
          seq 567 -1 502 | xargs -P 4 -n 1 bash -c 'convert_volume "$1"' _
          tar -C "$MIRROR_DIR" -cf /tmp/scotus-bound-mirror.tar .
          scp /tmp/scotus-bound-mirror.tar "$DO_USER@$DO_HOST:/tmp/scotus-bound-mirror.tar"
          ssh "$DO_USER@$DO_HOST" "set -eu; CONTAINER_ID=\$(cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml ps -q app); test -n \"\$CONTAINER_ID\"; docker exec \"\$CONTAINER_ID\" mkdir -p /var/lib/jurvio/artifacts/scotus-bound-mirror; docker exec -i \"\$CONTAINER_ID\" tar -C /var/lib/jurvio/artifacts/scotus-bound-mirror -xf - < /tmp/scotus-bound-mirror.tar; rm -f /tmp/scotus-bound-mirror.tar"

      - name: Ingest official pre-2018 U.S. Reports assembly line
        if: github.event_name != 'schedule'
        id: bound
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XRAY_COMMENT_ID: "5133453027"
        run: |
          set -o pipefail
          RESULT_DIR="$(mktemp -d)"
          trap 'rm -rf "$RESULT_DIR"' EXIT
          run_volume() {
            VOLUME="$1"
            if ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T --workdir /tmp app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts SCOTUS_BOUND_MIRROR_DIR=/var/lib/jurvio/artifacts/scotus-bound-mirror SCOTUS_BOUND_TEXT_MIRROR_DIR=/var/lib/jurvio/artifacts/scotus-bound-mirror node /app/jobs/ingest-official-scotus-bound-volume.mjs --volume='$VOLUME' --limit=100 --resume='true'" > "$RESULT_DIR/$VOLUME.log" 2>&1; then
              : > "$RESULT_DIR/$VOLUME.ok"
              echo "::notice title=SCOTUS volume $VOLUME::staged successfully"
              STATUS="success"
            else
              : > "$RESULT_DIR/$VOLUME.failed"
              echo "::error title=SCOTUS volume $VOLUME::staging failed; retained for repair"
              STATUS="failed"
            fi
            COMPLETED="$(find "$RESULT_DIR" -name '*.ok' -o -name '*.failed' | wc -l)"
            FAILURES="$(find "$RESULT_DIR" -name '*.failed' | wc -l)"
            BODY="$(printf '### SCOTUS Assembly X-Ray\n\n- Phase: `parallel staging`\n- Target: U.S. Reports Volumes **567 → 502**\n- PDF mirror and text conversion: complete\n- PDF-to-text workers: 4 on GitHub runner\n- Production staging workers: 8\n- Volumes completed: %s / 66\n- Failures: %s\n- Latest volume: %s (%s)\n- Run: %s/%s/actions/runs/%s\n- Last heartbeat: %s' "$COMPLETED" "$FAILURES" "$VOLUME" "$STATUS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$XRAY_COMMENT_ID" --raw-field body="$BODY" >/dev/null || true
          }
          export -f run_volume
          export DO_USER DO_HOST JURVIO_IMAGE RESULT_DIR GH_TOKEN XRAY_COMMENT_ID GITHUB_REPOSITORY GITHUB_SERVER_URL GITHUB_RUN_ID
          drain_publication() {
            ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit=10000" >> /tmp/scotus-publication.log 2>&1 || echo "::warning title=SCOTUS publication drain::publication pass will retry"
            ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/extract-official-scotus-opinion-text.mjs --limit=10000" >> /tmp/scotus-extraction.log 2>&1 || echo "::warning title=SCOTUS extraction drain::extraction pass will retry"
          }
          : > /tmp/scotus-publication.log
          : > /tmp/scotus-extraction.log
          seq 567 -1 502 | xargs -P 8 -n 1 bash -c 'run_volume "$1"' _ &
          STAGING_PID=$!
          while kill -0 "$STAGING_PID" 2>/dev/null; do
            drain_publication
            sleep 30
          done
          wait "$STAGING_PID"
          drain_publication
          FAILED_VOLUMES=""
          for VOLUME in $(seq 567 -1 502); do
            echo "Official U.S. Reports volume $VOLUME" | tee -a /tmp/scotus-ingestion.log
            cat "$RESULT_DIR/$VOLUME.log" | tee -a /tmp/scotus-ingestion.log
            if [ -f "$RESULT_DIR/$VOLUME.failed" ]; then
              FAILED_VOLUMES="$FAILED_VOLUMES $VOLUME"
            fi
          done
          printf 'FAILED_BOUND_VOLUMES=%s\n' "${FAILED_VOLUMES# }" >> "$GITHUB_ENV"
          if [ -n "$FAILED_VOLUMES" ]; then
            echo "::warning title=SCOTUS volume quarantine::Continuing after isolated failures:$FAILED_VOLUMES"
          fi

      - name: Report official-source staging queue
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5101767446"
          WORKFLOW_STATUS: ${{ job.status }}
          ENRICH_OUTCOME: ${{ steps.enrich.outcome }}
        run: |
          REPORT_EXIT=0
          if [ -z "${JURVIO_IMAGE:-}" ]; then
            QUEUE='{"report":"unavailable","reason":"active production image unresolved"}'
            REPORT_EXIT=1
          elif QUEUE="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('official_candidates', (SELECT count(*) FROM official_opinion_candidate), 'pending_review', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'pending_review'), 'approved', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'approved'), 'published_scotus_cases', (SELECT count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published'), 'published_scotus_documents', (SELECT count(DISTINCT document.id) FROM document JOIN judicial_opinion ON judicial_opinion.document_id = document.id JOIN opinion_cluster ON opinion_cluster.id = judicial_opinion.cluster_id JOIN legal_case ON legal_case.id = opinion_cluster.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND document.publication = 'published'), 'verified_enrichments', (SELECT count(*) FROM scotus_case_enrichment enrichment JOIN legal_case ON legal_case.id = enrichment.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.verification = 'verified'), 'opinion_metadata_v2', (SELECT count(*) FROM scotus_case_enrichment enrichment JOIN legal_case ON legal_case.id = enrichment.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.completeness->>'opinionMetadataV2' = 'true'), 'lineup_checked', (SELECT count(*) FROM scotus_case_enrichment enrichment JOIN legal_case ON legal_case.id = enrichment.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.completeness->>'lineupChecked' = 'true'), 'vote_breakdowns', (SELECT count(*) FROM scotus_case_enrichment enrichment JOIN legal_case ON legal_case.id = enrichment.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.completeness->>'voteBreakdownAvailable' = 'true'), 'with_questions', (SELECT count(*) FROM scotus_case_enrichment enrichment JOIN legal_case ON legal_case.id = enrichment.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.question_presented IS NOT NULL), 'with_holdings', (SELECT count(*) FROM scotus_case_enrichment enrichment JOIN legal_case ON legal_case.id = enrichment.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.exact_holding IS NOT NULL), 'unenriched_cases', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id LEFT JOIN scotus_case_enrichment enrichment ON enrichment.case_id = legal_case.id AND enrichment.verification = 'verified' WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND enrichment.case_id IS NULL), 'failed_items', (SELECT count(*) FROM ingestion_run_item WHERE status = 'failed'));\"" 2>/dev/null)"; then
            :
          else
            REPORT_EXIT=$?
            QUEUE='{"report":"unavailable","reason":"production database query failed"}'
          fi
          BATCH_RESULT="$(tail -n 1 /tmp/scotus-ingestion.log 2>/dev/null || true)"
          test -n "$BATCH_RESULT" || BATCH_RESULT='{"cycle":"no batch output available"}'
          PUBLICATION_RESULT="$(tail -n 1 /tmp/scotus-publication.log 2>/dev/null || true)"
          test -n "$PUBLICATION_RESULT" || PUBLICATION_RESULT='{"cycle":"no publication output available"}'
          BODY="$(printf '### SCOTUS ingestion and publication\n\n- Status: **%s**\n- CourtListener enrichment: **%s**\n- Updated: `%s`\n- Run: %s/%s/actions/runs/%s\n\nOfficial-source batch:\n\n```json\n%s\n```\n\nPublication batch:\n\n```json\n%s\n```\n\nLive totals:\n\n```json\n%s\n```' "$WORKFLOW_STATUS" "$ENRICH_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BATCH_RESULT" "$PUBLICATION_RESULT" "$QUEUE")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"
          exit "$REPORT_EXIT"

# Trigger the repaired historical SCOTUS assembly after publication blockers were removed.
