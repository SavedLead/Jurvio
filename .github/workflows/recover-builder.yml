name: Recover builder runner

# Stays on ubuntu-latest. It power-cycles jurvio-builder-01 when the
# self-hosted runner is down, which a job on that runner cannot do.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=RECOVER_BUILDER.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RECOVER_BUILDER to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-recover-builder
  cancel-in-progress: false

jobs:
  reboot:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Require confirm=RECOVER_BUILDER
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RECOVER_BUILDER" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=RECOVER_BUILDER."
            exit 1
          fi
      - name: Power-cycle jurvio-builder-01
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          id="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .id' <<<"$droplets" | head -1)"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::builder not found"; exit 1; }
          status="$(jq -r --argjson id "$id" '.droplets[] | select(.id==$id) | .status' <<<"$droplets")"
          echo "jurvio-builder-01 id=$id status=$status"
          if [ "$status" = "active" ]; then
            curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d '{"type":"power_cycle"}' >/dev/null
          else
            curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d '{"type":"power_on"}' >/dev/null
          fi
          for _ in $(seq 1 40); do
            st="$(curl -fsS "${auth[@]}" "$api/droplets/$id" | jq -r '.droplet.status')"
            echo "status=$st"
            [ "$st" = "active" ] && { echo "Builder active."; exit 0; }
            sleep 5
          done
          echo "::error::builder did not become active in time"
          exit 1
      - name: Record builder reboot receipt
        if: always()
        env:
          REBOOT_STATUS: ${{ job.status }}
        run: |
          # Job summary + annotation only. This used to open a new issue per run,
          # which emailed the repo owner every time.
          {
            echo "### Builder reboot [$REBOOT_STATUS]"
            echo
            echo "Status: **$REBOOT_STATUS**"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REBOOT_STATUS" = "success" ]; then echo "::notice title=Run status::Builder reboot [$REBOOT_STATUS]"; else echo "::warning title=Run status::Builder reboot [$REBOOT_STATUS]"; fi
