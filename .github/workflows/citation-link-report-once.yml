name: Citation link report (read-only)

# TEMPORARY diag branch version (not for main): citation lane history + worker logs.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-citation-link-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH (per run)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/jv-ssh-$GITHUB_RUN_ID"; install -m 700 -d "$d"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > "$d/id_ed25519"; chmod 600 "$d/id_ed25519"
          printf 'Host *\n  IdentityFile %s/id_ed25519\n  UserKnownHostsFile %s/known_hosts\n  BatchMode yes\n  ConnectTimeout 15\n  StrictHostKeyChecking accept-new\n' "$d" "$d" > "$d/config"
          echo "SSH_CFG=$d/config" >> "$GITHUB_ENV"
      - name: Lane history (read-only)
        run: |
          set -euo pipefail
          ssh -F "$SSH_CFG" "$INGESTION_USER@$DB_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          pg="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter 'label=com.docker.compose.service=postgres' --format '{{.ID}}' | head -n1)"
          q() { sudo -n docker exec -i "$pg" psql -U jurvio -d jurvio -At -F ' | ' -v ON_ERROR_STOP=1; }
          echo "--- case-citation-graph runs, last 24h ---"
          q <<'SQL'
          BEGIN READ ONLY; SET LOCAL statement_timeout='60s';
          SELECT to_char(started_at AT TIME ZONE 'America/New_York','MM-DD HH24:MI:SS'), round(duration_ms/1000.0), exit_code, signal, ok
          FROM scheduler_lane_run WHERE lane='case-citation-graph' AND started_at > now()-interval '24 hours' ORDER BY started_at;
          COMMIT;
          SQL
          echo "--- failed runs error_tail (last 3d) ---"
          q <<'SQL'
          BEGIN READ ONLY; SET LOCAL statement_timeout='60s';
          SELECT to_char(started_at AT TIME ZONE 'America/New_York','MM-DD HH24:MI'), right(coalesce(error_tail,''),1500)
          FROM scheduler_lane_run WHERE lane='case-citation-graph' AND NOT ok AND started_at > now()-interval '3 days' ORDER BY started_at DESC LIMIT 6;
          COMMIT;
          SQL
          wc="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter 'label=com.docker.compose.service=worker-citations' --format '{{.ID}}' | head -n1)"
          echo "--- worker-citations logs (8h) re case-citations ---"
          if [ -n "$wc" ]; then sudo -n docker logs --since 8h --timestamps "$wc" 2>&1 | grep -E 'case-citation|run-case-citations|"synced"|"mode":"resident"|budget|killed|timeout' | tail -60 | cut -c1-900; fi
          REMOTE
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/jv-ssh-$GITHUB_RUN_ID"
