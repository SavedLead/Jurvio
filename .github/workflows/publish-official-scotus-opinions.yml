name: Publish verified official Supreme Court opinions

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum staged candidates to reconcile and publish (1-100)
        required: true
        default: "100"
  workflow_run:
    workflows:
      - "Ingest official Supreme Court opinions"
    types:
      - completed
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

concurrency:
  group: jurvio-production-scotus-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Resolve batch limit
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LIMIT="$INPUT_LIMIT"
          else
            LIMIT="100"
          fi
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100
          printf 'LIMIT=%s\n' "$LIMIT" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
            set -- $ids
            test "$#" -eq 1
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE"
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"

      - name: Publish exact verified matches
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit='$LIMIT'"
