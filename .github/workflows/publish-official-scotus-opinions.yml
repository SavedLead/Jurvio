name: Publish verified official Supreme Court opinions
# Operational trigger: publish preserved official PDFs after the v3 publisher rollout.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum staged candidates to reconcile and publish
        required: true
        default: "10000"
  workflow_run:
    workflows:
      - "Ingest official Supreme Court opinions"
    types:
      - completed
  schedule:
    - cron: "47 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-official-scotus-opinions.yml"
      - ".github/scotus-xray-refresh"
      - ".github/scotus-pre500-volume-499-start"

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-scotus-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Resolve batch limit
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LIMIT="$INPUT_LIMIT"
          else
            LIMIT="10000"
          fi
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100000
          printf 'LIMIT=%s\n' "$LIMIT" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
            set -- $ids
            test "$#" -eq 1
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE"
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"

      - name: Ingest verified first pre-500 bound volume
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run SCOTUS Volume 499 one-time production launch' }}
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' timeout --foreground 35m docker compose -f docker-compose.production.yml run --rm -T --no-deps app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/ingest-loc-us-reports-volume.mjs --volume=499 --limit=1000 --resume=true" | tee /tmp/scotus-pre500-ingest.log

      - name: Publish exact verified matches
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit='$LIMIT'" | tee /tmp/scotus-publication.log

      - name: Extract and publish official opinion text
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          : > /tmp/scotus-extraction.log
          BATCH_LIMIT=10
          if [ "$LIMIT" -lt "$BATCH_LIMIT" ]; then BATCH_LIMIT="$LIMIT"; fi
          ATTEMPTED=0
          EXTRACTED=0
          HELD=0
          FAILED=0
          while [ "$ATTEMPTED" -lt "$LIMIT" ]; do
            RESULT="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/extract-official-scotus-opinion-text.mjs --limit='$BATCH_LIMIT'")"
            printf '%s\n' "$RESULT" | tee -a /tmp/scotus-extraction.log
            VALUES="$(printf '%s' "$RESULT" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(input.trim().split(/\n/).at(-1));
                process.stdout.write([value.selected, value.extracted, value.held, value.failed].join(" "));
              });
            ')"
            read -r BATCH_SELECTED BATCH_EXTRACTED BATCH_HELD BATCH_FAILED <<< "$VALUES"
            ATTEMPTED=$((ATTEMPTED + BATCH_SELECTED))
            EXTRACTED=$((EXTRACTED + BATCH_EXTRACTED))
            HELD=$((HELD + BATCH_HELD))
            FAILED=$((FAILED + BATCH_FAILED))
            if [ "$BATCH_SELECTED" -eq 0 ] || [ "$BATCH_EXTRACTED" -eq 0 ]; then break; fi
          done
          printf '{"attempted":%s,"extracted":%s,"held":%s,"failed":%s,"process_batch_limit":%s}\n' \
            "$ATTEMPTED" "$EXTRACTED" "$HELD" "$FAILED" "$BATCH_LIMIT" | tee -a /tmp/scotus-extraction.log

      - name: Report SCOTUS publication totals
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5101767945"
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          REPORT_EXIT=0
          if [ -z "${JURVIO_IMAGE:-}" ]; then
            TOTALS='{"report":"unavailable","reason":"active production image unresolved"}'
            REPORT_EXIT=1
          elif TOTALS="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('cases_inspected', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published'), 'cases_updated', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND (legal_case.decided_on IS NOT NULL OR legal_case.supreme_court_term IS NOT NULL OR legal_case.official_citation IS NOT NULL)), 'filing_dates_cleared', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND legal_case.filed_on IS NULL), 'decision_dates_added', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND legal_case.decided_on IS NOT NULL), 'terms_added', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND legal_case.supreme_court_term IS NOT NULL), 'official_citations_added', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND legal_case.official_citation IS NOT NULL), 'cases_unchanged', (SELECT count(*) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published' AND legal_case.decided_on IS NULL AND legal_case.supreme_court_term IS NULL AND legal_case.official_citation IS NULL), 'published_scotus_cases', (SELECT count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published'), 'published_scotus_documents', (SELECT count(DISTINCT document.id) FROM document JOIN judicial_opinion ON judicial_opinion.document_id = document.id JOIN opinion_cluster ON opinion_cluster.id = judicial_opinion.cluster_id JOIN legal_case ON legal_case.id = opinion_cluster.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND document.publication = 'published'), 'pending_official_candidates', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'pending_review'), 'approved_official_candidates', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'approved'), 'readable_scotus_documents', (SELECT count(*) FROM document_content JOIN document ON document.id = document_content.document_id JOIN legal_case ON legal_case.id = document.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND document.publication = 'published'));\"" 2>/dev/null)"; then
            :
          else
            REPORT_EXIT=$?
            TOTALS='{"report":"unavailable","reason":"production database query failed"}'
          fi
          BATCH_RESULT="$(tail -n 1 /tmp/scotus-publication.log 2>/dev/null || true)"
          test -n "$BATCH_RESULT" || BATCH_RESULT='{"cycle":"no batch output available"}'
          EXTRACTION_RESULT="$(tail -n 1 /tmp/scotus-extraction.log 2>/dev/null || true)"
          test -n "$EXTRACTION_RESULT" || EXTRACTION_RESULT='{"cycle":"no extraction output available"}'
          BODY="$(printf '### SCOTUS publication and text extraction\n\n- Status: **%s**\n- Updated: `%s`\n- Run: %s/%s/actions/runs/%s\n\nPublication batch:\n\n```json\n%s\n```\n\nText extraction:\n\n```json\n%s\n```\n\nLive totals:\n\n```json\n%s\n```' "$WORKFLOW_STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BATCH_RESULT" "$EXTRACTION_RESULT" "$TOTALS")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"
          exit "$REPORT_EXIT"

      - name: Report live pre-500 X-Ray
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5133453027"
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          set -eu
          IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
            set -- $ids
            test "$#" -eq 1
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          WORKERS="$(ssh "$DO_USER@$DO_HOST" "docker ps --format '{{.ID}} {{.Command}}' | grep -F 'ingest-loc-us-reports-volume' | wc -l || true" | tr -d '[:space:]')"
          TOTALS="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('published_scotus_cases',(SELECT count(*) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND legal_case.publication='published'),'published_scotus_documents',(SELECT count(*) FROM document JOIN judicial_opinion ON judicial_opinion.document_id=document.id JOIN opinion_cluster ON opinion_cluster.id=judicial_opinion.cluster_id JOIN legal_case ON legal_case.id=opinion_cluster.case_id JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND document.publication='published'),'readable_scotus_documents',(SELECT count(*) FROM document_content JOIN document ON document.id=document_content.document_id JOIN legal_case ON legal_case.id=document.case_id JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND document.publication='published'),'pending_official_candidates',(SELECT count(*) FROM official_opinion_candidate WHERE review_status='pending_review'),'approved_official_candidates',(SELECT count(*) FROM official_opinion_candidate WHERE review_status='approved'));\"")"
          BODY="$(printf '### SCOTUS pre-500 X-Ray\n\n- Status: **%s**\n- Updated: `%s`\n- Run: %s/%s/actions/runs/%s\n- Active production image: `%s`\n- Active direct pre-500 workers: **%s**\n\nLive production totals:\n\n```json\n%s\n```' "$WORKFLOW_STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$IMAGE" "$WORKERS" "$TOTALS")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"