name: Publish verified official Supreme Court opinions

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum staged candidates to reconcile and publish (1-100)
        required: true
        default: "100"
  workflow_run:
    workflows:
      - "Ingest official Supreme Court opinions"
    types:
      - completed
  schedule:
    - cron: "47 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-official-scotus-opinions.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-scotus-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Resolve batch limit
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LIMIT="$INPUT_LIMIT"
          else
            LIMIT="100"
          fi
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100
          printf 'LIMIT=%s\n' "$LIMIT" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
            set -- $ids
            test "$#" -eq 1
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE"
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"

      - name: Publish exact verified matches
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit='$LIMIT'" | tee /tmp/scotus-publication.log

      - name: Report SCOTUS publication totals
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5101767945"
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          REPORT_EXIT=0
          if [ -z "${JURVIO_IMAGE:-}" ]; then
            TOTALS='{"report":"unavailable","reason":"active production image unresolved"}'
            REPORT_EXIT=1
          elif TOTALS="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('published_scotus_cases', (SELECT count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND legal_case.publication = 'published'), 'published_scotus_documents', (SELECT count(DISTINCT document.id) FROM document JOIN judicial_opinion ON judicial_opinion.document_id = document.id JOIN opinion_cluster ON opinion_cluster.id = judicial_opinion.cluster_id JOIN legal_case ON legal_case.id = opinion_cluster.case_id JOIN court ON court.id = legal_case.court_id WHERE lower(court.provider_court_id) = 'scotus' AND document.publication = 'published'), 'pending_official_candidates', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'pending_review'), 'approved_official_candidates', (SELECT count(*) FROM official_opinion_candidate WHERE review_status = 'approved'));\"" 2>/dev/null)"; then
            :
          else
            REPORT_EXIT=$?
            TOTALS='{"report":"unavailable","reason":"production database query failed"}'
          fi
          BATCH_RESULT="$(tail -n 1 /tmp/scotus-publication.log 2>/dev/null || true)"
          test -n "$BATCH_RESULT" || BATCH_RESULT='{"cycle":"no batch output available"}'
          BODY="$(printf '### SCOTUS publication\n\n- Status: **%s**\n- Updated: `%s`\n- Run: %s/%s/actions/runs/%s\n\nPublication batch:\n\n```json\n%s\n```\n\nLive totals:\n\n```json\n%s\n```' "$WORKFLOW_STATUS" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BATCH_RESULT" "$TOTALS")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"
          exit "$REPORT_EXIT"

