name: Diagnose publication + citation worker (once, read-only)

# Strictly read-only. (1) Verifies the background citation worker is alive and
# publishing: who holds its advisory lock and for how long, the in-DB worker
# heartbeats, and recent cited-federal publication_decision rows. (2) Breaks down
# why federal DRAFT opinions are unpublished, against the SAME checks the existing
# cited-opinion gate applies, and counts how many would pass. No writes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-publication-citation
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Diagnose over private VPC
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          pg="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=postgres' --format '{{.ID}}' | head -n1)"
          [ -n "$pg" ] || { echo "::error::no postgres container"; exit 1; }
          q() { sudo -n docker exec "$pg" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 -c "SET statement_timeout='180s';" -c "$1" 2>&1; }

          echo "=== (1a) citation advisory-lock holder (is the worker actually running?) ==="
          q "SELECT a.pid, a.state, a.backend_start, round(extract(epoch FROM now()-a.query_start)) AS query_age_s, left(a.query,100) AS query
             FROM pg_stat_activity a JOIN pg_locks l ON l.pid=a.pid
             WHERE l.locktype='advisory' AND l.granted AND l.objsubid=1
               AND l.database=(SELECT oid FROM pg_database WHERE datname=current_database())
               AND l.objid=((hashtext('jurvio-case-citations-v1')::bigint & 4294967295)::oid)
               AND l.classid=(((hashtext('jurvio-case-citations-v1')::bigint >> 32) & 4294967295)::oid);"

          echo "=== (1b) recent cited-federal publications (publication_decision) ==="
          q "SELECT count(*) FILTER (WHERE decided_at > now()-interval '1 hour') AS last_1h,
                    count(*) FILTER (WHERE decided_at > now()-interval '24 hours') AS last_24h,
                    count(*) AS total, max(decided_at) AS latest
             FROM publication_decision WHERE reason_code='verified_cited_federal_opinion';"

          echo "=== (1c) worker heartbeats (freshness in seconds) ==="
          q "SELECT worker_id, lane, status, last_heartbeat_at, round(extract(epoch FROM now()-last_heartbeat_at)) AS age_s
             FROM ingestion_worker_heartbeat ORDER BY last_heartbeat_at DESC LIMIT 10;"
          q "SELECT worker_id, stage, court_code, heartbeat_at, round(extract(epoch FROM now()-heartbeat_at)) AS age_s
             FROM appellate_worker_heartbeat ORDER BY heartbeat_at DESC LIMIT 10;"

          echo "=== (2) WHY federal draft opinions are unpublished -- against the existing gate's checks ==="
          q "WITH fed_draft AS (
               SELECT c.id AS case_id, dc.word_count, dc.content_text, dc.content_hash,
                      da.content_hash AS artifact_hash, da.source_uri AS doc_source_uri, dp.code AS doc_provider
               FROM legal_case c JOIN court ct ON ct.id=c.court_id
               JOIN document d ON d.case_id=c.id AND d.publication='draft'
               JOIN judicial_opinion jo ON jo.document_id=d.id
               JOIN document_content dc ON dc.document_id=d.id
               JOIN raw_artifact da ON da.id=dc.source_artifact_id
               JOIN provider dp ON dp.id=da.provider_id
               WHERE c.publication='draft' AND coalesce(ct.provider_court_id,'')<>'scotus'
             )
             SELECT count(*) AS federal_draft_opinions,
               count(*) FILTER (WHERE word_count < 100) AS thin_lt100w,
               count(*) FILTER (WHERE content_text ~* '[0-9]{3}-[0-9]{2}-[0-9]{4}|date of birth|social security number') AS sensitive_text,
               count(*) FILTER (WHERE doc_provider<>'courtlistener'
                 OR doc_source_uri !~ '^https://www\.courtlistener\.com/api/rest/v[34]/opinions/[0-9]+/\$') AS unverified_source,
               count(*) FILTER (WHERE content_hash !~ '^[a-f0-9]{64}\$' OR artifact_hash IS NULL) AS missing_provenance,
               count(*) FILTER (WHERE word_count>=100
                 AND content_text !~* '[0-9]{3}-[0-9]{2}-[0-9]{4}|date of birth|social security number'
                 AND doc_provider='courtlistener'
                 AND doc_source_uri ~ '^https://www\.courtlistener\.com/api/rest/v[34]/opinions/[0-9]+/\$'
                 AND content_hash ~ '^[a-f0-9]{64}\$' AND artifact_hash IS NOT NULL) AS pass_safety_checks
             FROM fed_draft;"
          echo "=== DONE ==="
          REMOTE
