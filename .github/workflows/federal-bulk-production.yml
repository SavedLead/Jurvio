name: Federal bulk production backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/federal-bulk-kickoff"
  workflow_dispatch:
    inputs:
      year:
        description: Filing year to ingest, enrich, and publish
        required: true
        default: "2026"
      jurisdiction:
        description: Federal jurisdiction segment (F appellate, FD district, FB bankruptcy)
        required: true
        type: choice
        default: F
        options:
          - F
          - FD
          - FB
      snapshot_date:
        description: CourtListener snapshot date
        required: true
        default: "2026-03-31"
      row_limit:
        description: Bounded production cohort size
        required: true
        default: "1000"

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-federal-bulk
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    steps:
      - name: Resolve bounded cohort
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_JURISDICTION: ${{ inputs.jurisdiction }}
          INPUT_SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          INPUT_ROW_LIMIT: ${{ inputs.row_limit }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            YEAR=2026
            JURISDICTION=F
            SNAPSHOT_DATE=2026-03-31
            ROW_LIMIT=1000
          else
            YEAR="$INPUT_YEAR"
            JURISDICTION="$INPUT_JURISDICTION"
            SNAPSHOT_DATE="$INPUT_SNAPSHOT_DATE"
            ROW_LIMIT="$INPUT_ROW_LIMIT"
          fi
          case "$YEAR" in 19[0-9][0-9]|20[0-9][0-9]|2100) ;; *) exit 1 ;; esac
          case "$JURISDICTION" in F|FD|FB) ;; *) exit 1 ;; esac
          case "$SNAPSHOT_DATE" in ????-??-??) ;; *) exit 1 ;; esac
          case "$ROW_LIMIT" in 100|1000|5000) ;; *) exit 1 ;; esac
          printf 'YEAR=%s\nJURISDICTION=%s\nSNAPSHOT_DATE=%s\nROW_LIMIT=%s\n' \
            "$YEAR" "$JURISDICTION" "$SNAPSHOT_DATE" "$ROW_LIMIT" >> "$GITHUB_ENV"

      - name: Configure SSH
        id: ssh
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - uses: actions/checkout@v4

      - name: Resolve deployed unified-cohort implementation
        run: |
          REQUIRED_IMAGE_ANCESTOR="$(git log -1 --format=%H -- \
            .github/workflows/federal-bulk-production.yml \
            scripts/enrich-bulk-federal-cohort.ts \
            scripts/ingest-courtlistener-bulk-federal-dockets.ts \
            src/modules/ingestion/application/ingest-courtlistener-bulk-federal-dockets.ts)"
          test -n "$REQUIRED_IMAGE_ANCESTOR"
          printf 'REQUIRED_IMAGE_ANCESTOR=%s\n' "$REQUIRED_IMAGE_ANCESTOR" >> "$GITHUB_ENV"

      - name: Resolve active production image containing unified cohort jobs
        id: image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=
          stable=0
          candidate_sha=
          candidate_status=
          for attempt in $(seq 1 120); do
            current="$(ssh "$DO_USER@$DO_HOST" '
              set -eu
              ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
              set -- $ids
              test "$#" -eq 1
              docker inspect --format "{{.Config.Image}}" "$1"
            ')"
            candidate_sha="${current##*:}"
            candidate_status=
            if [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
              candidate_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$REQUIRED_IMAGE_ANCESTOR...$candidate_sha" --jq .status 2>/dev/null || true)"
            fi
            if { [ "$candidate_status" = "identical" ] || [ "$candidate_status" = "ahead" ]; } &&
               [ "$current" = "$previous" ]; then
              stable=$((stable + 1))
            else
              previous="$current"
              stable=0
            fi
            if [ "$stable" -ge 4 ]; then break; fi
            sleep 15
          done
          if [ "$stable" -lt 4 ]; then
            printf 'Production image %s (%s) does not contain workflow commit %s\n' \
              "$candidate_sha" "$candidate_status" "$REQUIRED_IMAGE_ANCESTOR" >&2
            exit 1
          fi
          JURVIO_IMAGE="$previous"
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"

      - name: Download and verify retained snapshot
        id: download
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' SNAPSHOT_DATE='$SNAPSHOT_DATE' docker compose -f docker-compose.production.yml run --rm --no-deps -T -e SNAPSHOT_DATE='$SNAPSHOT_DATE' app sh -lc '
            set -eu
            root=/var/lib/jurvio/artifacts/courtlistener/bulk/\$SNAPSHOT_DATE
            mkdir -p \"\$root\"
            courts=\"\$root/courts-\$SNAPSHOT_DATE.csv.bz2\"
            dockets=\"\$root/dockets-\$SNAPSHOT_DATE.csv.bz2\"
            if [ ! -f \"\$courts\" ] || [ \"\$(wc -c < \"\$courts\")\" -ne 81168 ] || [ ! -f \"\$dockets\" ] || [ \"\$(wc -c < \"\$dockets\")\" -ne 4979286998 ]; then
              available_kb=\$(df -Pk /var/lib/jurvio/artifacts | awk \"NR==2 {print \\\$4}\")
              test \"\$available_kb\" -ge 6500000
              base=https://com-courtlistener-storage.s3-us-west-2.amazonaws.com/bulk-data
              wget -c -O \"\$courts\" \"\$base/courts-\$SNAPSHOT_DATE.csv.bz2\"
              wget -c -O \"\$dockets\" \"\$base/dockets-\$SNAPSHOT_DATE.csv.bz2\"
            fi
            test \"\$(wc -c < \"\$root/courts-\$SNAPSHOT_DATE.csv.bz2\")\" -eq 81168
            test \"\$(wc -c < \"\$root/dockets-\$SNAPSHOT_DATE.csv.bz2\")\" -eq 4979286998
            echo \"4b41dbdfbda38cddf71e4974df1e1f1e522e7c01eba83dd173e899996d358778  \$root/courts-\$SNAPSHOT_DATE.csv.bz2\" | sha256sum -c -
            echo \"490908419eb42111d8ca8aec16f0c4e1bfbaac0dc0b92e197ca3bcf91dd4279f  \$root/dockets-\$SNAPSHOT_DATE.csv.bz2\" | sha256sum -c -
          '"

      - name: Import verified courts
        id: courts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml run --rm --no-deps -T app node jobs/ingest-courtlistener-bulk-courts.mjs '/var/lib/jurvio/artifacts/courtlistener/bulk/$SNAPSHOT_DATE/courts-$SNAPSHOT_DATE.csv.bz2' '$SNAPSHOT_DATE'"

      - name: Import bounded filing-year jurisdiction cohort
        id: cohort
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml run --rm --no-deps -T app node jobs/ingest-courtlistener-bulk-federal-dockets.mjs --file='/var/lib/jurvio/artifacts/courtlistener/bulk/$SNAPSHOT_DATE/dockets-$SNAPSHOT_DATE.csv.bz2' --snapshot-date='$SNAPSHOT_DATE' --year='$YEAR' --jurisdiction='$JURISDICTION' --include-bankruptcy=true --row-limit='$ROW_LIMIT'" | tee /tmp/federal-bulk-result.json

      - name: Enrich the same draft cohort before publication
        id: enrich
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=12 "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml run --rm --no-deps -T app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/enrich-bulk-federal-cohort.mjs --year='$YEAR' --jurisdiction='$JURISDICTION' --limit='$ROW_LIMIT' --delay-ms=1000" | tee /tmp/federal-enrichment-result.json

      - name: Reconcile enrichment before publication
        id: reconcile
        run: |
          import_json="$(tail -n 1 /tmp/federal-bulk-result.json)"
          enrich_json="$(tail -n 1 /tmp/federal-enrichment-result.json)"
          accepted="$(jq -er '.accepted' <<<"$import_json")"
          selected="$(jq -er '.selected' <<<"$enrich_json")"
          enriched="$(jq -er '.enriched' <<<"$enrich_json")"
          failed="$(jq -er '.failed' <<<"$enrich_json")"
          test "$accepted" -gt 0
          test "$selected" -gt 0
          tolerance=$((accepted / 100))
          if [ "$tolerance" -lt 10 ]; then tolerance=10; fi
          test "$selected" -ge $((accepted - tolerance))
          test "$enriched" -eq $((selected - failed))
          test $((failed * 100)) -le "$selected"

      - name: Publish eligible enriched cases
        id: publish
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          publication_limit=$((ROW_LIMIT + 100))
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml run --rm --no-deps -T app node jobs/run-federal-ingestion-loop.mjs --loop=publication-quarantine --limit='$publication_limit' --delay-ms=0"

      - name: Report production cohort
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active_image="$(ssh "$DO_USER@$DO_HOST" '
            ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
            set -- $ids
            test "$#" -eq 1
            docker inspect --format "{{.Config.Image}}" "$1"
          ' 2>/dev/null || true)"
          if [ -n "$active_image" ]; then
            corpus="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$active_image' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('year',$YEAR,'jurisdiction','$JURISDICTION','cases',(SELECT count(*) FROM legal_case c JOIN court ON court.id=c.court_id WHERE extract(year from c.filed_on)=$YEAR AND upper(coalesce(court.jurisdiction,''))='$JURISDICTION'),'published',(SELECT count(*) FROM legal_case c JOIN court ON court.id=c.court_id WHERE extract(year from c.filed_on)=$YEAR AND upper(coalesce(court.jurisdiction,''))='$JURISDICTION' AND c.publication='published'),'draft',(SELECT count(*) FROM legal_case c JOIN court ON court.id=c.court_id WHERE extract(year from c.filed_on)=$YEAR AND upper(coalesce(court.jurisdiction,''))='$JURISDICTION' AND c.publication='draft'),'parties',(SELECT count(*) FROM party_appearance party JOIN legal_case c ON c.id=party.case_id JOIN court ON court.id=c.court_id WHERE extract(year from c.filed_on)=$YEAR AND upper(coalesce(court.jurisdiction,''))='$JURISDICTION'),'docket_entries',(SELECT count(*) FROM docket_entry entry JOIN legal_case c ON c.id=entry.case_id JOIN court ON court.id=c.court_id WHERE extract(year from c.filed_on)=$YEAR AND upper(coalesce(court.jurisdiction,''))='$JURISDICTION'),'documents',(SELECT count(*) FROM document document JOIN legal_case c ON c.id=document.case_id JOIN court ON court.id=c.court_id WHERE extract(year from c.filed_on)=$YEAR AND upper(coalesce(court.jurisdiction,''))='$JURISDICTION));\"" 2>/dev/null || true)"
          else
            corpus=
          fi
          if [ -z "$corpus" ]; then
            corpus='{"error":"production_corpus_query_unavailable"}'
          fi
          body="$(printf '### Federal unified bulk cohort\n\n- Year: `%s`\n- Jurisdiction: `%s`\n- Snapshot: `%s`\n- Status: **%s**\n- Run: %s\n- Steps: ssh=`%s`, image=`%s`, download=`%s`, courts=`%s`, cohort=`%s`, enrich=`%s`, reconcile=`%s`, publish=`%s`\n\nImporter:\n```json\n%s\n```\n\nEnrichment:\n```json\n%s\n```\n\nProduction:\n```json\n%s\n```' "$YEAR" "$JURISDICTION" "$SNAPSHOT_DATE" "${{ job.status }}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "${{ steps.ssh.outcome }}" "${{ steps.image.outcome }}" "${{ steps.download.outcome }}" "${{ steps.courts.outcome }}" "${{ steps.cohort.outcome }}" "${{ steps.enrich.outcome }}" "${{ steps.reconcile.outcome }}" "${{ steps.publish.outcome }}" "$(tail -n 1 /tmp/federal-bulk-result.json 2>/dev/null || true)" "$(tail -n 1 /tmp/federal-enrichment-result.json 2>/dev/null || true)" "$corpus")"
          gh issue comment 106 --repo "$GITHUB_REPOSITORY" --body "$body"
