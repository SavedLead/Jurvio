name: Federal bulk production backfill
on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=FEDERAL_BULK_PRODUCTION.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type FEDERAL_BULK_PRODUCTION to run this workflow against production"
        required: true
        type: string
      year:
        description: Filing year to ingest, enrich, and publish
        required: true
        default: '2026'
      jurisdiction:
        description: Federal jurisdiction segment
        required: true
        type: choice
        default: F
        options:
        - F
        - FD
        - FB
      snapshot_date:
        description: CourtListener snapshot date
        required: true
        default: '2026-03-31'
      row_limit:
        description: Bounded production cohort size
        required: true
        type: choice
        default: '1000'
        options:
        - '100'
        - '1000'
        - '5000'
permissions:
  contents: read
concurrency:
  group: jurvio-production-federal-bulk-launch
  cancel-in-progress: true
jobs:
  launch:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Require confirm=FEDERAL_BULK_PRODUCTION
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "FEDERAL_BULK_PRODUCTION" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=FEDERAL_BULK_PRODUCTION."
            exit 1
          fi
      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Launch cohort on DigitalOcean and exit
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          YEAR: ${{ inputs.year }}
          JURISDICTION: ${{ inputs.jurisdiction }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          ROW_LIMIT: ${{ inputs.row_limit }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && docker compose -f docker-compose.production.yml exec -d -e YEAR='$YEAR' -e JURISDICTION='$JURISDICTION' -e SNAPSHOT_DATE='$SNAPSHOT_DATE' -e ROW_LIMIT='$ROW_LIMIT' worker sh /app/scripts/run-federal-bulk-production.sh"
