name: Ingestion status (read-only, VPC route)

# Read-only production status for the ingestion box (jurvio-web-01) reached over
# the private VPC from the self-hosted builder runner. Supersedes the transport
# in fleet-status.yml, which targeted the retired single droplet (DO_HOST) and
# now times out after the two-server split. Performs NO writes, NO ingestion,
# and NO publication: it only runs the existing read-only report-fleet-status
# job inside the running app container plus a headline corpus snapshot.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-ingestion-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Fleet status report (read-only)
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          app="$(sudo -n docker ps \
            --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=app' \
            --format '{{.ID}}' | head -n1)"
          [ -n "$app" ] || { echo "::error::no running jurvio app container on ingestion box"; exit 1; }
          pg="$(sudo -n docker ps \
            --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=postgres' \
            --format '{{.ID}}' | head -n1)"
          [ -n "$pg" ] || { echo "::error::no running jurvio postgres container on ingestion box"; exit 1; }

          echo "=== Headline corpus snapshot (read-only, Eastern time) ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York'; SELECT json_build_object(
            'checked_at', now(),
            'cases', (SELECT count(*) FROM legal_case),
            'published', (SELECT count(*) FROM legal_case WHERE publication='published'),
            'held', (SELECT count(*) FROM legal_case WHERE publication IN ('draft','restricted')),
            'needs_review', (SELECT count(*) FROM legal_case WHERE verification='needs_review'),
            'documents', (SELECT count(*) FROM document),
            'opinions', (SELECT count(*) FROM judicial_opinion),
            'database_bytes', pg_database_size(current_database()),
            'latest_source_at', (SELECT max(retrieved_at) FROM raw_artifact),
            'pacer_cost_usd', 0
          );"

          echo "=== Scheduler lane health: recent failures with real error tail (read-only) ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT string_agg(row, E'\n---\n') FROM (
              SELECT lane || '  exit=' || coalesce(exit_code::text,'null')
                || ' signal=' || coalesce(signal,'none')
                || ' at=' || to_char(started_at,'YYYY-MM-DD HH24:MI:SS')
                || E'\n' || left(coalesce(error_tail,'(no tail captured)'), 700) AS row
              FROM scheduler_lane_run
              WHERE ok = false AND started_at > now() - interval '2 hours'
              ORDER BY started_at DESC LIMIT 12
            ) recent;" || echo "(scheduler_lane_run not present yet)"

          echo "=== SCOTUS backfill diagnostic (read-only) ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT 'candidates_by_status: ' || review_status || '=' || count(*)
              FROM official_opinion_candidate GROUP BY review_status
            UNION ALL SELECT 'candidates_total=' || count(*) FROM official_opinion_candidate
            UNION ALL SELECT 'candidates_bound_volume_cite=' || count(*)
              FROM official_opinion_candidate WHERE citation ~ '^[0-9]+ U'
            UNION ALL SELECT 'scotus_published_cases=' || count(*)
              FROM legal_case lc JOIN court c ON c.id = lc.court_id
              WHERE lower(c.provider_court_id) = 'scotus' AND lc.publication = 'published';" || echo "(candidate query failed)"
          echo "--- ingestion_run by type/status ---"
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT run_type || ' | ' || status || ' | n=' || count(*) || ' | latest=' || to_char(max(started_at),'MM-DD HH24:MI')
            FROM ingestion_run WHERE run_type LIKE 'official_scotus%'
            GROUP BY run_type, status ORDER BY run_type, status;" || echo "(ingestion_run query failed)"
          echo "--- recent bound-volume run failures ---"
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT to_char(started_at,'MM-DD HH24:MI') || ' :: ' || left(coalesce(error::text,'(no error)'),400)
            FROM ingestion_run WHERE run_type = 'official_scotus_bound_volume' AND status = 'failed'
            ORDER BY started_at DESC LIMIT 6;" || echo "(bound-volume failure query failed)"

          echo "=== SCOTUS collapse confirmation + citation-migration preconditions (read-only) ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            WITH scotus AS (
              SELECT lc.* FROM legal_case lc JOIN court c ON c.id = lc.court_id
              WHERE lower(c.provider_court_id) = 'scotus'
            )
            SELECT 'scotus_cases=' || count(*) FROM scotus
            UNION ALL SELECT 'scotus_documents=' || count(*)
              FROM document d JOIN scotus s ON s.id = d.case_id
            UNION ALL SELECT 'scotus_cases_missing_term=' || count(*) FROM scotus WHERE supreme_court_term IS NULL
            UNION ALL SELECT 'scotus_cases_missing_citation=' || count(*) FROM scotus WHERE official_citation IS NULL
            UNION ALL SELECT 'scotus_duplicate_citations=' || coalesce(sum(c-1),0) FROM (
              SELECT count(*) c FROM scotus WHERE supreme_court_term IS NOT NULL AND official_citation IS NOT NULL
              GROUP BY court_id, official_citation HAVING count(*) > 1) d
            UNION ALL SELECT 'nonscotus_rows_with_term=' || count(*)
              FROM legal_case lc JOIN court c ON c.id = lc.court_id
              WHERE lower(c.provider_court_id) <> 'scotus' AND lc.supreme_court_term IS NOT NULL
            UNION ALL SELECT 'nonscotus_dupe_docket_where_term_null=' || coalesce(sum(c-1),0) FROM (
              SELECT count(*) c FROM legal_case lc JOIN court c2 ON c2.id = lc.court_id
              WHERE lower(c2.provider_court_id) <> 'scotus' AND lc.supreme_court_term IS NULL
              GROUP BY lc.court_id, lc.docket_number HAVING count(*) > 1) e;" || echo "(scotus precondition query failed)"

          echo "=== Federal / district ingestion diagnostic (read-only) ==="
          echo "--- federal/district/courtlistener/bulk ingestion_run by type/status ---"
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT run_type || ' | ' || status || ' | n=' || count(*) || ' | latest=' || to_char(max(started_at),'MM-DD HH24:MI')
            FROM ingestion_run
            WHERE run_type ~* 'federal|district|courtlistener|bulk|docket'
            GROUP BY run_type, status ORDER BY run_type, status;" || echo "(federal ingestion_run query failed)"
          echo "--- corpus growth: is ANY new case being created? ---"
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT 'legal_case_total=' || count(*) FROM legal_case
            UNION ALL SELECT 'created_last_1h=' || count(*) FROM legal_case WHERE created_at > now() - interval '1 hour'
            UNION ALL SELECT 'created_last_24h=' || count(*) FROM legal_case WHERE created_at > now() - interval '24 hours'
            UNION ALL SELECT 'created_last_7d=' || count(*) FROM legal_case WHERE created_at > now() - interval '7 days'
            UNION ALL SELECT 'max_created_at=' || coalesce(to_char(max(created_at),'YYYY-MM-DD HH24:MI:SS'),'(none)') FROM legal_case;" || echo "(corpus growth query failed)"
          echo "--- raw_artifact ingest freshness by provider (last 7d) ---"
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "SET TIME ZONE 'America/New_York';
            SELECT provider_id || ' | n=' || count(*) || ' | latest=' || to_char(max(retrieved_at),'MM-DD HH24:MI')
            FROM raw_artifact WHERE retrieved_at > now() - interval '7 days'
            GROUP BY provider_id ORDER BY provider_id;" || echo "(raw_artifact freshness query failed)"

          echo "=== Outbound reachability probe FROM the ingestion box (read-only; token never echoed) ==="
          sudo -n docker exec "$app" node -e "const started=Date.now();const t=process.env.COURTLISTENER_API_TOKEN?('Token '+process.env.COURTLISTENER_API_TOKEN):null;fetch('https://www.courtlistener.com/api/rest/v4/courts/?page_size=1',{headers:t?{Authorization:t}:{},signal:AbortSignal.timeout(30000)}).then(r=>console.log('CL_API_STATUS='+r.status+' token='+(t?'present':'absent')+' ms='+(Date.now()-started))).catch(e=>console.log('CL_API_ERROR='+e.name+':'+String(e.message).slice(0,120)+' ms='+(Date.now()-started)));" || echo "(CL api probe failed to launch)"
          sudo -n docker exec "$app" node -e "const started=Date.now();fetch('https://www.courtlistener.com/api/bulk-data/',{method:'HEAD',redirect:'manual',signal:AbortSignal.timeout(30000)}).then(r=>console.log('CL_BULK_STATUS='+r.status+' ms='+(Date.now()-started))).catch(e=>console.log('CL_BULK_ERROR='+e.name+':'+String(e.message).slice(0,120)+' ms='+(Date.now()-started)));" || echo "(CL bulk probe failed to launch)"
          sudo -n docker exec "$app" node -e "const started=Date.now();fetch('https://www.govinfo.gov/',{method:'HEAD',signal:AbortSignal.timeout(30000)}).then(r=>console.log('GOVINFO_STATUS='+r.status+' ms='+(Date.now()-started))).catch(e=>console.log('GOVINFO_ERROR='+e.name+':'+String(e.message).slice(0,120)+' ms='+(Date.now()-started)));" || echo "(govinfo probe failed to launch)"

          echo "=== Disk on ingestion box (read-only) ==="
          df -h / | tail -n +1

          echo "=== Full fleet report (108 courts, read-only) ==="
          sudo -n docker exec "$app" node jobs/report-fleet-status.mjs
          REMOTE
