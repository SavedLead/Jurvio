name: Diagnose public traffic (once, read-only)

# Who is requesting jurvio.com, and is it one of our droplets?
# Read-only. No nginx reload, no firewall edits, no deploys.
#
# SSH matches diagnose-db-load-once.yml: builder runner to jurvio-public-01
# (10.116.0.5) and jurvio-web-01 (10.116.0.2). The runner itself is builder-01.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-public-traffic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      PUBLIC_HOST: 10.116.0.5
      WEB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Record our own addresses
        id: ours
        run: |
          set -euo pipefail
          echo "=== runner ==="
          hostname || true
          runner_ip="$(curl -4 -fsS --max-time 15 https://ifconfig.me || echo failed)"
          echo "runner_ifconfig=${runner_ip}"
          echo "runner_ip=${runner_ip}" >> "$GITHUB_OUTPUT"
          if [ -z "${DO_TOKEN:-}" ]; then
            echo "DO token unset; droplet public IPs are not listed from the API"
            echo "droplet_ips=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          droplets="$(curl -fsS --max-time 20 -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/droplets?per_page=200")"
          echo "=== droplet addresses ==="
          jq -r '.droplets[] | select(.name=="jurvio-public-01" or .name=="jurvio-web-01" or .name=="jurvio-builder-01") | .name as $n | .networks.v4[] | "\($n) \(.type) \(.ip_address)"' <<<"$droplets"
          ips="$(jq -r '.droplets[] | select(.name=="jurvio-public-01" or .name=="jurvio-web-01" or .name=="jurvio-builder-01") | .networks.v4[] | select(.type=="public") | .ip_address' <<<"$droplets" | paste -sd, -)"
          echo "droplet_ips=${ips}" >> "$GITHUB_OUTPUT"

      - name: Read public-01 access log
        env:
          RUNNER_IP: ${{ steps.ours.outputs.runner_ip }}
          DROPLET_IPS: ${{ steps.ours.outputs.droplet_ips }}
        run: |
          set -euo pipefail
          target=""
          if ssh "root@$PUBLIC_HOST" true; then
            target="root"
          elif ssh "$INGESTION_USER@$PUBLIC_HOST" true; then
            target="$INGESTION_USER"
          else
            echo "::error::could not SSH to jurvio-public-01 at $PUBLIC_HOST"
            exit 1
          fi
          echo "public_ssh_user=${target}"
          ssh "$target@$PUBLIC_HOST" "RUNNER_IP=$(printf '%q' "$RUNNER_IP") DROPLET_IPS=$(printf '%q' "$DROPLET_IPS") bash -s" <<'REMOTE'
          set -uo pipefail
          echo "=== public-01 clock ==="
          date -u +%Y-%m-%dT%H:%M:%SZ
          hostname || true
          echo "=== public-01 ifconfig.me ==="
          curl -4 -fsS --max-time 15 https://ifconfig.me || echo "(ifconfig.me failed)"
          echo
          echo "=== nginx log format ==="
          if command -v nginx >/dev/null 2>&1; then
            nginx -T 2>/dev/null | awk '/log_format|access_log/ {print}' | head -n 40 || true
          elif command -v sudo >/dev/null 2>&1; then
            sudo -n nginx -T 2>/dev/null | awk '/log_format|access_log/ {print}' | head -n 40 || true
          else
            echo "(nginx -T unavailable)"
          fi

          python3 - <<'PY' || echo "(access-log summary failed)"
          import collections, datetime, ipaddress, os, re, time, urllib.request
          cutoff = time.time() - 45 * 60
          ours = set()
          for chunk in (os.environ.get("RUNNER_IP", ""), os.environ.get("DROPLET_IPS", "")):
              ours.update(part.strip() for part in chunk.split(",") if part.strip() and part.strip() != "failed")

          def fetch_nets():
              nets = []
              source = "live"
              blobs = []
              try:
                  for url in ("https://www.cloudflare.com/ips-v4", "https://www.cloudflare.com/ips-v6"):
                      with urllib.request.urlopen(url, timeout=15) as response:
                          blobs.append(response.read().decode())
              except Exception as error:
                  source = f"unavailable ({error})"
                  blobs = []
              for blob in blobs:
                  for line in blob.splitlines():
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          nets.append(ipaddress.ip_network(line))
                      except ValueError:
                          pass
              return nets, source

          cf_nets, cf_source = fetch_nets()
          print(f"cloudflare_ranges={cf_source} count={len(cf_nets)}")

          def is_cf(value):
              try:
                  addr = ipaddress.ip_address(value)
              except ValueError:
                  return False
              return any(addr in net for net in cf_nets)

          candidates = ["/var/log/nginx/access.log", "/var/log/nginx/jurvio.access.log"]
          path = next((item for item in candidates if os.path.isfile(item)), None)
          if path is None:
              print("no nginx access log at the usual paths")
              raise SystemExit(0)
          size = os.path.getsize(path)
          print(f"path={path} size_bytes={size}")
          with open(path, "rb") as handle:
              handle.seek(max(0, size - 64_000_000))
              if size > 64_000_000:
                  handle.readline()
              raw = handle.read().decode("utf-8", "replace")
          sample = next((line for line in raw.splitlines() if line.strip()), "")
          print("--- sample log line (format check) ---")
          print(sample[:400])
          joined = sample.lower()
          print(f"sample_mentions_cf_connecting_ip={'cf-connecting-ip' in joined or 'cf_connecting_ip' in joined}")
          print(f"sample_mentions_x_forwarded_for={'x-forwarded-for' in joined or 'x_forwarded_for' in joined}")
          print("default combined format logs $remote_addr only. CF-Connecting-IP and X-Forwarded-For are present only if a custom log_format includes them. The lines above are that check.")

          stamp = re.compile(r"\[(\d{2})/([A-Za-z]{3})/(\d{4}):(\d{2}):(\d{2}):(\d{2}) ([+-]\d{4})\]")
          request = re.compile(r'"([A-Z]+) ([^" ]+)')
          ip_re = re.compile(r"\b(?:\d{1,3}\.){3}\d{1,3}\b|(?:[A-Fa-f0-9]{0,4}:){2,7}[A-Fa-f0-9]{0,4}")
          months = {name: index for index, name in enumerate(["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], 1)}
          id_re = re.compile(r"/jv-[a-z0-9]{8,10}|/jd-[a-z0-9]{8,10}", re.I)
          per_ip = collections.Counter()
          ua_by_ip = collections.defaultdict(collections.Counter)
          path_by_ip = collections.defaultdict(collections.Counter)
          ua_minute = collections.defaultdict(collections.Counter)
          ua_total = collections.Counter()
          via = collections.Counter()
          extra_addrs = collections.Counter()
          kept = 0
          for line in raw.splitlines():
              stamped = stamp.search(line)
              if not stamped:
                  continue
              day, mon, year, hour, minute, second, offset = stamped.groups()
              month = months.get(mon)
              if not month:
                  continue
              sign = 1 if offset[0] == "+" else -1
              shift = sign * (int(offset[1:3]) * 3600 + int(offset[3:5]) * 60)
              epoch = datetime.datetime(int(year), month, int(day), int(hour), int(minute), int(second), tzinfo=datetime.timezone.utc).timestamp() - shift
              if epoch < cutoff:
                  continue
              kept += 1
              remote = line.split(" ", 1)[0]
              per_ip[remote] += 1
              via["cloudflare_edge" if is_cf(remote) else "direct_to_origin"] += 1
              req = request.search(line)
              path = req.group(2).split("?", 1)[0] if req else "?"
              path_by_ip[remote][id_re.sub("/:id", path)] += 1
              tail = line.rsplit('"', 2)
              agent = (tail[-2] if len(tail) >= 2 else "?")[:160]
              ua_by_ip[remote][agent] += 1
              ua_total[agent] += 1
              minute_key = f"{year}-{month:02d}-{int(day):02d} {hour}:{minute}"
              ua_minute[minute_key][agent] += 1
              for found in ip_re.findall(line)[1:4]:
                  if found != remote:
                      extra_addrs[found] += 1
          print(f"requests_in_45m={kept}")
          print("--- how the TCP peer reached nginx ---")
          for key, count in via.most_common():
              print(f"{count:7d} {key}")
          print("--- extra IP tokens after remote_addr (X-Forwarded-For only if the log format stores it) ---")
          if not extra_addrs:
              print("(none)")
          for key, count in extra_addrs.most_common(10):
              mark = " OUR_DROPLET" if key in ours else ""
              print(f"{count:7d} {key}{mark}")
          print("--- top client IPs (remote_addr) ---")
          top_ips = per_ip.most_common(12)
          for ip, count in top_ips:
              marks = []
              if ip in ours:
                  marks.append("OUR_DROPLET_OR_RUNNER")
              marks.append("cloudflare_edge" if is_cf(ip) else "direct_to_origin")
              print(f"{count:7d} {ip} {' '.join(marks)}")
          print("--- top user agents per top IP ---")
          for ip, _count in top_ips[:8]:
              print(f"IP {ip}")
              for agent, count in ua_by_ip[ip].most_common(5):
                  print(f"  {count:7d} {agent}")
          print("--- top paths per top IP ---")
          for ip, _count in top_ips[:5]:
              print(f"IP {ip}")
              for path, count in path_by_ip[ip].most_common(8):
                  print(f"  {count:7d} {path}")
          top_uas = [agent for agent, _count in ua_total.most_common(3)]
          print("--- requests per minute for top 3 user agents ---")
          print("minute " + " | ".join(agent[:40] for agent in top_uas))
          for minute_key in sorted(ua_minute):
              counts = " ".join(f"{ua_minute[minute_key][agent]:6d}" for agent in top_uas)
              print(f"{minute_key} {counts}")
          PY

          echo "=== public-01 outbound connections to :80/:443 ==="
          (ss -H -tpn state established dst :443 2>/dev/null; ss -H -tpn state established dst :80 2>/dev/null) || sudo -n sh -c 'ss -H -tpn state established dst :443; ss -H -tpn state established dst :80' || true
          echo "=== public-01 fetcher processes ==="
          ps -eo pid,user,args | awk 'BEGIN{IGNORECASE=1} /curl|wget|chrome|chromium|playwright|puppeteer|firefox|headless|jurvio\.com/ {print}' | head -n 40
          echo "=== PUBLIC DONE ==="
          exit 0
          REMOTE

      - name: Check web-01 and this builder for outbound fetches
        run: |
          set -euo pipefail
          echo "=== web-01 ${WEB_HOST} ==="
          ssh "$INGESTION_USER@$WEB_HOST" bash -s <<'REMOTE' || echo "(web-01 ssh failed)"
          set -uo pipefail
          hostname || true
          echo "=== web-01 ifconfig.me ==="
          curl -4 -fsS --max-time 15 https://ifconfig.me || echo "(ifconfig.me failed)"
          echo
          echo "=== web-01 outbound connections to :80/:443 ==="
          (ss -H -tpn state established dst :443 2>/dev/null; ss -H -tpn state established dst :80 2>/dev/null) || sudo -n sh -c 'ss -H -tpn state established dst :443; ss -H -tpn state established dst :80' || true
          echo "=== web-01 fetcher processes ==="
          ps -eo pid,user,args | awk 'BEGIN{IGNORECASE=1} /curl|wget|chrome|chromium|playwright|puppeteer|firefox|headless|jurvio\.com/ {print}' | head -n 40
          REMOTE
          echo "=== builder (this runner) outbound connections to :80/:443 ==="
          hostname || true
          (ss -H -tpn state established dst :443 2>/dev/null; ss -H -tpn state established dst :80 2>/dev/null) || sudo -n sh -c 'ss -H -tpn state established dst :443; ss -H -tpn state established dst :80' || true
          echo "=== builder fetcher processes ==="
          ps -eo pid,user,args | awk 'BEGIN{IGNORECASE=1} /curl|wget|chrome|chromium|playwright|puppeteer|firefox|headless|jurvio\.com/ {print}' | head -n 40
          echo "=== DONE ==="

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config
