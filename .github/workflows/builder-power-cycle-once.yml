name: Builder power cycle once

# Hosted (ubuntu-latest) helper: power-cycle jurvio-builder-01 via the
# DigitalOcean API so its self-hosted runner re-registers and drains queued
# jobs. Needed because the runner unit has no Restart= (see P5) and inbound SSH
# to the builder is firewalled. Touches only the builder droplet's power state.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-builder-power-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Power-cycle / power-on the builder
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          id="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .id' <<<"$droplets" | head -1)"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::builder not found"; exit 1; }
          status="$(jq -r --argjson id "$id" '.droplets[] | select(.id==$id) | .status' <<<"$droplets")"
          echo "jurvio-builder-01 id=$id status=$status"
          type='{"type":"power_on"}'
          [ "$status" = "active" ] && type='{"type":"power_cycle"}'
          curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d "$type" >/dev/null
          echo "issued: $type"
          for _ in $(seq 1 40); do
            st="$(curl -fsS "${auth[@]}" "$api/droplets/$id" | jq -r '.droplet.status')"
            echo "status=$st"
            [ "$st" = "active" ] && { echo "active"; break; }
            sleep 5
          done
