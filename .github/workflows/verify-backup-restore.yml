name: Verify backup restore (weekly rehearsal)

# Closes the readiness checklist's known boundary: "A separate encrypted backup
# location and a successful restore test are required before public launch."
#
# Pulls the newest ENCRYPTED off-site backup, decrypts it, and restores it into a
# THROWAWAY postgres container with its own ephemeral volume, then runs sanity
# counts against the restored copy. An object that exists is not a recovery
# point; an object that loads and carries the corpus is.
#
# Safety: this workflow never touches the production database, the production
# compose project, or any production volume. The scratch container has a
# distinct name and no published port, and it is removed in a step that always
# runs — including on cancellation.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=VERIFY_BACKUP_RESTORE.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_BACKUP_RESTORE to run this workflow against production"
        required: true
        type: string
      object_key:
        description: 'Specific backup object key to restore (default: newest)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-backup-restore-check
  cancel-in-progress: false

jobs:
  restore-rehearsal:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 180
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      OBJECT_KEY: ${{ inputs.object_key }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require confirm=VERIFY_BACKUP_RESTORE
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "VERIFY_BACKUP_RESTORE" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=VERIFY_BACKUP_RESTORE."
            exit 1
          fi
      - name: Open a temporary SSH path through the public host
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          public="$(jq -c '[.droplets[] | select(.name=="jurvio-public-01")][0] // empty' <<<"$droplets")"
          ingestion="$(jq -c '[.droplets[] | select(.name=="jurvio-web-01")][0] // empty' <<<"$droplets")"
          test -n "$public" && test -n "$ingestion"
          public_id="$(jq -r .id <<<"$public")"
          public_ip="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$public")"
          public_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$public")"
          ingestion_id="$(jq -r .id <<<"$ingestion")"
          ingestion_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$ingestion")"
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          firewall_id="$(jq -r --argjson id "$public_id" '[.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty' <<<"$firewalls")"
          ingestion_firewall_id="$(jq -r --argjson id "$ingestion_id" '[.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty' <<<"$firewalls")"
          test -n "$firewall_id" && test -n "$ingestion_firewall_id"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          runner_cidr="$runner_ip/32"
          public_private_cidr="$public_private/32"
          {
            echo "PUBLIC_IP=$public_ip"
            echo "INGESTION_PRIVATE=$ingestion_private"
            echo "FIREWALL_ID=$firewall_id"
            echo "INGESTION_FIREWALL_ID=$ingestion_firewall_id"
            echo "PUBLIC_ID=$public_id"
            echo "PUBLIC_PRIVATE_CIDR=$public_private_cidr"
            echo "RUNNER_CIDR=$runner_cidr"
          } >> "$GITHUB_ENV"
          public_rule="$(jq -n --arg src "$runner_cidr" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
          curl -fsS -X POST "${auth[@]}" "$api/firewalls/$firewall_id/rules" -d "$public_rule" >/dev/null
          private_rule="$(jq -n --arg src "$public_private_cidr" --argjson id "$public_id" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src],droplet_ids:[$id]}}]}')"
          curl -fsS -X POST "${auth[@]}" "$api/firewalls/$ingestion_firewall_id/rules" -d "$private_rule" >/dev/null
          gh issue comment 426 --repo "$GITHUB_REPOSITORY" --body '1.4 restore: `█░░░░░░░░░ 10%` Temporary SSH route opened; production database remains untouched.'

      - name: Configure ephemeral SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host public-jump
            HostName $PUBLIC_IP
            User root
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
            StrictHostKeyChecking accept-new
          Host ingestion-private
            HostName $INGESTION_PRIVATE
            User $INGESTION_USER
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump public-jump
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh public-jump true
          ssh ingestion-private true

      - name: Download, decrypt and inspect the newest off-site backup
        run: |
          set -euo pipefail
          ssh ingestion-private bash -s -- "${OBJECT_KEY:-}" <<'REMOTE'
          set -euo pipefail
          object_key="${1:-}"
          cd /opt/jurvio
          rm -rf /opt/jurvio/restore-check
          mkdir -p /opt/jurvio/restore-check
          chmod 700 /opt/jurvio/restore-check

          image="$(docker inspect -f '{{.Config.Image}}' \
            "$(docker ps --filter 'label=com.docker.compose.project=jurvio' \
                         --filter 'label=com.docker.compose.service=app' \
                         --format '{{.ID}}' | head -n1)")"
          test -n "$image" || { echo "::error::could not resolve the running app image"; exit 1; }

          key_args=""
          [ -n "$object_key" ] && key_args="--key $object_key"
          # Verifies the GCM tag, gunzips end to end, and asserts the dump
          # carries both schema (CREATE TABLE) and data (COPY) before we spend
          # an hour loading it.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env-file .env.production \
            -v /opt/jurvio/restore-check:/restore \
            "$image" \
            node jobs/verify-database-backup.mjs --dest /restore/jurvio-restore.sql.gz $key_args </dev/null
          ls -lh /opt/jurvio/restore-check/
          REMOTE

      - name: Restore into a throwaway postgres and count the corpus
        run: |
          set -euo pipefail
          ssh ingestion-private bash -s <<'REMOTE'
          set -euo pipefail
          # Distinct name and NO published port: this container is unreachable
          # from outside the box and shares nothing with the production stack.
          docker rm -f jurvio-restore-check >/dev/null 2>&1 || true
          docker run -d --name jurvio-restore-check \
            -e POSTGRES_USER=jurvio -e POSTGRES_PASSWORD=restore-rehearsal \
            -e POSTGRES_DB=jurvio \
            --tmpfs /dev/shm:size=1g \
            postgres:16-alpine >/dev/null </dev/null

          for _ in $(seq 1 60); do
            docker exec jurvio-restore-check pg_isready -U jurvio -d jurvio >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec jurvio-restore-check pg_isready -U jurvio -d jurvio >/dev/null

          echo "=== loading the decrypted dump ==="
          gunzip -c /opt/jurvio/restore-check/jurvio-restore.sql.gz \
            | docker exec -i jurvio-restore-check psql -v ON_ERROR_STOP=1 -q -U jurvio -d jurvio >/dev/null

          echo "=== restored corpus (from the backup, not production) ==="
          docker exec -i jurvio-restore-check psql -U jurvio -d jurvio -t -A -F'|' <<'SQL'
          SELECT 'cases', count(*)::text FROM legal_case
          UNION ALL SELECT 'published_cases', count(*)::text FROM legal_case WHERE publication='published'
          UNION ALL SELECT 'documents', count(*)::text FROM document
          UNION ALL SELECT 'opinions', count(*)::text FROM judicial_opinion
          UNION ALL SELECT 'docket_entries', count(*)::text FROM docket_entry
          UNION ALL SELECT 'raw_artifacts', count(*)::text FROM raw_artifact;
          SQL

          # A restore that yields an empty corpus is a failed restore, however
          # cleanly psql exited.
          # No -i: this query needs no stdin, and `docker exec -i` here would drain
          # the ssh heredoc that IS this script (see nightly-db-backup.yml header).
          published="$(docker exec jurvio-restore-check psql -U jurvio -d jurvio -t -A \
            -c "SELECT count(*) FROM legal_case WHERE publication='published'" </dev/null)"
          echo "restored published cases: $published"
          [ "$published" -gt 0 ] || { echo "::error::restored database contains no published cases"; exit 1; }
          echo "Restore rehearsal succeeded."
          REMOTE

      - name: Tear down the scratch database and decrypted dump
        if: always()
        run: |
          set -euo pipefail
          ssh ingestion-private bash -s <<'REMOTE'
          set -euo pipefail
          # -v also removes the anonymous volume the scratch container created,
          # so a rehearsal never leaves a copy of the corpus on the box.
          docker rm -f -v jurvio-restore-check >/dev/null 2>&1 || true
          rm -rf /opt/jurvio/restore-check
          df -h /opt/jurvio
          REMOTE
      - name: Record phase receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_STATUS: ${{ job.status }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Phase 1.4 restore [$GATE_STATUS]" --body "Status: **$GATE_STATUS**\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nRecorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Remove temporary SSH access
        if: always()
        run: |
          set +e
          api=https://api.digitalocean.com/v2
          if [ -n "${FIREWALL_ID:-}" ] && [ -n "${RUNNER_CIDR:-}" ]; then
            public_rule="$(jq -n --arg src "$RUNNER_CIDR" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
            curl -fsS -X DELETE               -H "Authorization: Bearer $DO_TOKEN"               -H "Content-Type: application/json"               "$api/firewalls/$FIREWALL_ID/rules" -d "$public_rule"
          fi
          if [ -n "${INGESTION_FIREWALL_ID:-}" ] && [ -n "${PUBLIC_PRIVATE_CIDR:-}" ] && [ -n "${PUBLIC_ID:-}" ]; then
            private_rule="$(jq -n --arg src "$PUBLIC_PRIVATE_CIDR" --argjson id "$PUBLIC_ID" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src],droplet_ids:[$id]}}]}')"
            curl -fsS -X DELETE               -H "Authorization: Bearer $DO_TOKEN"               -H "Content-Type: application/json"               "$api/firewalls/$INGESTION_FIREWALL_ID/rules" -d "$private_rule"
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/config
          gh issue comment 426 --repo "$GITHUB_REPOSITORY"             --body "1.4 hosted restore finished with status: **${{ job.status }}**. Scratch data and temporary SSH access cleanup attempted. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
