name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Docs and workflow-only pushes do not need a builder slot. Pull requests
    # still verify. The builder is one 2 vCPU / 4 GB machine, so this keeps
    # deploys from waiting on a docs commit.
    paths-ignore:
      - "**.md"
      - "scripts/diag/**"
      # Workflow-only changes are verified in PR CI; they do not change the app.
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.head_ref == 'agent/judge-autopilot-control-loop' || github.head_ref == 'codex/refresh-backup-stdin-fix') && github.sha || 'standard' }}
  cancel-in-progress: true

jobs:
  verify:
    # One job at a time on jurvio-builder-01 (2 vCPU / 4 GB). Postgres is a
    # service container. Lint, typecheck, and tests stay under a 1 GB heap.
    # The Next.js build is the peak and gets a separate 1.7 GB heap so it
    # does not sit on top of a still-running lint process.
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://jurvio:jurvio@localhost:5432/jurvio
      COURTLISTENER_API_BASE_URL: https://www.courtlistener.com/api/rest/v4
      JURVIO_ARTIFACT_ROOT: .data/artifacts
      INGESTION_USER_AGENT: Jurvio-CI/0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jurvio
          POSTGRES_USER: jurvio
          POSTGRES_PASSWORD: jurvio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jurvio -d jurvio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:jobs
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=1792
