name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - implementation/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://jurvio:jurvio@localhost:5432/jurvio
      COURTLISTENER_BASE_URL: https://www.courtlistener.com/api/rest/v3
      JURVIO_ARTIFACT_ROOT: .data/artifacts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jurvio
          POSTGRES_USER: jurvio
          POSTGRES_PASSWORD: jurvio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jurvio -d jurvio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
