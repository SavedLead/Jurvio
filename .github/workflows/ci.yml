name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Fork PRs stay on isolated GitHub-hosted runners; only Jurvio-owned code reaches the persistent builder.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://jurvio:jurvio@localhost:5432/jurvio
      COURTLISTENER_API_BASE_URL: https://www.courtlistener.com/api/rest/v4
      JURVIO_ARTIFACT_ROOT: .data/artifacts
      INGESTION_USER_AGENT: Jurvio-CI/0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jurvio
          POSTGRES_USER: jurvio
          POSTGRES_PASSWORD: jurvio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jurvio -d jurvio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:jobs
      - run: pnpm build
