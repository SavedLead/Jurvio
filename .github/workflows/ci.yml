name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Skip the heavy self-hosted build for pushes that only touch docs, one-off
    # operational workflows, or read-only diagnostic scripts — none of which
    # affect the application build. Keeps the serial builder free for real work.
    paths-ignore:
      - "**.md"
      - "scripts/diag/**"
      # Workflow-only changes are verified in PR CI; they do not change the app.
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.head_ref == 'agent/judge-autopilot-control-loop' || github.head_ref == 'codex/refresh-backup-stdin-fix') && github.sha || 'standard' }}
  cancel-in-progress: true

jobs:
  verify:
    # CI is isolated from production and requires no private VPC access.
    # Keep the DigitalOcean builder available for deploy, backup, restore, and audits.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://jurvio:jurvio@localhost:5432/jurvio
      COURTLISTENER_API_BASE_URL: https://www.courtlistener.com/api/rest/v4
      JURVIO_ARTIFACT_ROOT: .data/artifacts
      INGESTION_USER_AGENT: Jurvio-CI/0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jurvio
          POSTGRES_USER: jurvio
          POSTGRES_PASSWORD: jurvio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jurvio -d jurvio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:jobs
      - run: pnpm build
