name: Migrate public website once

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/migrate-public-web-once.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: jurvio-migrate-public-web-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 35
    environment: production
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve VPC and apply narrow firewall rules
        id: network
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          public="$(jq -c '[.droplets[] | select(.name=="jurvio-public-01")][0] // empty' <<<"$droplets")"
          builder="$(jq -c '[.droplets[] | select(.name=="jurvio-builder-01")][0] // empty' <<<"$droplets")"
          ingestion="$(jq -c '([.droplets[] | select(.name!="jurvio-public-01" and .name!="jurvio-builder-01") | select((.tags // []) | index("jurvio"))] | sort_by(.memory) | reverse | .[0]) // ([.droplets[] | select(.size.slug=="s-4vcpu-8gb")][0]) // empty' <<<"$droplets")"
          test -n "$public" && test -n "$builder" && test -n "$ingestion" || { echo "::error::Could not resolve all three Jurvio droplets"; exit 1; }
          public_id="$(jq -r .id <<<"$public")"
          public_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$public")"
          public_public="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$public")"
          builder_id="$(jq -r .id <<<"$builder")"
          builder_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$builder")"
          builder_public="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$builder")"
          ingestion_id="$(jq -r .id <<<"$ingestion")"
          ingestion_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$ingestion")"
          ingestion_public="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$ingestion")"
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          public_fw="$(jq -r --argjson id "$public_id" '([.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty) // ([.firewalls[] | select(.name=="jurvio-public-web-bootstrap")][0].id // empty)' <<<"$firewalls")"
          test -n "$public_fw" || { echo "::error::Public bootstrap firewall not found"; exit 1; }
          if ! jq -e --arg id "$public_fw" --argjson droplet "$public_id" '.firewalls[] | select(.id==$id) | (.droplet_ids // []) | index($droplet)' <<<"$firewalls" >/dev/null; then
            curl -fsS -X POST "${auth[@]}" "$api/firewalls/$public_fw/droplets" -d "$(jq -n --argjson id "$public_id" '{droplet_ids:[$id]}')" >/dev/null
            firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          fi
          if ! jq -e --arg id "$public_fw" --arg src "$builder_private/32" '.firewalls[] | select(.id==$id) | .inbound_rules[]? | select(.protocol=="tcp" and .ports=="22" and ((.sources.addresses // []) | index($src)))' <<<"$firewalls" >/dev/null; then
            curl -fsS -X POST "${auth[@]}" "$api/firewalls/$public_fw/rules" -d "$(jq -n --arg src "$builder_private/32" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')" >/dev/null
          fi
          data_fw="$(jq -r '.firewalls[] | select(.name=="jurvio-private-data") | .id' <<<"$firewalls" | head -1)"
          if [ -z "$data_fw" ]; then
            curl -fsS -X POST "${auth[@]}" "$api/firewalls" -d "$(jq -n --argjson id "$ingestion_id" --arg src "$public_private/32" '{name:"jurvio-private-data",droplet_ids:[$id],inbound_rules:[{protocol:"tcp",ports:"5432",sources:{addresses:[$src]}},{protocol:"tcp",ports:"2049",sources:{addresses:[$src]}}],outbound_rules:[{protocol:"tcp",ports:"all",destinations:{addresses:["0.0.0.0/0","::/0"]}},{protocol:"udp",ports:"all",destinations:{addresses:["0.0.0.0/0","::/0"]}},{protocol:"icmp",destinations:{addresses:["0.0.0.0/0","::/0"]}}]}')" >/dev/null
          fi
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          data_fw="$(jq -r '.firewalls[] | select(.name=="jurvio-private-data") | .id' <<<"$firewalls" | head -1)"
          if ! jq -e --arg id "$data_fw" --arg src "$builder_private/32" '.firewalls[] | select(.id==$id) | .inbound_rules[]? | select(.protocol=="tcp" and .ports=="22" and ((.sources.addresses // []) | index($src)))' <<<"$firewalls" >/dev/null; then
            curl -fsS -X POST "${auth[@]}" "$api/firewalls/$data_fw/rules" -d "$(jq -n --arg src "$builder_private/32" --argjson bid "$builder_id" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src],droplet_ids:[$bid]}}]}')" >/dev/null
          fi
          { echo "public_private=$public_private"; echo "public_public=$public_public"; echo "ingestion_private=$ingestion_private"; echo "ingestion_ssh=$ingestion_public"; echo "public_fw=$public_fw"; } >> "$GITHUB_OUTPUT"

      - name: Configure private SSH and wait for bootstrap
        shell: bash
        env:
          PUBLIC_PRIVATE: ${{ steps.network.outputs.public_private }}
          INGESTION_PRIVATE: ${{ steps.network.outputs.ingestion_private }}
          INGESTION_SSH: ${{ steps.network.outputs.ingestion_ssh }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          touch ~/.ssh/known_hosts
          for host in "$PUBLIC_PRIVATE"; do
            for _ in $(seq 1 60); do ssh-keyscan -T 5 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done
          done
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 "root@$PUBLIC_PRIVATE" bash -s <<'REMOTE'
          set -euo pipefail
          if ! test -f /var/lib/jurvio-web-bootstrap-complete; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl nginx
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            . /etc/os-release
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            mkdir -p /opt/jurvio
            systemctl enable --now docker nginx
            touch /var/lib/jurvio-web-bootstrap-complete
          fi
          docker version >/dev/null
          # Drop any half-installed jurvio site from a prior failed run so base nginx validates here;
          # it is (re)installed together with its TLS cert in the runtime-configuration step.
          rm -f /etc/nginx/sites-enabled/jurvio
          nginx -t >/dev/null
          REMOTE

      - name: Build and publish verified public image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lower_image="${IMAGE,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$lower_image" .
          docker push "$lower_image"

      - name: Expose database and artifacts privately
        env:
          INGESTION_PRIVATE: ${{ steps.network.outputs.ingestion_private }}
          PUBLIC_PRIVATE: ${{ steps.network.outputs.public_private }}
          INGESTION_SSH: ${{ steps.network.outputs.ingestion_ssh }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          rm -f ~/.ssh/cm-* 2>/dev/null || true
          # Multiplex ALL SSH over a single persistent connection per host. jurvio-web-01 rate-limits
          # rapid successive connections on :22 (accepts one, refuses the next), so scp/ssh must reuse
          # one connection instead of opening several. ControlMaster does exactly that.
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 12
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 600
          EOF
          chmod 600 ~/.ssh/config
          # Select a working builder->ingestion route (prefer private VPC IP, fall back to public).
          # The first successful ssh opens the shared master that scp/ssh then reuse; retry with
          # backoff to ride over a transient/rate-limited refusal. Data path stays on the private VPC.
          ING=""
          for attempt in 1 2 3 4 5 6; do
            for h in "$INGESTION_PRIVATE" "$INGESTION_SSH"; do
              if out="$(ssh "$INGESTION_USER@$h" true 2>&1)"; then ING="$h"; echo "Selected ingestion SSH route: $h (attempt $attempt)"; break; fi
              echo "attempt $attempt route $h: ${out##*$'\n'}"
            done
            [ -n "$ING" ] && break
            [ "$attempt" -lt 6 ] && { echo "backing off $((attempt*10))s"; sleep "$((attempt*10))"; }
          done
          test -n "$ING" || { echo "::error::No working builder->ingestion SSH route after retries (private $INGESTION_PRIVATE and public $INGESTION_SSH both refused). On jurvio-web-01: ensure sshd ListenAddress includes 0.0.0.0 so the private VPC IP answers, sshd is active and NOT restart-looping, /run/sshd exists, and the builder IPs (10.116.0.3 private, 198.211.113.171 public) are not rate-limited/banned by fail2ban/ufw."; exit 1; }
          echo "INGESTION_HOST=$ING" >> "$GITHUB_ENV"
          scp docker-compose.production.yml "$INGESTION_USER@$ING:/opt/jurvio/docker-compose.production.yml"
          ssh "$INGESTION_USER@$ING" bash -s -- "$INGESTION_PRIVATE" "$PUBLIC_PRIVATE" <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          test -s .env.production
          if grep -q '^JURVIO_DATABASE_BIND=' .env.production; then sed -i "s/^JURVIO_DATABASE_BIND=.*/JURVIO_DATABASE_BIND=$1/" .env.production; else printf '\nJURVIO_DATABASE_BIND=%s\n' "$1" >> .env.production; fi
          # Only postgres is (re)started here and it does not use JURVIO_IMAGE, but docker compose
          # interpolates the whole production file, so provide a placeholder image and load
          # .env.production so JURVIO_DATABASE_BIND (and any other vars) resolve.
          export JURVIO_IMAGE="${JURVIO_IMAGE:-localhost/jurvio-postgres-only:latest}"
          dc() { docker compose --env-file .env.production -f docker-compose.production.yml "$@"; }
          dc up -d postgres
          postgres_id="$(dc ps -q postgres)"
          for _ in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$postgres_id")" = healthy ] && break; sleep 2; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$postgres_id")" = healthy ]
          sudo -n apt-get update >/dev/null && sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y nfs-kernel-server >/dev/null
          volume="$(docker volume ls --format '{{.Name}}' | grep -E '(^|_)jurvio_artifacts$' | head -1)"
          test -n "$volume"
          artifact_path="$(docker volume inspect "$volume" --format '{{.Mountpoint}}')"
          sudo -n install -d -m 755 /etc/exports.d
          printf '%s %s(ro,sync,no_subtree_check,fsid=0)\n' "$artifact_path" "$2" | sudo -n tee /etc/exports.d/jurvio-public.exports >/dev/null
          sudo -n exportfs -ra && sudo -n systemctl enable --now nfs-kernel-server
          REMOTE

      - name: Transfer runtime configuration privately
        env:
          INGESTION_PRIVATE: ${{ steps.network.outputs.ingestion_private }}
          PUBLIC_PRIVATE: ${{ steps.network.outputs.public_private }}
          INGESTION_SSH: ${{ steps.network.outputs.ingestion_ssh }}
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@${INGESTION_HOST:-$INGESTION_PRIVATE}" 'cat /opt/jurvio/.env.production' | ssh "root@$PUBLIC_PRIVATE" 'umask 077; cat > /opt/jurvio/.env.production'
          # Copy the Cloudflare origin cert/key. Verify the source first, dereference symlinks (-h) so the
          # real files (not dangling links) land on the new server, then verify the destination.
          if ! ssh "$INGESTION_USER@${INGESTION_HOST:-$INGESTION_PRIVATE}" 'sudo -n sh -c "test -s /etc/ssl/cloudflare/jurvio-origin.pem && test -s /etc/ssl/cloudflare/jurvio-origin.key"'; then
            echo "::error::Cloudflare origin cert/key not found (or empty) at /etc/ssl/cloudflare/jurvio-origin.pem and jurvio-origin.key on jurvio-web-01. Place the Cloudflare Origin Certificate + key there. Current contents:"
            ssh "$INGESTION_USER@${INGESTION_HOST:-$INGESTION_PRIVATE}" 'sudo -n ls -la /etc/ssl/cloudflare/ 2>&1 || echo "(directory missing)"'
            exit 1
          fi
          ssh "$INGESTION_USER@${INGESTION_HOST:-$INGESTION_PRIVATE}" 'sudo -n tar -C / -chzf - etc/ssl/cloudflare' | ssh "root@$PUBLIC_PRIVATE" 'tar -C / -xzf -'
          ssh "root@$PUBLIC_PRIVATE" 'test -s /etc/ssl/cloudflare/jurvio-origin.pem && test -s /etc/ssl/cloudflare/jurvio-origin.key' || { echo "::error::Cert/key did not land on jurvio-public-01 after copy"; exit 1; }
          scp docker-compose.public.yml "root@$PUBLIC_PRIVATE:/opt/jurvio/docker-compose.public.yml"
          scp ops/nginx-jurvio.conf "root@$PUBLIC_PRIVATE:/opt/jurvio/nginx-jurvio.conf"
          ssh "root@$PUBLIC_PRIVATE" bash -s -- "$INGESTION_PRIVATE" <<'REMOTE'
          set -euo pipefail
          sed -i -E "s#(@)(postgres|127\.0\.0\.1|localhost)(:5432)?/#\1$1:5432/#" /opt/jurvio/.env.production
          apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y nfs-common >/dev/null
          install -d -m 755 /mnt/jurvio-artifacts
          sed -i '\# /mnt/jurvio-artifacts nfs4 #d' /etc/fstab
          printf '%s:/ /mnt/jurvio-artifacts nfs4 ro,nofail,_netdev,x-systemd.automount 0 0\n' "$1" >> /etc/fstab
          mount /mnt/jurvio-artifacts || mount -a
          mountpoint -q /mnt/jurvio-artifacts
          install -m 644 /opt/jurvio/nginx-jurvio.conf /etc/nginx/sites-available/jurvio
          ln -sfn /etc/nginx/sites-available/jurvio /etc/nginx/sites-enabled/jurvio
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          REMOTE

      - name: Deploy and verify app privately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_PRIVATE: ${{ steps.network.outputs.public_private }}
        run: |
          set -euo pipefail
          lower_image="${IMAGE,,}"
          printf '%s' "$GH_TOKEN" | ssh "root@$PUBLIC_PRIVATE" 'docker login ghcr.io -u SavedLead --password-stdin'
          ssh "root@$PUBLIC_PRIVATE" bash -s -- "$lower_image" <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          docker pull "$1"
          JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml up -d --remove-orphans
          app_id="$(JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml ps -q app)"
          for _ in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$app_id")" = healthy ] && break; sleep 5; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$app_id")" = healthy ]
          curl -fsS http://127.0.0.1:3000/api/ready >/dev/null
          systemctl reload nginx
          curl -fkSs --resolve jurvio.com:443:127.0.0.1 https://jurvio.com/api/ready >/dev/null
          REMOTE

      - name: Open web ports and verify sealed origin
        env:
          PUBLIC_FW: ${{ steps.network.outputs.public_fw }}
          PUBLIC_PUBLIC: ${{ steps.network.outputs.public_public }}
          PUBLIC_PRIVATE: ${{ steps.network.outputs.public_private }}
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          if ! jq -e --arg id "$PUBLIC_FW" '.firewalls[] | select(.id==$id) | .inbound_rules[]? | select(.protocol=="tcp" and .ports=="80")' <<<"$firewalls" >/dev/null; then
            curl -fsS -X POST "${auth[@]}" "$api/firewalls/$PUBLIC_FW/rules" -d '{"inbound_rules":[{"protocol":"tcp","ports":"80","sources":{"addresses":["0.0.0.0/0","::/0"]}},{"protocol":"tcp","ports":"443","sources":{"addresses":["0.0.0.0/0","::/0"]}}]}' >/dev/null
          fi
          # The origin serves a Cloudflare Origin Certificate (trusted only by the
          # Cloudflare edge, not a public CA), so direct-to-origin probes use -k.
          # These curls resolve jurvio.com to the NEW server's PUBLIC IP over the
          # open Internet path (80/443), exactly as Cloudflare will reach it.
          probe() { curl -ksS -o /dev/null -w '%{http_code}' --resolve "jurvio.com:443:$PUBLIC_PUBLIC" --max-time 20 "https://jurvio.com$1"; }
          echo "Waiting for public origin to answer on $PUBLIC_PUBLIC ..."
          for _ in $(seq 1 20); do [ "$(probe /api/ready)" = "200" ] && break; sleep 3; done
          fail=0
          # Hard health check: /api/ready must be 200.
          code="$(probe /api/ready)"; echo "GET /api/ready -> $code"
          [ "$code" = "200" ] || { echo "::error::/api/ready returned $code"; fail=1; }
          # Page checks: each must return a non-error status (<400).
          for path in / /cases /scotus /supreme-court /courts; do
            code="$(probe "$path")"; echo "GET $path -> $code"
            if [ "$code" -ge 400 ] 2>/dev/null || [ -z "$code" ]; then
              echo "::error::$path returned $code"; fail=1
            fi
          done
          # TLS: confirm the origin presents the Cloudflare Origin certificate.
          echo "--- TLS certificate presented by origin ---"
          if cert="$(echo | openssl s_client -connect "$PUBLIC_PUBLIC:443" -servername jurvio.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null)"; then
            echo "$cert"
            echo "$cert" | grep -qi 'Cloudflare' && echo "TLS OK: Cloudflare Origin certificate presented" || echo "::warning::Origin cert issuer is not Cloudflare"
          else
            echo "::error::Could not read TLS certificate from origin"; fail=1
          fi
          # Documents/artifacts: confirm the NFS-mounted artifact store is visible
          # to the app container (read-only) over the private VPC. Informational.
          echo "--- Artifact store visible to app container ---"
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 "root@$PUBLIC_PRIVATE" bash -s <<'REMOTE'
          set -e
          cid="$(docker ps -q -f label=com.docker.compose.project=jurvio-public -f label=com.docker.compose.service=app | head -1)"
          if [ -n "$cid" ]; then
            echo "app container: $cid"
            docker exec "$cid" sh -c 'ls -1 /var/lib/jurvio/artifacts 2>/dev/null | head -3; echo "artifact entries visible to app: $(ls -1 /var/lib/jurvio/artifacts 2>/dev/null | wc -l)"'
          else
            echo "app container not found; checking host NFS mount instead"
            ls -1 /mnt/jurvio-artifacts 2>/dev/null | head -3
            echo "artifact entries on host mount: $(ls -1 /mnt/jurvio-artifacts 2>/dev/null | wc -l)"
          fi
          REMOTE
          then
            echo "::warning::Could not enumerate artifacts inside app container (non-fatal)"
          fi
          [ "$fail" = "0" ] || { echo "::error::Direct-origin verification failed"; exit 1; }
          { echo '### Jurvio public origin is ready';
            echo '- Public app deployed on jurvio-public-01';
            echo '- Verified pages over the public path: /api/ready, /, /cases, /scotus, /supreme-court, /courts';
            echo '- TLS: Cloudflare Origin certificate presented on 443';
            echo '- Database and artifacts use private VPC connections (PostgreSQL and documents stay on jurvio-web-01)';
            echo '- Ports 80/443 are open on jurvio-public-01';
            echo '- DNS has NOT been changed';
            echo "- Verified main commit: $GITHUB_SHA"; } >> "$GITHUB_STEP_SUMMARY"
