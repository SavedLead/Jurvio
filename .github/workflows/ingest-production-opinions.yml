name: Ingest production opinions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ingest-production-opinions.yml
  workflow_dispatch:
    inputs:
      court:
        description: Court to ingest
        required: true
        type: choice
        default: scotus
        options:
          - scotus
      since:
        description: Earliest filing date (YYYY-MM-DD)
        required: true
        default: "2025-10-01"
      limit:
        description: Maximum opinion clusters (1-100)
        required: true
        default: "10"
      order:
        description: Selection priority
        required: true
        type: choice
        default: newest
        options:
          - newest
          - cited

permissions:
  contents: read

concurrency:
  group: jurvio-production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate bounded batch
        env:
          COURT: ${{ github.event_name == 'workflow_dispatch' && inputs.court || 'scotus' }}
          SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '2025-10-01' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '10' }}
          ORDER: ${{ github.event_name == 'workflow_dispatch' && inputs.order || 'newest' }}
        run: |
          test "$COURT" = "scotus"
          printf '%s' "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 100
          case "$ORDER" in newest|cited) ;; *) exit 1 ;; esac

      - name: Configure SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64" || { echo "::error::DO_SSH_KEY_B64 is empty"; exit 1; }
          case "$DO_SSH_KEY_B64" in *[!A-Za-z0-9+/=]*) echo "::error::DO_SSH_KEY_B64 is not one-line base64"; exit 1;; esac
          if ! printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::DO_SSH_KEY_B64 could not be decoded"
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            rm -f ~/.ssh/id_ed25519
            echo "::error::Decoded SSH private key is invalid or passphrase-protected"
            exit 1
          fi
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ingest bounded CourtListener batch
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          COURT: ${{ github.event_name == 'workflow_dispatch' && inputs.court || 'scotus' }}
          SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '2025-10-01' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '10' }}
          ORDER: ${{ github.event_name == 'workflow_dispatch' && inputs.order || 'newest' }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && docker compose -f docker-compose.production.yml exec -T app node jobs/ingest-courtlistener-opinions.mjs --court '$COURT' --since '$SINCE' --limit '$LIMIT' --order '$ORDER' --delay-ms 1000"

      - name: Report corpus and review queue
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('cases', (SELECT count(*) FROM legal_case), 'opinions', (SELECT count(*) FROM judicial_opinion), 'documents', (SELECT count(*) FROM document), 'pending_reviews', (SELECT count(*) FROM publication_review WHERE status = 'pending'));\""
