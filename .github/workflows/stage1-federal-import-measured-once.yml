name: Stage 1 federal import (measured, once)

# APPROVED bounded ingestion stage: import AT MOST `max_chunks` (default 10) ready/failed
# chunks (~10,000 opinions) and STOP. It measures new-vs-update by SOURCE-ID MEMBERSHIP in
# the database (not created_at): it records how many of the target chunks' opinion ids are
# already in judicial_opinion BEFORE the import and AFTER, so new = after_present -
# before_present and updates = before_present. It also records exact DB growth
# (pg_database_size), root-disk use, and app response time (/api/ready) before and after.
# Bounded and synchronous: never drains the backlog.

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Bulk snapshot date YYYY-MM-DD"
        required: false
        default: "2026-09-30"
        type: string
      max_chunks:
        description: "Hard cap on chunks this stage (<=10 for Stage 1)"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-courtlistener-bulk-federal-backfill
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 60
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
      MAX_CHUNKS: ${{ inputs.max_chunks }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Measured bounded import over private VPC
        run: |
          set -euo pipefail
          case "$SNAPSHOT_DATE" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::bad snapshot_date"; exit 1;; esac
          case "$MAX_CHUNKS" in ''|*[!0-9]*) echo "::error::max_chunks must be numeric"; exit 1;; esac
          [ "$MAX_CHUNKS" -le 25 ] || { echo "::error::Stage 1 cap is <=25 chunks; refusing $MAX_CHUNKS"; exit 1; }
          ssh "$INGESTION_USER@$DB_HOST" "SNAPSHOT_DATE='$SNAPSHOT_DATE' MAX_CHUNKS='$MAX_CHUNKS' bash -se" <<'REMOTE'
          set -euo pipefail
          SNAP="$SNAPSHOT_DATE"; MAX="$MAX_CHUNKS"
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' \
            --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          worker="$(find_svc worker-core)"; pg="$(find_svc postgres)"
          [ -n "$worker" ] && [ -n "$pg" ] || { echo "::error::worker-core or postgres missing"; exit 1; }
          pq() { sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "$1" 2>/dev/null; }
          # Latency probe measured INSIDE node (always present in the worker). BusyBox `date`
          # has no %N, so a shell `date +%s%3N` diff was always 0 — the old probe was broken.
          # node's monotonic clock gives true milliseconds; prints an integer or NA on failure.
          appms() { sudo -n docker exec "$worker" node -e 'const t=process.hrtime.bigint();fetch("http://app:3000/api/ready").then(r=>r.arrayBuffer()).then(()=>{process.stdout.write(String(Math.round(Number(process.hrtime.bigint()-t)/1e6)));}).catch(()=>process.stdout.write("NA"));' 2>/dev/null || echo "NA"; }

          echo "=== target chunks: lowest-index claimable (ready/failed), cap ${MAX} ==="
          FILES="$(pq "SELECT file_path FROM federal_import_chunk WHERE snapshot_date='${SNAP}' AND status IN ('ready','failed') ORDER BY chunk_index LIMIT ${MAX};")"
          NCHUNKS="$(printf '%s\n' "$FILES" | grep -c . || true)"
          ATTEMPTED="$(pq "SELECT coalesce(sum(record_count),0) FROM (SELECT record_count FROM federal_import_chunk WHERE snapshot_date='${SNAP}' AND status IN ('ready','failed') ORDER BY chunk_index LIMIT ${MAX}) t;")"
          echo "chunks_selected=${NCHUNKS} attempted_records=${ATTEMPTED}"
          pq "SELECT chunk_key||' '||status||' rc='||record_count FROM federal_import_chunk WHERE snapshot_date='${SNAP}' AND status IN ('ready','failed') ORDER BY chunk_index LIMIT ${MAX};"
          if [ "${NCHUNKS:-0}" -lt 1 ]; then echo "::warning::no ready/failed chunks to import"; echo "=== DONE (no-op) ==="; exit 0; fi

          echo "=== extract this stage's opinion ids from the chunk files ==="
          FILES_SP="$(printf '%s' "$FILES" | tr '\n' ' ')"
          IDS="$(sudo -n docker exec "$worker" sh -lc "zcat ${FILES_SP} | node -e 'const rl=require(\"readline\").createInterface({input:process.stdin});const a=[];rl.on(\"line\",l=>{if(l.trim())a.push(JSON.parse(l).id)});rl.on(\"close\",()=>process.stdout.write(a.join(\",\")))'")"
          NIDS="$(printf '%s' "$IDS" | awk -F, '{print NF}')"
          echo "opinion_ids_extracted=${NIDS}"
          [ "${NIDS:-0}" -ge 1 ] || { echo "::error::no ids extracted"; exit 1; }

          MEMBER="WITH p AS (SELECT id FROM provider WHERE code='courtlistener'), ids AS (SELECT DISTINCT unnest(ARRAY[${IDS}]::text[]) AS oid) SELECT count(*) FROM ids JOIN judicial_opinion jo ON jo.provider_opinion_id=ids.oid AND jo.provider_id=(SELECT id FROM p);"
          DISTINCT_IDS="$(pq "SELECT count(*) FROM (SELECT DISTINCT unnest(ARRAY[${IDS}]::text[]) oid) t;")"

          echo "=== BEFORE snapshot ==="
          BEFORE_PRESENT="$(pq "$MEMBER")"
          BEFORE_DBSIZE="$(pq "SELECT pg_database_size('jurvio');")"
          BEFORE_DISK="$(df -B1 --output=used / | tail -1 | tr -d ' ')"
          BEFORE_APP1="$(appms)"; BEFORE_APP2="$(appms)"
          echo "before: distinct_ids=${DISTINCT_IDS} present_in_db=${BEFORE_PRESENT} db_size_bytes=${BEFORE_DBSIZE} root_used_bytes=${BEFORE_DISK} app_ready_ms=${BEFORE_APP1},${BEFORE_APP2}"

          echo "=== IMPORT (bounded, synchronous, max ${MAX} chunks) ==="
          T0="$(date +%s)"
          sudo -n docker exec -e NODE_OPTIONS=--max-old-space-size=8192 "$worker" \
            node jobs/import-federal-opinion-chunks.mjs --snapshot-date="$SNAP" --max-chunks="$MAX" --stale-minutes=15 2>&1 | tail -n 25 || true
          T1="$(date +%s)"
          echo "import_elapsed_s=$((T1 - T0))"

          echo "=== AFTER snapshot ==="
          AFTER_PRESENT="$(pq "$MEMBER")"
          AFTER_DBSIZE="$(pq "SELECT pg_database_size('jurvio');")"
          AFTER_DISK="$(df -B1 --output=used / | tail -1 | tr -d ' ')"
          AFTER_APP1="$(appms)"; AFTER_APP2="$(appms)"
          echo "after: present_in_db=${AFTER_PRESENT} db_size_bytes=${AFTER_DBSIZE} root_used_bytes=${AFTER_DISK} app_ready_ms=${AFTER_APP1},${AFTER_APP2}"

          echo "=== per-chunk ledger result for this stage ==="
          pq "SELECT chunk_key||' '||status||' written='||opinions_written||' skipped='||opinions_skipped||' err='||left(coalesce(last_error,''),80)
              FROM federal_import_chunk WHERE snapshot_date='${SNAP}' AND chunk_index < ${MAX} ORDER BY chunk_index;"

          echo "=== STAGE 1 SUMMARY (source-ID membership; NOT created_at) ==="
          NEW_INSERTS=$(( AFTER_PRESENT - BEFORE_PRESENT ))
          echo "attempted_records=${ATTEMPTED} distinct_source_ids=${DISTINCT_IDS}"
          echo "present_before=${BEFORE_PRESENT} present_after=${AFTER_PRESENT}"
          echo "genuinely_new_inserts=${NEW_INSERTS}  (ids absent-before, present-after)"
          echo "updates_existing=${BEFORE_PRESENT}  (ids already present, re-written)"
          echo "db_growth_bytes=$(( AFTER_DBSIZE - BEFORE_DBSIZE ))"
          echo "root_disk_growth_bytes=$(( AFTER_DISK - BEFORE_DISK ))"
          echo "import_elapsed_s=$((T1 - T0)) app_ready_ms_before=${BEFORE_APP1}/${BEFORE_APP2} app_ready_ms_after=${AFTER_APP1}/${AFTER_APP2}"
          echo "=== DONE ==="
          REMOTE
