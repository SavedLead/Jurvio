name: Reject false Ninth/Circuit case-news review rows (once)

# One-off: rejects the 13 pending_review single_party_court rows created by the
# court-word bug fixed in #612 (12 Ninth Inning Inc. v. NFL + 1 D'Ostroph v.
# Court of Appeals for the Eighth Circuit). Aborts unless exactly 13 match.
# Dispatch by hand with confirm=REJECT_NINTH.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REJECT_NINTH to run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-reject-case-news-ninth
  cancel-in-progress: false

jobs:
  reject:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Require confirm=REJECT_NINTH
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REJECT_NINTH" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=REJECT_NINTH."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
      - name: Reject the 13 false 'Ninth'/'Circuit' one-party review rows (one transaction)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          pg="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter 'label=com.docker.compose.service=postgres' --format '{{.ID}}' | head -n1)"
          [ -n "$pg" ] || { echo "::error::postgres missing"; exit 1; }
          sudo -n docker exec -i "$pg" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 -At -F ' | ' <<'SQL'
          BEGIN;
          CREATE TEMP TABLE target ON COMMIT DROP AS
            SELECT l.id, c.public_id, c.caption, l.title
            FROM case_news_link l JOIN legal_case c ON c.id = l.case_id
            WHERE l.review_status = 'pending_review'
              AND l.match_method = 'single_party_court'
              AND (c.caption ILIKE 'Ninth Inning Inc.%National Football League%'
                   OR c.caption ILIKE '%Ostroph%Court of Appeals%Circuit%');
          SELECT 'target', count(*) FROM target;
          SELECT public_id, left(caption,60), left(title,100) FROM target ORDER BY 1,3;
          DO $$ BEGIN
            IF (SELECT count(*) FROM target) <> 13 THEN RAISE EXCEPTION 'expected 13 rows, found %', (SELECT count(*) FROM target); END IF;
          END $$;
          UPDATE case_news_link SET review_status = 'rejected', reviewed_by = 'david-rosenberg:ninth-court-word-bug', reviewed_at = now(), updated_at = now()
            WHERE id IN (SELECT id FROM target);
          COMMIT;
          SELECT 'remaining pending', review_status, match_method, count(*) FROM case_news_link WHERE review_status = 'pending_review' GROUP BY 2,3;
          SQL
          REMOTE
