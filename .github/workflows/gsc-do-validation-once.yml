name: Verify DigitalOcean Search Console sync

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=GSC_DO_VALIDATION.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type GSC_DO_VALIDATION to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-search-console-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT: jurvio-search-console@jurvio-search-console.iam.gserviceaccount.com
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      GSC_SITEMAP_URL: ${{ vars.GSC_SITEMAP_URL }}
      GSC_INSPECTION_URLS: ${{ vars.GSC_INSPECTION_URLS }}
    steps:
      - name: Require confirm=GSC_DO_VALIDATION
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "GSC_DO_VALIDATION" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=GSC_DO_VALIDATION."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/936072370485/locations/global/workloadIdentityPools/github-actions/providers/jurvio
          service_account: jurvio-search-console@jurvio-search-console.iam.gserviceaccount.com
          access_token_scopes: https://www.googleapis.com/auth/webmasters
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify connection, submit sitemap, and inspect launch URLs
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: node scripts/sync-google-search-console.mjs
