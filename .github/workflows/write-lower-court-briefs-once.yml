name: Write lower-court descriptions (once)

# After the Supreme Court backlog, unused OpenAI credit can write descriptions
# for published court of appeals cases, newest first, then district cases the
# same way. The model is gpt-6.1-sol only. gpt-6-astra stays on the Supreme
# Court job. Routine filings are skipped in the script and never sent.
#
# This workflow does not publish. A dispatch writes nothing and calls no model.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type WRITE_LOWER_COURT_BRIEFS to run this workflow against production"
        required: true
        type: string
      budget_usd:
        description: "Total dollars this job may spend, including earlier runs of this job. 0 spends nothing."
        required: true
        default: "0"
        type: string
      lane:
        description: "circuit, then district when both. circuit or district limits the run to one level."
        required: true
        default: "both"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-lower-court-briefs
  cancel-in-progress: false

jobs:
  write:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 360
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      CONFIRM: ${{ inputs.confirm }}
      BUDGET: ${{ inputs.budget_usd }}
      LANE: ${{ inputs.lane }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Require confirm and do not publish
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "WRITE_LOWER_COURT_BRIEFS" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=WRITE_LOWER_COURT_BRIEFS."
            exit 1
          fi
          echo "Refusing to publish. No descriptions were written and no model was called."
