name: Phase 1.3 backup via public jump

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=PHASE_1_3_VIA_PUBLIC_JUMP.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PHASE_1_3_VIA_PUBLIC_JUMP to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-phase-1-3-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 90
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKUP_BUCKET: ${{ secrets.JURVIO_BACKUP_BUCKET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.JURVIO_BACKUP_ENCRYPTION_KEY }}
      BACKUP_ACCESS_KEY_ID: ${{ secrets.JURVIO_BACKUP_ACCESS_KEY_ID }}
      BACKUP_SECRET_ACCESS_KEY: ${{ secrets.JURVIO_BACKUP_SECRET_ACCESS_KEY }}
    steps:
      - name: Require confirm=PHASE_1_3_VIA_PUBLIC_JUMP
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PHASE_1_3_VIA_PUBLIC_JUMP" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=PHASE_1_3_VIA_PUBLIC_JUMP."
            exit 1
          fi
      - name: Install GitHub REST helpers (builder-01 has no gh CLI)
        if: always()
        run: |
          # jurvio-builder-01 has curl and jq but no gh CLI. These helpers replace the
          # gh calls this workflow used. Issue comments and report updates are best
          # effort and never fail the job; reads used for decisions still fail loudly.
          cat > "$RUNNER_TEMP/gh-rest.sh" <<'GHREST'
          _gh_curl() {
            local method="$1" path="$2"; shift 2
            curl -fsSL --retry 3 --retry-delay 2 -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN is not set}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" "https://api.github.com/${path#/}"
          }
          gh_api() { _gh_curl GET "$1"; }
          gh_api_post() {
            if [ $# -ge 2 ]; then printf '%s' "$2" | _gh_curl POST "$1" -H "Content-Type: application/json" --data-binary @-
            else _gh_curl POST "$1"; fi
          }
          # Every page of a list endpoint, one JSON document per page (pipe into jq).
          gh_api_paginate() {
            local path="$1" page=1 sep body count
            case "$path" in *\?*) sep='&' ;; *) sep='?' ;; esac
            while [ "$page" -le 50 ]; do
              body="$(gh_api "${path}${sep}page=${page}")" || return 1
              printf '%s\n' "$body"
              count="$(jq '(if type == "array" then . else ([.[] | arrays] | .[0] // []) end) | length' <<<"$body")"
              [ "${count:-0}" -gt 0 ] || break
              page=$((page + 1))
            done
          }
          gh_patch_body() {
            jq -n --arg body "$2" '{body: $body}' \
              | _gh_curl PATCH "$1" -H "Content-Type: application/json" --data-binary @- \
              || { echo "::warning::GitHub update of $1 failed (non-fatal)" >&2; return 0; }
          }
          gh_comment() {
            jq -n --arg body "$2" '{body: $body}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/issues/$1/comments" -H "Content-Type: application/json" --data-binary @- >/dev/null \
              || echo "::warning::comment on issue #$1 failed (non-fatal)" >&2
          }
          gh_issue_create() {
            jq -n --arg title "$1" --arg body "$2" '{title: $title, body: $body}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/issues" -H "Content-Type: application/json" --data-binary @- >/dev/null \
              || echo "::warning::issue creation failed (non-fatal)" >&2
          }
          # gh_dispatch WORKFLOW REF key=value ...
          gh_dispatch() {
            local wf="$1" ref="$2"; shift 2
            local inputs='{}' kv
            for kv in "$@"; do inputs="$(jq -c --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k): $v}' <<<"$inputs")"; done
            jq -n --arg ref "$ref" --argjson inputs "$inputs" '{ref: $ref, inputs: $inputs}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/dispatches" -H "Content-Type: application/json" --data-binary @- >/dev/null
          }
          export -f _gh_curl gh_api gh_api_post gh_api_paginate gh_patch_body gh_comment gh_issue_create gh_dispatch
          GHREST
      - name: Require protected off-site backup configuration
        run: |
          set -euo pipefail
          missing=()
          [ -n "${BACKUP_BUCKET:-}" ] || missing+=(JURVIO_BACKUP_BUCKET)
          [ -n "${BACKUP_ENCRYPTION_KEY:-}" ] || missing+=(JURVIO_BACKUP_ENCRYPTION_KEY)
          [ -n "${BACKUP_ACCESS_KEY_ID:-}" ] || missing+=(JURVIO_BACKUP_ACCESS_KEY_ID)
          [ -n "${BACKUP_SECRET_ACCESS_KEY:-}" ] || missing+=(JURVIO_BACKUP_SECRET_ACCESS_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing protected production secret(s): ${missing[*]}"
            exit 1
          fi
          echo "Protected off-site backup configuration is present (values not printed)."

      - name: Open a temporary SSH path to the public jump host
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          public="$(jq -c '[.droplets[] | select(.name=="jurvio-public-01")][0] // empty' <<<"$droplets")"
          ingestion="$(jq -c '[.droplets[] | select(.name=="jurvio-web-01")][0] // empty' <<<"$droplets")"
          test -n "$public" && test -n "$ingestion"
          public_id="$(jq -r .id <<<"$public")"
          public_ip="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$public")"
          public_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$public")"
          ingestion_id="$(jq -r .id <<<"$ingestion")"
          ingestion_private="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$ingestion")"
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          firewall_id="$(jq -r --argjson id "$public_id" '[.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty' <<<"$firewalls")"
          ingestion_firewall_id="$(jq -r --argjson id "$ingestion_id" '[.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty' <<<"$firewalls")"
          test -n "$firewall_id" && test -n "$ingestion_firewall_id" && test -n "$public_ip" && test -n "$public_private" && test -n "$ingestion_private"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          runner_cidr="$runner_ip/32"
          public_private_cidr="$public_private/32"
          {
            echo "PUBLIC_IP=$public_ip"
            echo "INGESTION_PRIVATE=$ingestion_private"
            echo "FIREWALL_ID=$firewall_id"
            echo "INGESTION_FIREWALL_ID=$ingestion_firewall_id"
            echo "PUBLIC_ID=$public_id"
            echo "PUBLIC_PRIVATE_CIDR=$public_private_cidr"
            echo "RUNNER_CIDR=$runner_cidr"
          } >> "$GITHUB_ENV"
          rule="$(jq -n --arg src "$runner_cidr" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
          curl -fsS -X POST "${auth[@]}" "$api/firewalls/$firewall_id/rules" -d "$rule" >/dev/null
          private_rule="$(jq -n --arg src "$public_private_cidr" --argjson id "$public_id" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src],droplet_ids:[$id]}}]}')"
          curl -fsS -X POST "${auth[@]}" "$api/firewalls/$ingestion_firewall_id/rules" -d "$private_rule" >/dev/null
          gh_comment 426 '1.3 alternate path: `██░░░░░░░░ 20%` Temporary /32 SSH access opened to jurvio-public-01; database remains private.'

      - name: Configure ephemeral SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host public-jump
            HostName $PUBLIC_IP
            User root
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
            StrictHostKeyChecking accept-new
          Host ingestion-private
            HostName $INGESTION_PRIVATE
            User $INGESTION_USER
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump public-jump
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh public-jump true
          ssh ingestion-private true

      - name: Synchronize protected backup configuration to the server
        run: |
          set -euo pipefail
          umask 077
          payload="$(mktemp)"
          remote_payload="/tmp/jurvio-backup-config-${GITHUB_RUN_ID}"
          trap 'rm -f "$payload"' EXIT
          printf '%s\n%s\n%s\n%s\n' \
            "$BACKUP_BUCKET" \
            "$BACKUP_ENCRYPTION_KEY" \
            "$BACKUP_ACCESS_KEY_ID" \
            "$BACKUP_SECRET_ACCESS_KEY" > "$payload"
          scp "$payload" "ingestion-private:$remote_payload"
          ssh ingestion-private bash -s -- "$remote_payload" <<'REMOTE'
          set -euo pipefail
          payload="$1"
          trap 'rm -f "$payload"' EXIT
          chmod 600 "$payload"
          IFS= read -r bucket < "$payload"
          key="$(sed -n '2p' "$payload")"
          access_key_id="$(sed -n '3p' "$payload")"
          secret_access_key="$(sed -n '4p' "$payload")"
          test -n "$bucket" && test -n "$key"
          test -n "$access_key_id" && test -n "$secret_access_key"
          cd /opt/jurvio
          test -s .env.production
          tmp="$(mktemp)"
          trap 'rm -f "$payload" "$tmp"' EXIT
          grep -vE '^JURVIO_BACKUP_(BUCKET|ENCRYPTION_KEY|ACCESS_KEY_ID|SECRET_ACCESS_KEY)=' .env.production > "$tmp" || true
          printf 'JURVIO_BACKUP_BUCKET=%s\nJURVIO_BACKUP_ENCRYPTION_KEY=%s\nJURVIO_BACKUP_ACCESS_KEY_ID=%s\nJURVIO_BACKUP_SECRET_ACCESS_KEY=%s\n' \
            "$bucket" "$key" "$access_key_id" "$secret_access_key" >> "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" .env.production
          echo "Dedicated backup bucket credentials and encryption key synchronized (values not printed)."
          REMOTE
          rm -f "$payload"
          trap - EXIT

      - name: Create, upload, and verify the recovery point
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set -euo pipefail
          ssh ingestion-private bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          test -x scripts/backup-production.sh
          backup_path="$(find backups -maxdepth 1 -type f -name 'jurvio-*.sql.gz' -mmin -240 -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -n "$backup_path" ] && [ -s "$backup_path" ] && gzip -t "$backup_path"; then
            echo "Reusing the fresh verified local dump: $backup_path"
          else
            backup_path="$(scripts/backup-production.sh </dev/null | tail -1)"
            test -s "$backup_path"
            gzip -t "$backup_path"
          fi
          image="$(docker inspect -f '{{.Config.Image}}'             "$(docker ps --filter 'label=com.docker.compose.project=jurvio'                          --filter 'label=com.docker.compose.service=app'                          --format '{{.ID}}' | head -n1)")"
          test -n "$image"
          docker run --rm             --user "$(id -u):$(id -g)"             --env-file .env.production             -v /opt/jurvio/backups:/backups:ro             "$image"             node jobs/upload-database-backup.mjs --file "/backups/$(basename "$backup_path")" </dev/null
          docker run --rm             --user "$(id -u):$(id -g)"             --env-file .env.production             "$image"             node jobs/verify-database-backup.mjs --head-only --max-age-hours 36 </dev/null
          printf 'BACKUP_VERIFIED=%s\n' "$backup_path"
          REMOTE
          gh_comment 426 '1.3 alternate path: `██████████ 100%` Compressed database dump created, encrypted off-site upload completed, and recovery-point freshness verified.'

      - name: Remove temporary SSH access
        if: always()
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set +e
          api=https://api.digitalocean.com/v2
          if [ -n "${FIREWALL_ID:-}" ] && [ -n "${RUNNER_CIDR:-}" ]; then
            rule="$(jq -n --arg src "$RUNNER_CIDR" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
            curl -fsS -X DELETE               -H "Authorization: Bearer $DO_TOKEN"               -H "Content-Type: application/json"               "$api/firewalls/$FIREWALL_ID/rules" -d "$rule"
          fi
          if [ -n "${INGESTION_FIREWALL_ID:-}" ] && [ -n "${PUBLIC_PRIVATE_CIDR:-}" ] && [ -n "${PUBLIC_ID:-}" ]; then
            private_rule="$(jq -n --arg src "$PUBLIC_PRIVATE_CIDR" --argjson id "$PUBLIC_ID" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src],droplet_ids:[$id]}}]}')"
            curl -fsS -X DELETE \
              -H "Authorization: Bearer $DO_TOKEN" \
              -H "Content-Type: application/json" \
              "$api/firewalls/$INGESTION_FIREWALL_ID/rules" -d "$private_rule"
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/config
          gh_comment 426 "1.3 alternate path finished with status: **${{ job.status }}**. Temporary SSH rule removal attempted. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
