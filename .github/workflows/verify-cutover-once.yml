name: Verify cutover once

# Post-cutover verification, split so the public checks never depend on the
# builder:
#   - public: hosted runner probes jurvio.com through Cloudflare (pages + TLS).
#   - origin: builder confirms traffic lands on jurvio-public-01 (nginx log) and
#             that ingestion + PostgreSQL on jurvio-web-01 are healthy.
# Read-only; does not stop or modify any service; no DNS change.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-verify-cutover
  cancel-in-progress: false

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe jurvio.com through Cloudflare
        run: |
          set +e
          echo "=== Public pages via https://jurvio.com (through Cloudflare) ==="
          printf '%-16s %-6s %-9s %s\n' "ROUTE" "CODE" "SECONDS" "server"
          for r in /api/ready /api/health / /cases /scotus /supreme-court /courts; do
            out="$(curl -sS -o /dev/null -w '%{http_code} %{time_total}' --max-time 45 "https://jurvio.com$r" 2>/dev/null)"
            [ -n "$out" ] || out="ERR --"
            code="${out%% *}"; t="${out##* }"
            srv="$(curl -sSI --max-time 20 "https://jurvio.com$r" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="server:"{print $2}')"
            printf '%-16s %-6s %-9s %s\n' "$r" "$code" "$t" "$srv"
          done
          echo ""
          echo "=== Public TLS (Cloudflare edge) for jurvio.com ==="
          echo | openssl s_client -connect jurvio.com:443 -servername jurvio.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "TLS read failed"
          echo ""
          echo "=== www / z hostnames ==="
          for h in www.jurvio.com z.jurvio.com; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$h/api/ready" 2>/dev/null)"
            echo "$h/api/ready -> ${code:-ERR}"
          done
          exit 0

  origin:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      PUBLIC_PRIVATE: 10.116.0.5
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 12
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Confirm traffic is reaching jurvio-public-01
        run: |
          set -euo pipefail
          ssh "root@$PUBLIC_PRIVATE" bash -s <<'REMOTE'
          set +e
          echo "host: $(hostname)"
          echo "--- app container ---"
          cid="$(docker ps -q -f label=com.docker.compose.project=jurvio-public -f label=com.docker.compose.service=app | head -1)"
          docker ps --filter "id=$cid" --format '{{.Names}} {{.Status}}'
          echo "--- recent nginx access-log lines for jurvio.com (proves Cloudflare -> this origin) ---"
          for f in /var/log/nginx/access.log /var/log/nginx/jurvio.access.log; do
            [ -f "$f" ] && { echo "== $f =="; tail -n 12 "$f"; }
          done
          echo "--- GET-request count in the last 200 log lines ---"
          tail -n 200 /var/log/nginx/access.log 2>/dev/null | grep -c ' "GET '
          REMOTE

      - name: Confirm ingestion + PostgreSQL on jurvio-web-01 are healthy (read-only)
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set +e
          echo "host: $(hostname)"
          echo "--- running containers (ingestion workers, db, old web should all still be up) ---"
          sudo -n docker ps --format '{{.Names}}\t{{.Status}}'
          echo "--- ingestion freshness + DB liveness (read-only) ---"
          cid="$(sudo -n docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')"
          if [ -n "$cid" ]; then
            sudo -n docker exec -i "$cid" psql -U jurvio -d jurvio -v ON_ERROR_STOP=0 -c "SELECT now() AS db_time;" \
              -c "SELECT max(created_at) AS latest_docket_entry FROM docket_entry;" \
              -c "SELECT max(created_at) AS latest_document FROM document;" \
              -c "SELECT count(*) AS unpublished_outbox FROM outbox_event WHERE published_at IS NULL;" \
              -c "SELECT indexname FROM pg_indexes WHERE tablename='document' ORDER BY indexname;"
          else
            echo "postgres container not found"
          fi
          REMOTE
