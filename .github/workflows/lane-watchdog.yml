name: Lane watchdog (self-heal wedged scheduler workers)

# Self-heal watchdog for the ingestion scheduler workers on jurvio-web-01.
#
# WHAT WEDGES: the scheduler lane workers can go silently dead without exiting.
#   - worker-core runs the SCOTUS + federal lanes; worker-coa runs the appellate
#     lanes; worker-supervisor reaps the durable PG job queue.
#   - A publish child process can hang (e.g. a stuck network write): the lane's
#     cycle is then skipped forever and no new work is published, but the parent
#     process stays alive, so nothing crashes and nothing restarts.
#   - A worker can also OOM-die but leave a wedged/zombie state.
#   SCOTUS once sat dead for ~28h until a human manually restarted worker-core.
#
# WHY COMPOSE DOESN'T SELF-HEAL: by design the supervisor does NOT auto-restart a
#   lane (see scripts/run-ingestion-supervisor.ts -- a startup crash needs a human
#   fix, not a restart loop). And compose `restart: unless-stopped` only restarts a
#   service when its PROCESS EXITS -- it does NOT act on `health: unhealthy`. So an
#   unhealthy-but-still-running worker sits dead forever.
#
# WHAT THIS LEVERAGES: the docker-compose.production.yml healthchecks for
#   worker-core / worker-coa / worker-supervisor already detect a wedged worker.
#   Each reads its scheduler heartbeat file
#   (/var/lib/jurvio/artifacts/scheduler/{core,coa,supervisor}.alive, refreshed
#   every 30s) and flips the container to `health: unhealthy` when the heartbeat is
#   >180s stale. This watchdog simply finds jurvio worker containers reporting
#   health=unhealthy and force-recreates them -- closing the gap compose leaves.
#
# TWO LOAD-BEARING SAFETIES ON EVERY RECREATE (omitting either caused an incident):
#   * JURVIO_IMAGE must be the jurvio app image. It is derived from a container that
#     actually runs that image (app, then worker-supervisor) and asserted to contain
#     "jurvio" -- NEVER postgres, whose image is postgres:16-alpine and would
#     crash-loop any worker recreated onto it (exit 127, no `node`).
#   * JURVIO_DATABASE_BIND must be re-exported. `compose up --force-recreate`
#     re-interpolates the whole file including postgres' published port
#     "${JURVIO_DATABASE_BIND:-127.0.0.1}:5432:5432". That var lives in
#     .env.production (which compose does NOT auto-load), so without exporting it the
#     recreate rebinds postgres to loopback and cuts the public app off from the DB.
#
# WHERE IT RUNS: on the self-hosted builder, reaching jurvio-web-01 over the private
#   VPC (10.116.0.2), the same route the deploy and other box-exec workflows use,
#   because GitHub-hosted runners' egress IPs are firewalled off the box SSH.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what WOULD be restarted without doing it"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-lane-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Detect and heal wedged scheduler workers
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" "DRY_RUN='$DRY_RUN' bash -se" <<'REMOTE'
          set -euo pipefail
          DRY_RUN="${DRY_RUN:-false}"
          cd /opt/jurvio

          echo "=== Lane watchdog run @ $(TZ='America/New_York' date +'%Y-%m-%d %H:%M:%S %Z') (dry_run=${DRY_RUN}) ==="

          # Full inventory of jurvio compose containers with health status.
          ps_all() {
            sudo -n docker ps \
              --filter 'label=com.docker.compose.project=jurvio' \
              --format '{{.Names}}\t{{.State}}\t{{.Status}}'
          }

          echo "=== Worker health report ==="
          all="$(ps_all)"
          # Only the scheduler workers are watchdog candidates -- never postgres/app.
          workers="$(printf '%s\n' "$all" | grep -E 'worker-(core|coa|supervisor)' || true)"
          if [ -z "$workers" ]; then
            echo "::warning::no jurvio scheduler worker containers found"
          fi
          # Classify + collect the unhealthy ones by container name.
          unhealthy=""
          while IFS=$'\t' read -r name state status; do
            [ -n "$name" ] || continue
            case "$status" in
              *'(unhealthy)'*) health="UNHEALTHY"; unhealthy="${unhealthy}${name}"$'\n' ;;
              *'(healthy)'*)   health="healthy" ;;
              *'(health: starting)'*|*'(starting)'*) health="starting" ;;
              *) health="unknown" ;;
            esac
            printf '  %-28s %-10s %-10s %s\n' "$name" "$state" "$health" "$status"
          done <<< "$workers"
          unhealthy="$(printf '%s' "$unhealthy" | sed '/^$/d')"

          if [ -z "$unhealthy" ]; then
            echo "all scheduler workers healthy -- no action"
            exit 0
          fi

          echo "=== Unhealthy scheduler workers detected ==="
          printf '%s\n' "$unhealthy"

          # SAFETY 1 -- JURVIO_IMAGE. It is supplied to compose at deploy time
          # (release-production.sh exports it) and is NOT persisted on the box, so an
          # out-of-band `compose up` must provide it or every ${JURVIO_IMAGE:?...}
          # interpolation fails. Derive it from a container that ACTUALLY runs the
          # jurvio image -- app, then worker-supervisor -- and NEVER postgres, whose
          # image is postgres:16-alpine and would crash-loop any worker recreated onto
          # it (exit 127, no `node`). Assert the resolved tag is a jurvio image.
          stable="$(sudo -n docker ps \
            --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=app' \
            --format '{{.ID}}' | head -n1)"
          [ -n "$stable" ] || stable="$(sudo -n docker ps \
            --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=worker-supervisor' \
            --format '{{.ID}}' | head -n1)"
          [ -n "$stable" ] || { echo "::error::no running jurvio app/worker-supervisor container to derive JURVIO_IMAGE"; exit 1; }
          IMG="$(sudo -n docker inspect --format '{{.Config.Image}}' "$stable")"
          [ -n "$IMG" ] || { echo "::error::could not resolve running JURVIO_IMAGE"; exit 1; }
          case "$IMG" in
            *jurvio*) : ;;
            *) echo "::error::resolved JURVIO_IMAGE is not a jurvio image (got '${IMG}'); refusing to recreate workers onto it"; exit 1 ;;
          esac
          echo "using JURVIO_IMAGE=${IMG}"

          # SAFETY 2 -- JURVIO_DATABASE_BIND must be re-exported on every recreate, or
          # compose rebinds postgres from the VPC IP to loopback and cuts off the
          # public app. Read it from .env.production exactly like release-production.sh.
          DB_BIND=""
          if [ -f /opt/jurvio/.env.production ]; then
            DB_BIND_LINE="$(grep -E '^JURVIO_DATABASE_BIND=' /opt/jurvio/.env.production | tail -1 || true)"
            if [ -n "$DB_BIND_LINE" ]; then
              DB_BIND="$(printf '%s' "${DB_BIND_LINE#JURVIO_DATABASE_BIND=}" | tr -d '\r')"
            fi
          fi
          if [ -n "$DB_BIND" ]; then
            echo "using JURVIO_DATABASE_BIND=${DB_BIND} (postgres port publication)"
          else
            echo "::error::JURVIO_DATABASE_BIND not found in /opt/jurvio/.env.production -- refusing to recreate (a recreate without it would rebind postgres to loopback and cut off the public app)"
            exit 1
          fi

          restarted=0
          while IFS= read -r cname; do
            [ -n "$cname" ] || continue
            svc="$(sudo -n docker inspect --format '{{ index .Config.Labels "com.docker.compose.service"}}' "$cname" || true)"
            if [ -z "$svc" ]; then
              echo "::warning::could not resolve compose service for ${cname} -- skipping"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "WOULD RESTART ${svc} (container ${cname})"
              continue
            fi
            echo "--- Recreating ${svc} (container ${cname}) ---"
            sudo -n env JURVIO_IMAGE="$IMG" JURVIO_DATABASE_BIND="$DB_BIND" \
              docker compose -f docker-compose.production.yml up -d --force-recreate "$svc"
            restarted=$((restarted + 1))
          done <<< "$unhealthy"

          if [ "$DRY_RUN" = "true" ]; then
            echo "=== dry_run: no workers were recreated ==="
            exit 0
          fi

          echo "=== Restarted ${restarted} scheduler worker(s) this run ==="
          echo "=== Post-restart worker state (heartbeat should refresh within ~30s) ==="
          ps_all | grep -E 'worker-(core|coa|supervisor)' || true
          echo "=== DONE ==="
          REMOTE
