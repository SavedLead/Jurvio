name: Verify published federal pages (once, read-only)

# Read-only. Fetches the most recently published federal cases/opinions (by the pilot's
# publication_decision reason codes) and checks each public page returns HTTP 200 with real
# content and is search-visible. Passes IDs directly to docker exec -e NAME=VALUE (sudo
# resets the environment, so the inline VAR=... prefix never reached the container before).
# Publishes nothing.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent published cases to verify"
        required: false
        default: "12"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-verify-published-federal
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 12
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      LIMIT: ${{ inputs.limit }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Verify over private VPC
        run: |
          set -uo pipefail
          ssh "$INGESTION_USER@$DB_HOST" "LIMIT='${LIMIT:-12}' bash -se" <<'REMOTE'
          set -uo pipefail
          LIM="${LIMIT:-12}"
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          pg="$(find_svc postgres)"; worker="$(find_svc worker-core)"
          q() { sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "$1" 2>/dev/null; }
          CASE_REASONS="('deterministic_federal_source_validation','verified_cited_federal_opinion')"
          DOC_REASONS="('deterministic_federal_opinion_document','verified_cited_federal_opinion')"
          echo "=== recently published federal cases (public_id | caption) ==="
          q "SELECT lc.public_id||' | '||left(coalesce(lc.caption,''),60) FROM publication_decision pd JOIN legal_case lc ON lc.id=pd.object_id WHERE pd.object_type='legal_case' AND pd.displayable AND pd.reason_code IN $CASE_REASONS ORDER BY pd.decided_at DESC LIMIT $LIM"
          CASES="$(q "SELECT coalesce(string_agg(x.public_id||chr(9)||x.cap,chr(10)),'') FROM (SELECT lc.public_id, replace(left(coalesce(lc.caption,''),60),chr(9),' ') AS cap FROM publication_decision pd JOIN legal_case lc ON lc.id=pd.object_id WHERE pd.object_type='legal_case' AND pd.displayable AND pd.reason_code IN $CASE_REASONS ORDER BY pd.decided_at DESC LIMIT $LIM) x")"
          DOCS="$(q "SELECT coalesce(string_agg(lc.public_id||'/'||d.public_id,chr(10)),'') FROM (SELECT object_id FROM publication_decision WHERE object_type='document' AND displayable AND reason_code IN $DOC_REASONS ORDER BY decided_at DESC LIMIT $LIM) r JOIN document d ON d.id=r.object_id JOIN legal_case lc ON lc.id=d.case_id")"
          echo "doc_sample=$DOCS"
          echo "=== verify pages (HTTP 200 + real content) + search visibility ==="
          sudo -n docker exec -e CASES="$CASES" -e DOCS="$DOCS" "$worker" node -e '
            const base="http://app:3000";
            const cases=(process.env.CASES||"").split("\n").filter(Boolean).map(l=>{const [pid,cap=""]=l.split("\t");return {pid,cap};});
            const docs=(process.env.DOCS||"").split("\n").filter(Boolean);
            const get=async u=>{try{const r=await fetch(u);const t=await r.text();return {s:r.status,n:t.length,t};}catch(e){return {s:0,n:0,t:"",e:String(e)};}};
            (async()=>{
              let pageFail=0, searchFail=0;
              for(const {pid,cap} of cases){
                const r=await get(base+"/case/"+pid);
                const ok=r.s===200 && r.n>800 && r.t.includes(pid);
                if(!ok) pageFail++;
                console.log("CASE "+pid+" status="+r.s+" bytes="+r.n+" content="+(ok?"ok":"THIN/MISSING"));
                const kw=(cap.replace(/[^A-Za-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3).slice(0,3).join(" "))||cap;
                if(kw.length>=2){
                  const sr=await get(base+"/search?q="+encodeURIComponent(kw));
                  const found=sr.s===200 && sr.t.includes(pid);
                  if(!found) searchFail++;
                  console.log("  SEARCH q=\""+kw+"\" status="+sr.s+" found_case="+(found?"yes":"NO"));
                }
              }
              for(const d of docs){
                const r=await get(base+"/case/"+d);
                const ok=r.s===200 && r.n>800;
                if(!ok) pageFail++;
                console.log("DOC  "+d+" status="+r.s+" bytes="+r.n+" content="+(ok?"ok":"THIN/MISSING"));
              }
              console.log("VERIFY_SUMMARY page_failures="+pageFail+" search_failures="+searchFail+" cases="+cases.length+" docs="+docs.length);
            })();
          '
          echo "=== DONE ==="
          REMOTE
