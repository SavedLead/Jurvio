name: Audit district court public feeds

# The weekly pass lives on web-01 as the district-court-source-scout scheduler
# job. This workflow is the manual re-run. It no longer wakes the builder every Sunday.
on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=DISTRICT_COURT_SOURCE_AUDIT.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DISTRICT_COURT_SOURCE_AUDIT to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: district-court-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 15
    steps:
      - name: Require confirm=DISTRICT_COURT_SOURCE_AUDIT
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DISTRICT_COURT_SOURCE_AUDIT" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=DISTRICT_COURT_SOURCE_AUDIT."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/audit-federal-district-court-feeds.ts > district-court-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: district-court-coverage
          path: district-court-coverage.json
          retention-days: 7
