name: Audit district court public feeds

# The weekly pass lives on web-01 as the district-court-source-scout scheduler
# job. This workflow is the manual re-run. It no longer wakes the builder every Sunday.
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-federal-district-court-feeds.ts"
      - ".github/workflows/district-court-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: district-court-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/audit-federal-district-court-feeds.ts > district-court-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: district-court-coverage
          path: district-court-coverage.json
          retention-days: 7
