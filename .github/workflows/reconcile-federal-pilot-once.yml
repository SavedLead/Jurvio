name: Reconcile federal pilot publication (once, read-only)

# Read-only reconciliation. Separates PRE-EXISTING resident-lane publications from the
# PILOT-attributable ones (the cumulative 10-case / 10-document pilot ceiling applies only to
# the latter), counts DISTINCT currently-published case/document ids (not decision rows),
# relates them to the total federal/deterministic-path population, confirms no publisher or
# importer process is still running on the box, inspects the cancelled run's exact window for
# any committed publications, and verifies the NINE exact pilot case ids (case page, document
# content, and search -- separately). Publishes nothing, resumes no lane, unpublishes nothing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-reconcile-federal-pilot
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Reconcile over private VPC
        run: |
          set -uo pipefail
          ssh "$INGESTION_USER@$DB_HOST" "bash -se" <<'REMOTE'
          set -uo pipefail
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          pg="$(find_svc postgres)"; worker="$(find_svc worker-core)"
          q() { sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "$1" 2>/dev/null; }
          CASE_REASONS="('deterministic_federal_source_validation','verified_cited_federal_opinion')"
          DOC_REASONS="('deterministic_federal_opinion_document','verified_cited_federal_opinion')"
          FED="(court.verification='verified' OR lower(coalesce(court.jurisdiction,'')) IN ('f','fd','fb','fbp','fs','federal'))"

          echo "=== pause flags (both must be =1; this job resumes nothing) ==="
          grep -E '^JURVIO_PAUSE_(CITATION_PUBLISH|FEDERAL_PUBLICATION)=' /opt/jurvio/.env.production || echo "(none present)"

          echo "=== (A) lingering publisher/importer processes across jurvio containers (none = clean) ==="
          for c in $(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --format '{{.Names}}'); do
            sudo -n docker exec "$c" sh -lc "ps -eo pid,etime,args 2>/dev/null | grep -E 'run-federal-ingestion-loop|import-federal-opinion|run-case-citations' | grep -v grep" 2>/dev/null | sed "s|^|${c}: |" || true
          done
          echo "(end process scan)"

          echo "=== (B) cancelled run window: anything published at/after 2026-10-16 01:32:00Z ==="
          q "SELECT 'cases_published_since_window='||count(DISTINCT object_id) FROM publication_decision WHERE object_type='legal_case' AND displayable AND reason_code IN $CASE_REASONS AND decided_at >= '2026-10-16 01:32:00+00'"
          q "SELECT 'docs_published_since_window='||count(DISTINCT object_id) FROM publication_decision WHERE object_type='document' AND displayable AND reason_code IN $DOC_REASONS AND decided_at >= '2026-10-16 01:32:00+00'"
          q "SELECT lc.public_id||' | '||pd.object_type||' | '||pd.decided_at::text FROM publication_decision pd JOIN legal_case lc ON lc.id=pd.object_id WHERE pd.object_type='legal_case' AND pd.displayable AND pd.reason_code IN $CASE_REASONS AND pd.decided_at >= '2026-10-16 01:32:00+00' ORDER BY pd.decided_at"

          echo "=== (C) DISTINCT currently-published ids (authoritative legal_case/document.publication) ==="
          q "SELECT 'federal_cases_currently_published='||count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE legal_case.publication='published' AND $FED"
          q "SELECT 'federal_opinion_documents_currently_published='||count(DISTINCT document.id) FROM document JOIN legal_case ON legal_case.id=document.case_id JOIN court ON court.id=legal_case.court_id WHERE document.publication='published' AND $FED"
          q "SELECT 'distinct_cases_displayable_pilot_reasons='||count(DISTINCT object_id) FROM publication_decision WHERE object_type='legal_case' AND displayable AND reason_code IN $CASE_REASONS"
          q "SELECT 'distinct_docs_displayable_pilot_reasons='||count(DISTINCT object_id) FROM publication_decision WHERE object_type='document' AND displayable AND reason_code IN $DOC_REASONS"

          echo "=== (D) reconcile with 147,722 deterministic-path cases: federal population by state ==="
          q "SELECT 'federal_legal_case_total='||count(*) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE $FED"
          q "SELECT 'by_publication_state | '||legal_case.publication::text||' = '||count(*) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE $FED GROUP BY legal_case.publication ORDER BY 1"
          q "SELECT 'distinct_cases_with_any_deterministic_decision(processed)='||count(DISTINCT object_id) FROM publication_decision WHERE object_type='legal_case' AND reason_code IN $CASE_REASONS"
          q "SELECT 'federal_publication_hold_rows='||count(*) FROM federal_publication_hold" 2>/dev/null || echo "federal_publication_hold_rows=NA"

          echo "=== (E) published-case histogram by decided date (single dominant date = pre-pause bulk) ==="
          q "SELECT pd.decided_at::date::text||' | '||count(DISTINCT pd.object_id) FROM publication_decision pd WHERE pd.object_type='legal_case' AND pd.displayable AND pd.reason_code IN $CASE_REASONS GROUP BY 1 ORDER BY 1"
          echo "  (pilot-attributable = the 2026-10-15 bucket = the nine ids below; everything earlier is pre-pause resident-lane)"

          echo "=== (F) verify the NINE exact pilot ids: case page | document content | search (separately) ==="
          PILOT_IDS="jv-w4qv50v47q jv-bhi2b354dc jv-tzef3d6orb jv-a51643mz73 jv-eb4n3k8x8i jv-fv9v9djs4v jv-jne1hr0pp8 jv-p0jwzx0s0v jv-d7kc0arehd"
          # SQL in-list of the nine, plus their captions and any published opinion docs.
          inlist=""; for id in $PILOT_IDS; do inlist="${inlist}${inlist:+,}'${id}'"; done
          echo "pilot_case_count_matched_in_db=$(q "SELECT count(*) FROM legal_case WHERE public_id IN (${inlist})")"
          CASES="$(q "SELECT coalesce(string_agg(public_id||chr(9)||replace(coalesce(caption,''),chr(9),' '),chr(10)),'') FROM legal_case WHERE public_id IN (${inlist})")"
          DOCS="$(q "SELECT coalesce(string_agg(lc.public_id||'/'||d.public_id,chr(10)),'') FROM document d JOIN legal_case lc ON lc.id=d.case_id WHERE lc.public_id IN (${inlist}) AND d.publication='published'")"
          echo "pilot_published_documents=$(printf '%s' "$DOCS" | grep -c . || true)"
          sudo -n docker exec -e CASES="$CASES" -e DOCS="$DOCS" "$worker" node -e '
            const base="http://app:3000";
            const cases=(process.env.CASES||"").split("\n").filter(Boolean).map(l=>{const [pid,cap=""]=l.split("\t");return {pid,cap};});
            const docs=(process.env.DOCS||"").split("\n").filter(Boolean);
            const get=async u=>{try{const r=await fetch(u);const t=await r.text();return {s:r.status,n:t.length,t};}catch(e){return {s:0,n:0,t:"",e:String(e)};}};
            (async()=>{
              let casePageFail=0, docPageFail=0, searchFail=0;
              console.log("-- CASE PAGES --");
              for(const {pid} of cases){
                const r=await get(base+"/case/"+pid);
                const ok=r.s===200 && r.n>800 && r.t.includes(pid);
                if(!ok) casePageFail++;
                console.log("CASE "+pid+" status="+r.s+" bytes="+r.n+" content="+(ok?"ok":"THIN/MISSING"));
              }
              console.log("-- DOCUMENT CONTENT ("+docs.length+" published pilot docs) --");
              for(const d of docs){
                const r=await get(base+"/case/"+d.replace("/","/documents/"));
                const ok=r.s===200 && r.n>800;
                if(!ok) docPageFail++;
                console.log("DOC  "+d+" status="+r.s+" bytes="+r.n+" content="+(ok?"ok":"THIN/MISSING"));
              }
              console.log("-- SEARCH RESULTS --");
              for(const {pid,cap} of cases){
                const kw=(cap.replace(/[^A-Za-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3).slice(0,3).join(" "))||cap;
                if(kw.length>=2){
                  const sr=await get(base+"/search?q="+encodeURIComponent(kw));
                  const found=sr.s===200 && sr.t.includes(pid);
                  if(!found) searchFail++;
                  console.log("SEARCH "+pid+" q=\""+kw+"\" status="+sr.s+" found="+(found?"yes":"NO"));
                }
              }
              console.log("PILOT_VERIFY cases="+cases.length+" docs="+docs.length+" case_page_failures="+casePageFail+" doc_page_failures="+docPageFail+" search_failures="+searchFail);
            })();
          '
          echo "=== DONE ==="
          REMOTE
