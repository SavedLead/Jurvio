name: Reboot Jurvio ingestion server once

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=REBOOT_INGESTION.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REBOOT_INGESTION to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-reboot-ingestion-once
  cancel-in-progress: false

jobs:
  reboot:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 12
    environment: production
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Require confirm=REBOOT_INGESTION
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REBOOT_INGESTION" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=REBOOT_INGESTION."
            exit 1
          fi
      - name: Resolve and reboot only jurvio-web-01
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          target="$(jq -c '[.droplets[] | select(.name=="jurvio-web-01")][0] // empty' <<<"$droplets")"
          test -n "$target" || { echo "::error::Exact Jurvio ingestion server not found"; exit 1; }
          target_id="$(jq -r .id <<<"$target")"
          public_id="$(jq -r '[.droplets[] | select(.name=="jurvio-public-01")][0].id // empty' <<<"$droplets")"
          builder_id="$(jq -r '[.droplets[] | select(.name=="jurvio-builder-01")][0].id // empty' <<<"$droplets")"
          test -n "$public_id" && test -n "$builder_id"
          test "$target_id" != "$public_id"
          test "$target_id" != "$builder_id"
          test "$target_id" != "590318692"
          test "$(jq -r .name <<<"$target")" = "jurvio-web-01"
          curl -fsS -X POST "${auth[@]}" "$api/droplets/$target_id/actions" -d '{"type":"power_cycle"}' >/dev/null
          for _ in $(seq 1 90); do
            status="$(curl -fsS "${auth[@]}" "$api/droplets/$target_id" | jq -r .droplet.status)"
            [ "$status" = active ] && break
            sleep 5
          done
          [ "$status" = active ]
          sleep 20
          echo "### Controlled reboot complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: jurvio-web-01" >> "$GITHUB_STEP_SUMMARY"
          echo "- Droplet ID: $target_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
