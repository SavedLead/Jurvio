name: Diagnose case page sections (once, read-only)

# Read-only coverage report for the public case page answer sections ("What
# happened in this case?", "What is this case about?", "Why does this case
# matter?", "What was the ruling or outcome?", "What happened most recently?")
# across published cases, by tier and court type, plus the source fields that
# could fill them deterministically, and thin (one-word) captions. Changes
# nothing: default_transaction_read_only=on, SELECT/WITH only.
#
# Dispatch by hand with confirm=DIAGNOSE.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DIAGNOSE to run this read-only report"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-case-sections
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 90
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Require confirm=DIAGNOSE
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DIAGNOSE" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=DIAGNOSE."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
      - name: Case section report over private VPC (read-only SQL)
        run: |
          set -uo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "bash -s" <<'REMOTE' | tee "$RUNNER_TEMP/report.txt"
          set -uo pipefail
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          pg="$(find_svc postgres)"
          [ -n "$pg" ] || { echo "::error::postgres missing"; exit 1; }
          q() {
            case "$(printf '%s' "$1" | tr -s '[:space:]' ' ' | sed 's/^ //' | cut -c1-6 | tr '[:lower:]' '[:upper:]')" in
              SELECT|WITH*) ;;
              *) echo "(refused: not a SELECT)"; return 0 ;;
            esac
            sudo -n docker exec \
              -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=1500s -c lock_timeout=5s' \
              "$pg" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 -q -At -F ' | ' -c "$1" || echo "(query failed)"
          }
          echo "=== CASE SECTIONS @ $(date -u +%FT%TZ) (read-only) session_read_only=$(q "SELECT current_setting('default_transaction_read_only')") ==="
          base="WITH pc AS (
              SELECT c.id, c.caption, c.docket_number, c.verification::text AS verification, c.status_explanation, c.disposition_scope,
                     c.judgment_state, c.filed_on, c.decided_on, c.terminated_on, c.nature_of_suit_code, c.cause_of_action,
                     coalesce(t.tier::text, 'none') AS tier,
                     CASE WHEN ct.provider_court_id = 'scotus' OR c.supreme_court_term IS NOT NULL THEN 'scotus'
                          ELSE coalesce(ct.jurisdiction, '?') END AS ctype,
                     ct.provider_court_id AS court_code,
                     e.background_summary, e.question_presented, e.significance_summary, e.exact_holding
                FROM legal_case c JOIN court ct ON ct.id = c.court_id
                LEFT JOIN publication_tier_release t ON t.case_id = c.id AND t.state = 'published'
                LEFT JOIN scotus_case_enrichment e ON e.case_id = c.id AND e.verification = 'verified'
               WHERE c.publication = 'published')"
          echo "--- 0. court jurisdiction values among published (jurisdiction | cases) ---"
          q "SELECT coalesce(ct.jurisdiction, '?'), count(*) FROM legal_case c JOIN court ct ON ct.id = c.court_id WHERE c.publication = 'published' GROUP BY 1 ORDER BY 2 DESC"
          echo "--- 1. sections filled (tier | ctype | cases | happened | about | matters | outcome | latest_has_date | verified | status_expl | disposition!=none) ---"
          q "$base SELECT tier, ctype, count(*),
                count(*) FILTER (WHERE background_summary IS NOT NULL OR (verification = 'verified' AND status_explanation IS NOT NULL)),
                count(*) FILTER (WHERE question_presented IS NOT NULL),
                count(*) FILTER (WHERE significance_summary IS NOT NULL),
                count(*) FILTER (WHERE exact_holding IS NOT NULL OR (verification = 'verified' AND disposition_scope NOT IN ('none', 'unknown'))),
                count(*) FILTER (WHERE filed_on IS NOT NULL OR decided_on IS NOT NULL),
                count(*) FILTER (WHERE verification = 'verified'),
                count(*) FILTER (WHERE status_explanation IS NOT NULL),
                count(*) FILTER (WHERE disposition_scope NOT IN ('none', 'unknown'))
              FROM pc GROUP BY ROLLUP (1, 2) ORDER BY 1, 2"
          echo "--- 2. source fields (tier | ctype | cases | nos | cause | filed | terminated | decided | caption_v | thin_caption) ---"
          q "$base SELECT tier, ctype, count(*),
                count(*) FILTER (WHERE nature_of_suit_code IS NOT NULL), count(*) FILTER (WHERE cause_of_action IS NOT NULL),
                count(*) FILTER (WHERE filed_on IS NOT NULL), count(*) FILTER (WHERE terminated_on IS NOT NULL), count(*) FILTER (WHERE decided_on IS NOT NULL),
                count(*) FILTER (WHERE caption ~* '\\m(v|vs)\\.?\\s'),
                count(*) FILTER (WHERE caption !~* '(\\m(v|vs)\\.?\\s|\\min re\\M|\\mmatter of\\M|\\mex parte\\M|\\munited states\\M|\\musa\\M|\\mpetition\\M|\\mestate of\\M)')
              FROM pc GROUP BY ROLLUP (1, 2) ORDER BY 1, 2"
          echo "--- 3. joined sources (tier | ctype | cases | displayable_entries | opinion_text | cited_by>0 | judge_assigned | parties) ---"
          q "$base SELECT tier, ctype, count(*),
                count(*) FILTER (WHERE EXISTS (SELECT 1 FROM docket_entry d WHERE d.case_id = pc.id
                   AND COALESCE((SELECT cr.displayable FROM publication_current cr WHERE cr.object_type = 'docket_entry' AND cr.object_id = d.id), false))),
                count(*) FILTER (WHERE EXISTS (SELECT 1 FROM document doc JOIN judicial_opinion jo ON jo.document_id = doc.id
                   JOIN document_content dc ON dc.document_id = doc.id WHERE doc.case_id = pc.id)),
                count(*) FILTER (WHERE EXISTS (SELECT 1 FROM case_citation_count cc WHERE cc.case_id = pc.id AND cc.cited_by > 0)),
                count(*) FILTER (WHERE EXISTS (SELECT 1 FROM judge_case_assignment j WHERE j.case_id = pc.id AND j.confidence >= 0.8)),
                count(*) FILTER (WHERE EXISTS (SELECT 1 FROM party_appearance p WHERE p.case_id = pc.id))
              FROM pc GROUP BY ROLLUP (1, 2) ORDER BY 1, 2"
          echo "--- 3b. any docket entries regardless of decision (ctype | cases_with_entries | entries) ---"
          q "$base SELECT ctype, count(DISTINCT d.case_id), count(*) FROM pc JOIN docket_entry d ON d.case_id = pc.id GROUP BY 1 ORDER BY 1"
          echo "--- 4. top nature_of_suit_code values (value | cases) ---"
          q "$base SELECT nature_of_suit_code, count(*) FROM pc WHERE nature_of_suit_code IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 60"
          echo "--- 4b. top cause_of_action values (value | cases) ---"
          q "$base SELECT left(cause_of_action, 80), count(*) FROM pc WHERE cause_of_action IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 30"
          echo "--- 4c. status fields (verification | disposition | judgment | cases) ---"
          q "$base SELECT verification, disposition_scope, judgment_state, count(*) FROM pc GROUP BY 1, 2, 3 ORDER BY 4 DESC LIMIT 25"
          echo "--- 4d. sample status_explanation values (ctype | text) ---"
          q "$base SELECT DISTINCT ON (ctype, left(status_explanation, 40)) ctype, left(status_explanation, 200) FROM pc WHERE status_explanation IS NOT NULL ORDER BY ctype, left(status_explanation, 40) LIMIT 30"
          echo "--- 5. thin captions by tier | ctype | docket kind (tier | ctype | kind | cases) ---"
          q "$base SELECT tier, ctype, coalesce(substring(lower(docket_number) from '-(cr|cv|mj|mc|po|bk|ap|md|sw|gj|pt)-'), 'other') kind, count(*)
               FROM pc WHERE caption !~* '(\\m(v|vs)\\.?\\s|\\min re\\M|\\mmatter of\\M|\\mex parte\\M|\\munited states\\M|\\musa\\M|\\mpetition\\M|\\mestate of\\M)'
              GROUP BY 1, 2, 3 ORDER BY 4 DESC LIMIT 40"
          echo "--- 5b. thin captions top courts (court | cases | cr) ---"
          q "$base SELECT court_code, count(*), count(*) FILTER (WHERE docket_number ~* '-cr-') FROM pc
              WHERE caption !~* '(\\m(v|vs)\\.?\\s|\\min re\\M|\\mmatter of\\M|\\mex parte\\M|\\munited states\\M|\\musa\\M|\\mpetition\\M|\\mestate of\\M)'
              GROUP BY 1 ORDER BY 2 DESC LIMIT 25"
          echo "--- 5c. thin caption samples (court | docket | caption | has_cl_id | entries) ---"
          q "$base SELECT court_code, docket_number, left(caption, 80),
                EXISTS (SELECT 1 FROM case_identifier ci WHERE ci.case_id = pc.id AND ci.identifier_type = 'courtlistener_docket_id'),
                (SELECT count(*) FROM docket_entry d WHERE d.case_id = pc.id)
               FROM pc WHERE caption !~* '(\\m(v|vs)\\.?\\s|\\min re\\M|\\mmatter of\\M|\\mex parte\\M|\\munited states\\M|\\musa\\M|\\mpetition\\M|\\mestate of\\M)'
              ORDER BY random() LIMIT 30"
          echo "--- 5d. caption shapes of -cr- dockets (shape | cases) ---"
          q "$base SELECT CASE WHEN caption ~* '^(united states|usa|u\\.s\\.a?\\.?)\\s+(of america\\s+)?v' THEN 'US v. X'
                         WHEN caption ~* '\\m(v|vs)\\.?\\s' THEN 'other v.' ELSE 'thin' END, count(*)
               FROM pc WHERE docket_number ~* '-cr-' GROUP BY 1 ORDER BY 2 DESC"
          echo "--- 5e. direct_court_event titles for thin cr cases (court | docket | caption | event title sample) ---"
          q "$base SELECT pc.court_code, pc.docket_number, left(pc.caption, 40), left(ev.caption, 80), ev.event_type
               FROM pc JOIN LATERAL (SELECT e.caption, e.event_type FROM direct_court_event e WHERE e.case_id = pc.id AND NOT e.restricted LIMIT 1) ev ON true
              WHERE pc.docket_number ~* '-cr-' AND pc.caption !~* '\\m(v|vs)\\.?\\s' LIMIT 15"
          echo "--- 6. example: caed 1:26-cv-08930 ---"
          q "SELECT c.public_id, c.caption, c.filed_on, c.terminated_on, c.nature_of_suit_code, c.cause_of_action, c.verification, c.disposition_scope, c.status_explanation, ct.name, ct.jurisdiction
               FROM legal_case c JOIN court ct ON ct.id = c.court_id WHERE ct.provider_court_id = 'caed' AND c.docket_number LIKE '%26-cv-08930%'"
          q "SELECT d.filed_on, d.entry_number, left(d.description, 300), d.entry_type, d.importance FROM docket_entry d JOIN legal_case c ON c.id = d.case_id
               JOIN court ct ON ct.id = c.court_id WHERE ct.provider_court_id = 'caed' AND c.docket_number LIKE '%26-cv-08930%' ORDER BY d.filed_on LIMIT 10"
          q "SELECT e.publication_state, e.restricted, left(e.caption, 120), e.event_type, left(e.exact_docket_text, 400) FROM direct_court_event e JOIN legal_case c ON c.id = e.case_id
               JOIN court ct ON ct.id = c.court_id WHERE ct.provider_court_id = 'caed' AND c.docket_number LIKE '%26-cv-08930%' AND NOT e.restricted LIMIT 5"
          echo "--- 7. court names with ' - Live System' style suffixes (name | published cases) ---"
          q "SELECT ct.name, count(c.id) FROM court ct JOIN legal_case c ON c.court_id = ct.id AND c.publication = 'published'
              WHERE ct.name ~* '(live|cm/?ecf|nextgen|system)' GROUP BY 1 ORDER BY 2 DESC LIMIT 30"
          echo "=== done ==="
          REMOTE
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/report.txt" 2>/dev/null | head -n 500; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
