name: Live-feed opinion text backfill on builder (throttled)

# Plan D11 (ADR 0090): fetch and extract the opinion PDFs the live feeds
# recorded over the last N days (court sites, circuit feeds, GovInfo
# districts), with tesseract OCR for scanned PDFs, on THIS builder runner in
# the worker image. PDFs go to the artifact store and text to Postgres as DRAFT
# documents (nothing publishes). Polite: one request per host every few seconds.
# The resident live-opinion-text lane keeps up with new items; this is for the
# backfill and the OCR queue. Safe to stop; rerun to continue.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts); fails closed
  # unless confirm=LIVE_OPINION_TEXT.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type LIVE_OPINION_TEXT to run against production"
        required: true
        type: string
      rescan_days:
        description: Re-scan the live feeds for the last N days (0 = only the queue)
        required: false
        default: '90'
        type: string
      states:
        description: "pending, ocr_required, or pending,ocr_required"
        required: false
        default: 'pending,ocr_required'
        type: string
      limit:
        description: Max documents this run
        required: false
        default: '3000'
        type: string
      minutes:
        description: Stop after this many minutes (max 330)
        required: false
        default: '300'
        type: string
      min_host_interval_ms:
        description: Minimum ms between requests to one host
        required: false
        default: '4000'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: jurvio-live-opinion-text
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 350
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_CPUS: '2'
      JOB_MEMORY: 3000m
      JOB_ENV_KEYS: NODE_ENV GOVINFO_API_KEY JURVIO_SPACES_ACCESS_KEY_ID JURVIO_SPACES_SECRET_ACCESS_KEY JURVIO_SPACES_BUCKET JURVIO_SPACES_ENDPOINT JURVIO_SPACES_REGION
      RESCAN_DAYS: ${{ inputs.rescan_days }}
      STATES: ${{ inputs.states }}
      LIMIT: ${{ inputs.limit }}
      MINUTES: ${{ inputs.minutes }}
      INTERVAL_MS: ${{ inputs.min_host_interval_ms }}
    steps:
      - name: Require confirm=LIVE_OPINION_TEXT
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "LIVE_OPINION_TEXT" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=LIVE_OPINION_TEXT."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$RESCAN_DAYS" =~ ^[0-9]+$ ]] && [ "$RESCAN_DAYS" -le 400 ] || { echo "::error::rescan_days 0-400"; exit 1; }
          [[ "$STATES" =~ ^(pending|ocr_required)(,(pending|ocr_required))?$ ]] || { echo "::error::bad states"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && [ "$LIMIT" -le 100000 ] || { echo "::error::limit 0-100000"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 330 ] || { echo "::error::minutes 1-330"; exit 1; }
          [[ "$INTERVAL_MS" =~ ^[0-9]+$ ]] && [ "$INTERVAL_MS" -ge 1000 ] && [ "$INTERVAL_MS" -le 120000 ] || { echo "::error::min_host_interval_ms 1000-120000"; exit 1; }
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Fetch and extract opinion text
        run: |
          set -euo pipefail
          out="$(mktemp)"
          discover=1; [ "$RESCAN_DAYS" -eq 0 ] && discover=0
          bash scripts/ops/builder-job.sh jobs/run-live-opinion-text.mjs \
            --discover="$discover" --rescan-days="$RESCAN_DAYS" --discover-limit=200000 --states="$STATES" --ocr=1 \
            --limit="$LIMIT" --budget-seconds="$((MINUTES * 60))" --min-host-interval-ms="$INTERVAL_MS" 2>&1 | tee "$out"
          grep -E '^\{"liveOpinionText"' "$out" | tail -n1 | while IFS= read -r line; do
            echo "::notice title=Live opinion text::${line}"
          done || true
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config
