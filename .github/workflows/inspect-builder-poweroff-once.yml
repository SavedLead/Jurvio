name: Inspect builder poweroff once

# Self-hosted (builder) read-only investigation into why jurvio-builder-01
# powers itself off between jobs. Runs ON the builder and dumps every likely
# auto-shutdown mechanism: systemd timers/units, the runner service unit and
# its hooks, cron, DO-style shutdown scripts, and runner .env. Read-only: it
# only reads config and prints it. Touches only the builder.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-inspect-builder-poweroff
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 10
    steps:
      - name: Dump auto-shutdown suspects
        run: |
          set +e
          SUDO=""; if [ "$(id -u)" != "0" ]; then sudo -n true 2>/dev/null && SUDO="sudo -n"; fi
          echo "whoami=$(whoami) uid=$(id -u) sudo='${SUDO}'"
          echo "uptime: $(uptime)"
          echo
          echo "===== systemd timers (all) ====="
          $SUDO systemctl list-timers --all 2>/dev/null
          echo
          echo "===== units matching shutdown/poweroff/halt/idle/sleep/suspend/stop ====="
          $SUDO systemctl list-unit-files 2>/dev/null | grep -iE 'shutdown|poweroff|halt|idle|sleep|suspend|autostop|auto-stop'
          $SUDO systemctl list-units --all 2>/dev/null | grep -iE 'shutdown|poweroff|halt|idle|sleep|suspend|autostop|auto-stop'
          echo
          echo "===== the GitHub Actions runner service unit ====="
          unit="$($SUDO systemctl list-units --type=service --all 2>/dev/null | awk '/actions\.runner/{print $1; exit}')"
          echo "runner unit: ${unit:-<none>}"
          if [ -n "$unit" ]; then
            $SUDO systemctl cat "$unit" 2>/dev/null
            echo "--- ExecStopPost / hooks in the unit above ---"
            $SUDO systemctl show "$unit" -p ExecStopPost -p ExecStartPre -p ExecStartPost 2>/dev/null
          fi
          echo
          echo "===== runner directory + .env (hook vars) ====="
          for d in /opt/actions-runner /home/*/actions-runner /root/actions-runner /actions-runner; do
            [ -d "$d" ] || continue
            echo "runner dir: $d"; ls -la "$d" 2>/dev/null | head -40
            echo "--- $d/.env ---"; $SUDO cat "$d/.env" 2>/dev/null
            echo "--- $d/.path ---"; $SUDO cat "$d/.path" 2>/dev/null
            echo "--- hook scripts referenced (ACTIONS_RUNNER_HOOK_*) ---"
            $SUDO grep -rIn 'ACTIONS_RUNNER_HOOK' "$d" 2>/dev/null | head
            echo "--- poweroff/shutdown/halt references under $d ---"
            $SUDO grep -rIlnE 'poweroff|shutdown|halt|systemctl (stop|poweroff)|init 0' "$d" 2>/dev/null | head
          done
          echo
          echo "===== cron (root, all users, /etc/cron*, at) ====="
          $SUDO crontab -l 2>/dev/null; crontab -l 2>/dev/null
          $SUDO ls -la /etc/cron.d /etc/cron.hourly /etc/cron.daily 2>/dev/null
          $SUDO grep -rInE 'poweroff|shutdown|halt' /etc/cron* /var/spool/cron 2>/dev/null | head
          $SUDO atq 2>/dev/null
          echo
          echo "===== rc.local / shutdown scripts / DO agent ====="
          $SUDO grep -rIlnE 'poweroff|shutdown -h|halt|init 0' /etc/rc.local /etc/systemd/system /usr/local/bin /usr/local/sbin /root /home 2>/dev/null | head -20
          echo "--- any 'idle'/'autostop' scripts ---"
          $SUDO grep -rIlnE 'idle|autostop|auto-stop|auto_shutdown|autoshutdown' /usr/local/bin /usr/local/sbin /etc 2>/dev/null | head
          echo
          echo "===== who/what last shut it down (journal) ====="
          $SUDO journalctl -n 40 --no-pager -u systemd-shutdownd 2>/dev/null
          $SUDO journalctl --no-pager 2>/dev/null | grep -iE 'poweroff|shutdown|halt|Powering off|reached target' | tail -30
          echo
          echo "===== last reboots/shutdowns ====="
          $SUDO last -x -n 20 2>/dev/null | grep -iE 'shutdown|reboot' | head
          echo "done"
