name: Complete admin access + remove temp sudoers (jurvio-admin)

# Uses jurvio-runner's temporary sudo (/etc/sudoers.d/j) to: diagnose+fix the
# jurvio-admin SSH login, verify the permanent jurvio-admin route in a separate
# step, finish server config + DO web-console repair, then remove
# /etc/sudoers.d/j (revoking the runner's unrestricted sudo) and prove every
# end state. Delete after use.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-complete-admin
  cancel-in-progress: false

jobs:
  complete:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      A: jurvio-admin@127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 10
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Diagnose + fix jurvio-admin login (runner sudo via /etc/sudoers.d/j)
        run: sudo -n bash scripts/ops/fix-admin-login.sh
      - name: VERIFY permanent jurvio-admin route (separate step, before removal)
        run: |
          set -euo pipefail
          echo "=== proving jurvio-admin@127.0.0.1 works with scoped sudo ==="
          ssh "$A" 'echo "logged in as $(id -un) uid=$(id -u)"; echo "-- passwordless-sudo proof (allowlisted) --"; sudo -n systemctl --version | head -1; echo "-- scoped allowlist --"; sudo -n -l'
      - name: Finish configuration + DO web console repair (runner sudo)
        run: |
          set -euo pipefail
          echo "=== unattended-upgrade auto-reboot false ==="
          printf '%s\n' 'Unattended-Upgrade::Automatic-Reboot "false";' 'Unattended-Upgrade::Automatic-Reboot-WithUsers "false";' | sudo -n tee /etc/apt/apt.conf.d/99jurvio-no-reboot >/dev/null
          apt-config dump | grep -i 'Unattended-Upgrade::Automatic-Reboot' || echo '(none)'
          echo "=== DigitalOcean web console (droplet-agent) ==="
          if systemctl list-unit-files | grep -q '^droplet-agent.service'; then
            sudo -n systemctl enable --now droplet-agent.service
            echo "droplet-agent is-enabled=$(systemctl is-enabled droplet-agent.service) is-active=$(systemctl is-active droplet-agent.service)"
          else
            echo "droplet-agent.service not installed:"; systemctl list-unit-files | grep -Ei 'droplet|dotty|agent|console' || echo '(no matching units)'
          fi
          echo "=== SSH health ==="
          sudo -n sshd -t && echo "SSHD-CONFIG-OK"; echo "ssh active=$(systemctl is-active ssh 2>/dev/null || systemctl is-active sshd 2>/dev/null || echo n/a)"
          echo "=== runner ==="
          U="$(systemctl list-units 'actions.runner.*.service' --no-legend --all | awk '{print $1}' | head -1)"; echo "unit=$U"
          systemctl show "$U" -p Restart -p UnitFileState -p ActiveState
      - name: Stage proof script to jurvio-admin
        run: scp scripts/ops/admin-proof.sh "$A":/home/jurvio-admin/admin-proof.sh
      - name: Remove /etc/sudoers.d/j (runner's final privileged action)
        run: |
          set -euo pipefail
          if [ -e /etc/sudoers.d/j ]; then echo "before: /etc/sudoers.d/j present"; else echo "before: already absent"; fi
          sudo -n rm -f /etc/sudoers.d/j
          echo "removed /etc/sudoers.d/j (jurvio-runner sudo now revoked)"
      - name: PROVE end states
        run: |
          set +e
          echo "=== (1) jurvio-runner no longer has unrestricted sudo ==="
          if sudo -n true 2>/dev/null; then echo "UNEXPECTED: runner still has passwordless sudo"; else echo "OK: jurvio-runner passwordless sudo REVOKED (sudo -n failed as expected)"; fi
          echo "=== root-level proofs via jurvio-admin scoped sudo (transient oneshot) ==="
          ssh "$A" 'printf "%s\n" "[Unit]" "Description=Jurvio final proof" "[Service]" "Type=oneshot" "ExecStart=/bin/sh /home/jurvio-admin/admin-proof.sh" | sudo -n tee /etc/systemd/system/jurvio-oneshot-proof.service >/dev/null && sudo -n systemctl daemon-reload && sudo -n systemctl start jurvio-oneshot-proof.service && sudo -n systemctl daemon-reload'
          ssh "$A" 'cat /home/jurvio-admin/jurvio-final-proof.txt; rm -f /home/jurvio-admin/admin-proof.sh /home/jurvio-admin/jurvio-final-proof.txt'
          echo "=== (non-root) auto-reboot / runner / droplet-agent / ssh ==="
          echo "-- auto-reboot --"; apt-config dump | grep -i 'Unattended-Upgrade::Automatic-Reboot' || echo '(none)'
          U="$(systemctl list-units 'actions.runner.*.service' --no-legend --all | awk '{print $1}' | head -1)"
          echo "-- runner ($U) --"; systemctl show "$U" -p Restart -p UnitFileState -p ActiveState; echo "is-active=$(systemctl is-active "$U") is-enabled=$(systemctl is-enabled "$U")"
          echo "-- droplet-agent + ssh --"; echo "droplet-agent=$(systemctl is-active droplet-agent.service 2>/dev/null || echo n/a) ssh=$(systemctl is-active ssh 2>/dev/null || systemctl is-active sshd 2>/dev/null || echo n/a)"
          echo "=== DONE ==="
