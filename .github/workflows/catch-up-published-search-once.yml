name: Catch up published search (once)

# Fills the case text index for published cases the bulk publish transaction
# left out, and corrects filing days stored as the UTC calendar day.
# Runs on the ingestion host through the builder. It does not run on web-01,
# does not cancel the bulk publish job, and does not submit a sitemap to Google.
#
# confirm=CATCH_UP_PUBLISHED_SEARCH

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CATCH_UP_PUBLISHED_SEARCH"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catch-up-published-search
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 120
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Require confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "CATCH_UP_PUBLISHED_SEARCH" ]; then
            echo "::error::Refusing to run. confirm must be CATCH_UP_PUBLISHED_SEARCH."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
      - name: Run on the ingestion host
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "bash -s" < scripts/catch-up-published-search.sh
