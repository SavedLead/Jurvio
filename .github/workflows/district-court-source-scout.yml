name: Scout district court sources

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=DISTRICT_COURT_SOURCE_SCOUT.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DISTRICT_COURT_SOURCE_SCOUT to run this workflow against production"
        required: true
        type: string
      limit:
        description: Number of courts to scout (use 94 for full run)
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: district-court-source-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 45
    steps:
      - name: Require confirm=DISTRICT_COURT_SOURCE_SCOUT
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DISTRICT_COURT_SOURCE_SCOUT" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=DISTRICT_COURT_SOURCE_SCOUT."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/scout-district-court-sources.ts --limit="${{ inputs.limit || '94' }}" > district-court-scout.json
      - uses: actions/upload-artifact@v4
        with:
          name: district-court-scout
          path: district-court-scout.json
          retention-days: 30
