name: Repair builder runner once

# Stays on ubuntu-latest. It opens SSH to jurvio-builder-01 and restarts the
# runner service. That only works from a machine that is not the dead runner.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=REPAIR_BUILDER_RUNNER.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REPAIR_BUILDER_RUNNER to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-repair-builder-runner-once
  cancel-in-progress: false

jobs:
  repair:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Require confirm=REPAIR_BUILDER_RUNNER
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REPAIR_BUILDER_RUNNER" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=REPAIR_BUILDER_RUNNER."
            exit 1
          fi
      - name: Temporarily allow SSH and restart runner service
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          droplet_id="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .id' <<<"$droplets" | head -1)"
          public_ip="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .networks.v4[] | select(.type=="public") | .ip_address' <<<"$droplets" | head -1)"
          test -n "$droplet_id" && test -n "$public_ip"
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          firewall="$(jq -c --argjson id "$droplet_id" '.firewalls[] | select((.droplet_ids // []) | index($id))' <<<"$firewalls" | head -1)"
          firewall_id="$(jq -r '.id' <<<"$firewall")"
          test -n "$firewall_id" && test "$firewall_id" != null
          original="$(jq '{name,inbound_rules,outbound_rules,droplet_ids,tags}' <<<"$firewall")"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          temporary="$(jq --arg source "$runner_ip/32" '.inbound_rules += [{"protocol":"tcp","ports":"22","sources":{"addresses":[$source]}}]' <<<"$original")"
          restore() {
            curl -fsS -X PUT "${auth[@]}" "$api/firewalls/$firewall_id" -d "$original" >/dev/null || true
          }
          trap restore EXIT
          curl -fsS -X PUT "${auth[@]}" "$api/firewalls/$firewall_id" -d "$temporary" >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for _ in $(seq 1 12); do
            ssh-keyscan -T 5 -H "$public_ip" > ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          # Find an SSH user whose key is accepted (root failed before with
          # "Permission denied (publickey)"; the deploy operator user may work).
          ssh_user=""
          for u in root "$DO_USER"; do
            [ -n "$u" ] || continue
            if ssh -o BatchMode=yes -o ConnectTimeout=15 "$u"@"$public_ip" true 2>/dev/null; then
              ssh_user="$u"; break
            fi
            echo "SSH as $u was refused."
          done
          test -n "$ssh_user" || { echo "::error::neither root nor the deploy user accepted the SSH key on the builder"; exit 1; }
          echo "SSH accepted as $ssh_user; (re)starting the runner service."
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$ssh_user"@"$public_ip" 'bash -s' <<'REMOTE'
          set -uo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"
          who="$(whoami)"
          svc="$($SUDO systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '/actions\.runner|github.*runner/ {print $1; exit}')"
          echo "runner user=$who detected service=${svc:-none}"
          if [ -n "$svc" ]; then
            $SUDO systemctl enable "$svc" 2>&1 || true
            $SUDO systemctl restart "$svc" 2>&1 || true
            echo "is-active: $($SUDO systemctl is-active "$svc" 2>&1)"
          else
            for d in /opt/actions-runner /home/*/actions-runner /root/actions-runner; do
              if [ -x "$d/svc.sh" ]; then
                echo "runner dir: $d"
                cd "$d"
                $SUDO ./svc.sh install "$who" 2>&1 || true
                $SUDO ./svc.sh start 2>&1 || true
                $SUDO ./svc.sh status 2>&1 || true
                break
              fi
            done
          fi
          REMOTE
          echo "Runner repair attempted; firewall restored by trap."
      - name: Record runner repair receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_STATUS: ${{ job.status }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Builder runner repair [$REPAIR_STATUS]" --body "Status: **$REPAIR_STATUS**\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nRecorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
