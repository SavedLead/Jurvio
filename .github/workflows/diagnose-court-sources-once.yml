name: Diagnose court sources matrix (once, read-only)

# Read-only court x source health report (free-feeds plan): the court_source
# matrix joined with court_fetch_log (last success, last HTTP status, items and
# new items in 24 h, failure streaks, zero-vs-baseline flags), per-URL detail for
# the last 24 h, the appellate registry validators, new items per court per
# source in the last 24 h, the district RSS rotation/backoff state, and a
# cross-source duplicate count (exact and +-1 day opinion/order twins, 7 days). Changes nothing: every query runs with
# default_transaction_read_only=on and the helper refuses anything but SELECT/WITH.
#
# Dispatch by hand with confirm=DIAGNOSE.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DIAGNOSE to run this read-only report"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-court-sources
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 30
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Require confirm=DIAGNOSE
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DIAGNOSE" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=DIAGNOSE."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
      - name: Court feed report over private VPC (read-only SQL)
        run: |
          set -uo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "bash -s" <<'REMOTE' | tee "$RUNNER_TEMP/report.txt"
          set -uo pipefail
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          pg="$(find_svc postgres)"
          [ -n "$pg" ] || { echo "::error::postgres missing"; exit 1; }
          q() {
            case "$(printf '%s' "$1" | tr -s '[:space:]' ' ' | sed 's/^ //' | cut -c1-6 | tr '[:lower:]' '[:upper:]')" in
              SELECT|WITH*) ;;
              *) echo "(refused: not a SELECT)"; return 0 ;;
            esac
            sudo -n docker exec \
              -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=300s -c lock_timeout=5s' \
              "$pg" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 -q -At -F ' | ' -c "$1" || echo "(query failed)"
          }
          echo "=== COURT SOURCES @ $(date -u +%FT%TZ) (read-only) session_read_only=$(q "SELECT current_setting('default_transaction_read_only')") ==="
          echo "--- 1. matrix (court | source | available | enabled | last_success | last_status | fetches_24h | failures_24h | items_last | items_24h | new_24h | zero_flag | note) ---"
          q "WITH r AS (SELECT court_code, source, count(*) f, count(*) FILTER (WHERE NOT ok) e, coalesce(sum(items) FILTER (WHERE ok),0) i, coalesce(sum(new_items) FILTER (WHERE ok),0) n
                       FROM court_fetch_log WHERE fetched_at > now() - interval '24 hours' GROUP BY 1,2),
                  l AS (SELECT DISTINCT ON (court_code, source) court_code, source, http_status, items, zero_vs_baseline, error FROM court_fetch_log
                       WHERE fetched_at > now() - interval '35 days' ORDER BY court_code, source, fetched_at DESC),
                  s AS (SELECT court_code, source, max(fetched_at) t FROM court_fetch_log WHERE ok GROUP BY 1,2)
             SELECT cs.court_code, cs.source, cs.available, cs.enabled, to_char(coalesce(s.t, wm.last_success_at) AT TIME ZONE 'America/New_York','MM-DD HH24:MI'),
                    l.http_status, coalesce(r.f,0), coalesce(r.e,0), l.items, coalesce(r.i,0), coalesce(r.n,0), coalesce(l.zero_vs_baseline,false), coalesce(left(l.error,80), cs.note)
               FROM court_source cs LEFT JOIN r USING (court_code, source) LEFT JOIN l USING (court_code, source) LEFT JOIN s USING (court_code, source)
               LEFT JOIN court_source_watermark wm ON wm.court_code = cs.court_code AND wm.source = cs.source
              WHERE cs.source <> 'pacer_free_opinions' ORDER BY 1,2"
          echo "--- 2. per URL, last 24h (court | source | fetches | ok | last_status | items_last | max_items | new | url) ---"
          q "SELECT court_code, source, count(*), count(*) FILTER (WHERE ok), (array_agg(http_status ORDER BY fetched_at DESC))[1],
                    (array_agg(items ORDER BY fetched_at DESC))[1], max(items), sum(new_items), left(url,140)
               FROM court_fetch_log WHERE fetched_at > now() - interval '24 hours' GROUP BY 1,2,url ORDER BY 1,2,url"
          echo "--- 3. zero-vs-baseline and failing (last 24h) ---"
          q "SELECT court_code, source, to_char(fetched_at AT TIME ZONE 'America/New_York','MM-DD HH24:MI'), http_status, items, baseline_items, left(coalesce(error,''),120), left(url,120)
               FROM court_fetch_log WHERE fetched_at > now() - interval '24 hours' AND (zero_vs_baseline OR NOT ok) ORDER BY fetched_at DESC LIMIT 200"
          echo "--- 4. appellate_source_registry (code | health | failures | last_success | etag | last_modified | items_7d | opinionsUrl) ---"
          q "WITH i AS (SELECT court_code, count(*) FILTER (WHERE first_seen_at > now() - interval '7 days') d7, count(*) FILTER (WHERE first_seen_at > now() - interval '24 hours') d1 FROM appellate_ingestion_item GROUP BY 1)
             SELECT s.court_code, s.health_state, s.consecutive_failures, s.last_successful_retrieval, s.listing_etag, s.listing_last_modified, coalesce(i.d1,0), coalesce(i.d7,0)
               FROM appellate_source_registry s LEFT JOIN i USING (court_code) ORDER BY 1"
          echo "--- 5. new items per court in the last 24h by path (court | district_events | district_new_cases | appellate_items | coa_feed_entries | govinfo_entries | court_site_entries) ---"
          q "WITH d AS (SELECT court_code, count(*) n FROM direct_court_event WHERE first_seen_at > now() - interval '24 hours' GROUP BY 1),
                  a AS (SELECT court_code, count(*) n FROM appellate_ingestion_item WHERE first_seen_at > now() - interval '24 hours' GROUP BY 1),
                  e AS (SELECT lower(c.provider_court_id) court_code,
                          count(*) FILTER (WHERE de.provider_entry_id LIKE 'coa-feed:%') coa,
                          count(*) FILTER (WHERE de.provider_entry_id LIKE 'govinfo:%') gov,
                          count(*) FILTER (WHERE de.provider_entry_id LIKE 'court-site:%') site
                        FROM docket_entry de JOIN legal_case lc ON lc.id = de.case_id JOIN court c ON c.id = lc.court_id
                       WHERE de.created_at > now() - interval '24 hours'
                         AND (de.provider_entry_id LIKE 'coa-feed:%' OR de.provider_entry_id LIKE 'govinfo:%' OR de.provider_entry_id LIKE 'court-site:%')
                       GROUP BY 1),
                  nc AS (SELECT lower(c.provider_court_id) court_code, count(*) n FROM legal_case lc JOIN court c ON c.id = lc.court_id
                       WHERE lc.created_at > now() - interval '24 hours' GROUP BY 1)
             SELECT cs.court_code, coalesce(d.n,0), coalesce(nc.n,0), coalesce(a.n,0), coalesce(e.coa,0), coalesce(e.gov,0), coalesce(e.site,0)
               FROM (SELECT DISTINCT court_code FROM court_source) cs LEFT JOIN d USING (court_code) LEFT JOIN a USING (court_code)
               LEFT JOIN e USING (court_code) LEFT JOIN nc USING (court_code) ORDER BY 1"
          echo "--- 6. GovInfo cross-check, last 7 days (court | packages | matched_other_source | new_entry | new_case | restricted | ambiguous) ---"
          q "SELECT court_code, count(*), count(*) FILTER (WHERE outcome='matched'), count(*) FILTER (WHERE outcome='entry'), count(*) FILTER (WHERE outcome='new_case'), count(*) FILTER (WHERE outcome='restricted'), count(*) FILTER (WHERE outcome='ambiguous') FROM govinfo_crosscheck WHERE seen_at > now() - interval '7 days' GROUP BY 1 ORDER BY 2 DESC"
          echo "--- 7. GovInfo sweep state (since | offset_mark set | sweeps_completed | updated_at) ---"
          q "SELECT since, offset_mark IS NOT NULL, sweeps_completed, updated_at FROM govinfo_daily_state"
          echo "--- 8. court-site and appellate RSS items, last 7 days (source | court | items | matched | entry | new_case | restricted | ambiguous | unmatched) ---"
          q "SELECT source, court_code, count(*), count(*) FILTER (WHERE outcome='matched'), count(*) FILTER (WHERE outcome='entry'), count(*) FILTER (WHERE outcome='new_case'), count(*) FILTER (WHERE outcome='restricted'), count(*) FILTER (WHERE outcome='ambiguous'), count(*) FILTER (WHERE outcome='unmatched') FROM free_source_item WHERE seen_at > now() - interval '7 days' GROUP BY 1, 2 ORDER BY 1, 3 DESC"
          echo "--- 9. district RSS rotation state, courts failing or not visited in 3h (court | health | failures | last_success EST | last_attempt EST | next_retry EST) ---"
          q "SELECT court_code, health_state, consecutive_failures, to_char(last_successful_retrieval AT TIME ZONE 'America/New_York','MM-DD HH24:MI'),
                    to_char(updated_at AT TIME ZONE 'America/New_York','MM-DD HH24:MI'),
                    to_char((CASE WHEN consecutive_failures = 0 THEN last_successful_retrieval + interval '2 hours'
                                  ELSE updated_at + least(interval '2 hours', interval '5 minutes' * power(2, least(consecutive_failures, 7))) END) AT TIME ZONE 'America/New_York','MM-DD HH24:MI')
               FROM direct_court_registry WHERE rss_available AND rss_url IS NOT NULL
                AND (consecutive_failures > 0 OR last_successful_retrieval IS NULL OR last_successful_retrieval < now() - interval '3 hours') ORDER BY 1"
          echo "--- 10. cross-source duplicate check, docket entries created in the last 7 days (metric | value) ---"
          # exact: same case + filed_on + entry number (entry type when no number) from a different source.
          # twin_strict: opinion/order entries on the same case filed within 1 day from a different source.
          # twin_loose: the hasEquivalentEntry rule (entry type or opinion/order/memorandum/judgment in the text).
          # Rows are counted on the recent free-source side (a); b is any entry on the case (any provider).
          q "WITH cm AS (SELECT id FROM provider WHERE code = 'official_cmecf'),
                  e AS (SELECT * FROM (SELECT de.id, de.case_id, de.filed_on, coalesce(nullif(trim(de.entry_number), ''), coalesce(de.entry_type, 'other')) AS k,
                                     coalesce(de.entry_type, 'other') AS t, coalesce(de.description, '') AS d,
                                     CASE WHEN de.provider_entry_id LIKE 'govinfo:%' THEN 'govinfo' WHEN de.provider_entry_id LIKE 'court-site:%' THEN 'court_site'
                                     WHEN de.provider_entry_id LIKE 'appellate-rss:%' THEN 'appellate_pacer_rss' WHEN de.provider_entry_id LIKE 'coa-feed:%' THEN 'coa_feed'
                                     WHEN de.provider_entry_id LIKE 'cl-feed:%' THEN 'courtlistener_feed' WHEN de.provider_id = (SELECT id FROM cm) THEN 'district_rss'
                                     ELSE 'other:' || coalesce((SELECT code FROM provider p WHERE p.id = de.provider_id), '?') END AS src
                                FROM docket_entry de WHERE de.created_at > now() - interval '7 days' AND de.filed_on IS NOT NULL) s
                         WHERE src NOT LIKE 'other:%'),
                  x AS (SELECT a.id, a.case_id, a.filed_on, a.k, a.src AS a_src, b.src AS b_src,
                               (b.filed_on = a.filed_on AND b.k = a.k) AS exact,
                               (a.t IN ('opinion','order') AND b.t IN ('opinion','order')) AS strict_twin,
                               ((a.t IN ('opinion','order') OR a.d ~* '(opinion|memorandum|judgment|\morder\M)')
                                 AND (b.t IN ('opinion','order') OR b.d ~* '(opinion|memorandum|judgment|\morder\M)')) AS loose_twin
                          FROM e a
                          JOIN LATERAL (SELECT de.id, de.filed_on, coalesce(nullif(trim(de.entry_number), ''), coalesce(de.entry_type, 'other')) AS k,
                                               coalesce(de.entry_type, 'other') AS t, coalesce(de.description, '') AS d,
                                               CASE WHEN de.provider_entry_id LIKE 'govinfo:%' THEN 'govinfo' WHEN de.provider_entry_id LIKE 'court-site:%' THEN 'court_site'
                                     WHEN de.provider_entry_id LIKE 'appellate-rss:%' THEN 'appellate_pacer_rss' WHEN de.provider_entry_id LIKE 'coa-feed:%' THEN 'coa_feed'
                                     WHEN de.provider_entry_id LIKE 'cl-feed:%' THEN 'courtlistener_feed' WHEN de.provider_id = (SELECT id FROM cm) THEN 'district_rss'
                                     ELSE 'other:' || coalesce((SELECT code FROM provider p WHERE p.id = de.provider_id), '?') END AS src
                                          FROM docket_entry de WHERE de.case_id = a.case_id AND de.id <> a.id
                                           AND de.filed_on BETWEEN a.filed_on - 1 AND a.filed_on + 1) b ON b.src <> a.src)
             SELECT 'free_source_rows_7d', count(*)::text FROM e
             UNION ALL SELECT 'exact_groups (case+date+entry, >1 source)', count(DISTINCT (case_id, filed_on, k))::text FROM x WHERE exact
             UNION ALL SELECT 'exact_rows', count(DISTINCT id)::text FROM x WHERE exact
             UNION ALL SELECT 'exact_rows_free_vs_free', count(DISTINCT id)::text FROM x WHERE exact AND b_src NOT LIKE 'other:%'
             UNION ALL SELECT 'twin_strict_rows (opinion/order +-1 day)', count(DISTINCT id)::text FROM x WHERE strict_twin
             UNION ALL SELECT 'twin_strict_rows_free_vs_free', count(DISTINCT id)::text FROM x WHERE strict_twin AND b_src NOT LIKE 'other:%'
             UNION ALL SELECT 'twin_loose_rows (hasEquivalentEntry rule)', count(DISTINCT id)::text FROM x WHERE loose_twin
             UNION ALL SELECT 'twin_loose_rows_free_vs_free', count(DISTINCT id)::text FROM x WHERE loose_twin AND b_src NOT LIKE 'other:%'
             UNION ALL (SELECT 'by_pair ' || a_src || ' x ' || b_src || ' exact/strict/loose',
                               count(DISTINCT id) FILTER (WHERE exact) || '/' || count(DISTINCT id) FILTER (WHERE strict_twin) || '/' || count(DISTINCT id) FILTER (WHERE loose_twin)
                          FROM x WHERE exact OR strict_twin OR loose_twin GROUP BY a_src, b_src ORDER BY 1)"
          echo "--- 11. duplicate examples, free vs free, up to 15 (court | case | a_src a_date a_entry | b_src b_date b_entry) ---"
          q "WITH cm AS (SELECT id FROM provider WHERE code = 'official_cmecf'),
                  e AS (SELECT * FROM (SELECT de.id, de.case_id, de.filed_on, coalesce(nullif(trim(de.entry_number), ''), coalesce(de.entry_type, 'other')) AS k,
                                     coalesce(de.entry_type, 'other') AS t, CASE WHEN de.provider_entry_id LIKE 'govinfo:%' THEN 'govinfo' WHEN de.provider_entry_id LIKE 'court-site:%' THEN 'court_site'
                                     WHEN de.provider_entry_id LIKE 'appellate-rss:%' THEN 'appellate_pacer_rss' WHEN de.provider_entry_id LIKE 'coa-feed:%' THEN 'coa_feed'
                                     WHEN de.provider_entry_id LIKE 'cl-feed:%' THEN 'courtlistener_feed' WHEN de.provider_id = (SELECT id FROM cm) THEN 'district_rss'
                                     ELSE 'other:' || coalesce((SELECT code FROM provider p WHERE p.id = de.provider_id), '?') END AS src
                                FROM docket_entry de WHERE de.created_at > now() - interval '7 days' AND de.filed_on IS NOT NULL) s
                         WHERE src NOT LIKE 'other:%')
             SELECT lower(c.provider_court_id), lc.public_id, a.src || ' ' || a.filed_on || ' ' || a.k || '/' || a.t, b.src || ' ' || b.filed_on || ' ' || b.k || '/' || b.t
               FROM e a JOIN e b ON b.case_id = a.case_id AND b.id > a.id AND b.src <> a.src AND b.filed_on BETWEEN a.filed_on - 1 AND a.filed_on + 1
                AND ((b.filed_on = a.filed_on AND b.k = a.k) OR (a.t IN ('opinion','order') AND b.t IN ('opinion','order')))
               JOIN legal_case lc ON lc.id = a.case_id JOIN court c ON c.id = lc.court_id
              ORDER BY a.filed_on DESC LIMIT 15"
          echo "=== done ==="
          REMOTE
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/report.txt" 2>/dev/null | head -n 1200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
