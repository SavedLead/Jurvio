name: Explain homepage once

# Self-hosted (builder) read-only diagnostic. Lists indexes on the relevant
# tables, shows the fresh EXPLAIN plan of the current homepage query, and
# EXPLAIN ANALYZEs a proposed two-phase rewrite that bounds the expensive
# per-row computation to a small candidate set. SELECT/EXPLAIN only; no writes,
# no DDL, no ingestion, no DNS change. Bounded by an 8s statement timeout.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-explain-homepage
  cancel-in-progress: false

jobs:
  explain:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 12
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Indexes, plan, and timed rewrite
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -e
          cid="$(sudo -n docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')"
          if [ -z "$cid" ]; then echo "No postgres container found"; exit 1; fi
          echo "postgres container: $cid"
          sudo -n docker exec -i "$cid" psql -U jurvio -d jurvio -v ON_ERROR_STOP=0 <<'SQL'
          \timing on
          \echo '=== indexes on relevant tables ==='
          SELECT tablename, indexname, indexdef
          FROM pg_indexes
          WHERE tablename IN ('document','docket_entry','legal_case','publication_decision')
          ORDER BY tablename, indexname;
          SET statement_timeout='8s';
          \echo '=== EXPLAIN current homepage query (plan only, fresh stats) ==='
          EXPLAIN
          SELECT legal_case.public_id, court.name,
            GREATEST(legal_case.updated_at, COALESCE(legal_case.source_updated_at, legal_case.updated_at),
              COALESCE((SELECT max(docket_entry.updated_at) FROM docket_entry WHERE docket_entry.case_id = legal_case.id), legal_case.updated_at),
              COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)), legal_case.updated_at)
            )::text
          FROM legal_case JOIN court ON court.id = legal_case.court_id
          WHERE legal_case.publication = 'published'
            AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'legal_case' AND decision.object_id = legal_case.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)
          ORDER BY 3 DESC, legal_case.id
          LIMIT 6;
          \echo '=== EXPLAIN ANALYZE proposed two-phase rewrite (candidate set = 300 most recent by updated_at) ==='
          EXPLAIN (ANALYZE, BUFFERS)
          WITH candidates AS (
            SELECT lc.id, lc.public_id, lc.caption, lc.docket_number, lc.court_id, lc.updated_at, lc.source_updated_at
            FROM legal_case lc
            WHERE lc.publication = 'published'
              AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'legal_case' AND decision.object_id = lc.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)
            ORDER BY lc.updated_at DESC
            LIMIT 300
          )
          SELECT c.public_id, court.name,
            GREATEST(c.updated_at, COALESCE(c.source_updated_at, c.updated_at),
              COALESCE((SELECT max(docket_entry.updated_at) FROM docket_entry WHERE docket_entry.case_id = c.id), c.updated_at),
              COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = c.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)), c.updated_at)
            )::text AS activity
          FROM candidates c JOIN court ON court.id = c.court_id
          ORDER BY activity DESC, c.id
          LIMIT 6;
          SQL
          REMOTE
