name: Run case news (once)

# Runs the "In the news" job once, now, inside the live worker-supervisor
# container, with the same arguments as the scheduler's case-news job
# (GDELT + Courthouse News RSS; GDELT still honours its rate-limit cooldown).
# The job's advisory lock makes this a no-op if a scheduled run is active.
# Writes only case_news_link / case_news_query_state / case_news_run rows.
#
# Dispatch-only; fails closed unless confirm=RUN_CASE_NEWS.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_CASE_NEWS to run the case-news job once in production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-run-case-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 30
    env:
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Require confirm=RUN_CASE_NEWS
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RUN_CASE_NEWS" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=RUN_CASE_NEWS."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}
      - name: Run case-news job in worker-supervisor
        run: |
          set -uo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "bash -s" <<'REMOTE' | tee "$RUNNER_TEMP/run.txt"
          set -uo pipefail
          sup="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=worker-supervisor' --format '{{.ID}}' | head -n1)"
          [ -n "$sup" ] || { echo "::error::worker-supervisor container not running"; exit 1; }
          echo "=== case-news once @ $(date -u +%FT%TZ) ==="
          sudo -n docker exec "$sup" node jobs/run-case-news.mjs --gdelt-max-requests=25 --gdelt-max-ms=420000 --candidates=300
          echo "=== exit $? ==="
          REMOTE
      - name: Summary
        if: always()
        run: |
          { echo '```'; head -c 60000 "$RUNNER_TEMP/run.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
