name: Scout BR/MAG source (one-shot, read-only)

# Read-only reconnaissance of the BR/MAG Judge Database (UVA Law Legal Data Lab),
# the consolidated source for federal magistrate + bankruptcy judges that the FJC
# Article III directory does not cover. Runs from inside the worker-supervisor
# container on the production box (verified outbound egress) so we can see the
# exact bulk-file structure (formats, CSV header, JSON shape, photo URL) before
# building the Article I importer. No writes, no ingestion.
#
# The most important output (CSV header, JSON shape, photo URL) is printed LAST so
# it survives log tailing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-scout-brmag
  cancel-in-progress: false

jobs:
  scout:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Describe BR/MAG bulk file (read-only)
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set +e
          sup="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=worker-supervisor' --format '{{.ID}}' | head -n1)"
          [ -n "$sup" ] || { echo "::error::worker-supervisor container not running"; exit 1; }
          base="https://legaldatalab.law.virginia.edu/brmag-judges"
          run() { sudo -n docker exec "$sup" sh -lc "$1"; }

          echo "=== Which formats exist (HTTP status + size) ==="
          for f in brmag-judges.csv brmag-judges.json brmag-judges.xlsx; do
            printf '  %-22s ' "$f"
            run "wget -S -q -O /dev/null --timeout=25 --tries=1 '$base/$f' 2>&1 | \
              grep -Ei 'HTTP/|Content-Length' | tr '\n' ' '"; echo ""
          done

          echo ""
          echo "=== Photo URL: raw <img> tags on a detail page ==="
          run "wget -q -O - --timeout=25 --tries=1 '$base/detail/mag-89.html' 2>/dev/null | \
            grep -oiE '<img[^>]+src=\"[^\"]+\"' | head -6"

          echo ""
          echo "=== CSV: header + first 2 data rows + total line count ==="
          run "wget -q -O - --timeout=40 --tries=1 '$base/brmag-judges.csv' > /tmp/b.csv 2>/dev/null; \
            if [ -s /tmp/b.csv ]; then echo 'HEADER:'; head -1 /tmp/b.csv; \
            echo 'ROW1:'; sed -n '2p' /tmp/b.csv; echo 'ROW2:'; sed -n '3p' /tmp/b.csv; \
            echo -n 'LINES: '; wc -l < /tmp/b.csv; else echo '(no CSV)'; fi"

          echo ""
          echo "=== JSON: first 1500 bytes (shape) — PRINTED LAST ==="
          run "wget -q -O - --timeout=40 --tries=1 '$base/brmag-judges.json' 2>/dev/null | head -c 1500; echo"
          REMOTE
