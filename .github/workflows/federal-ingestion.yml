name: Federal ingestion loops

on:
  workflow_dispatch:
    inputs:
      loop:
        description: Federal ingestion loop
        required: true
        type: choice
        default: new-case-discovery
        options:
          - new-case-discovery
          - active-case-updates
          - material-decisions
          - historical-backfill
          - publication-quarantine
      limit:
        description: Maximum records for this cycle (100, 1000, or 10000)
        required: true
        default: "100"
      approve_scale_up:
        description: Promote a clean historical checkpoint by one reviewed stage
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-federal-${{ inputs.loop || github.event.schedule }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    steps:
      - name: Resolve loop and safe batch ceiling
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_LOOP: ${{ inputs.loop }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_APPROVE_SCALE_UP: ${{ inputs.approve_scale_up }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LOOP="$INPUT_LOOP"
            LIMIT="$INPUT_LIMIT"
            APPROVE_SCALE_UP="$INPUT_APPROVE_SCALE_UP"
          elif [ "$EVENT_NAME" = "push" ]; then
            LOOP="historical-backfill"
            LIMIT="100"
            APPROVE_SCALE_UP="false"
          else
            case "$SCHEDULE" in
              "17 * * * *") LOOP="new-case-discovery"; LIMIT="100" ;;
              "27 */6 * * *") LOOP="active-case-updates"; LIMIT="100" ;;
              "37 * * * *") LOOP="material-decisions"; LIMIT="100" ;;
              "47 3 * * *") LOOP="historical-backfill"; LIMIT="100" ;;
              "57 * * * *") LOOP="publication-quarantine"; LIMIT="100" ;;
              *) echo "::error::Unknown schedule"; exit 1 ;;
            esac
            APPROVE_SCALE_UP="false"
          fi
          case "$LOOP" in
            new-case-discovery|active-case-updates|material-decisions|historical-backfill|publication-quarantine) ;;
            *) echo "::error::Invalid loop"; exit 1 ;;
          esac
          case "$LIMIT" in 100|1000|10000) ;; *) echo "::error::Invalid batch stage"; exit 1 ;; esac
          if [ "$APPROVE_SCALE_UP" = "true" ] && [ "$LOOP" != "historical-backfill" ]; then
            echo "::error::Only historical backfill checkpoints may be promoted"
            exit 1
          fi
          printf 'LOOP=%s\nLIMIT=%s\nAPPROVE_SCALE_UP=%s\n' \
            "$LOOP" "$LIMIT" "$APPROVE_SCALE_UP" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$DO_SSH_KEY_B64"
          case "$DO_SSH_KEY_B64" in *[!A-Za-z0-9+/=]*) exit 1;; esac
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve active production image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
            set -eu
            ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
            set -- $ids
            test "$#" -eq 1
            docker inspect --format "{{.Config.Image}}" "$1"
          ')"
          test -n "$JURVIO_IMAGE"
          case "$JURVIO_IMAGE" in *[!A-Za-z0-9._/@:-]*) exit 1;; esac
          printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"

      - name: Run resumable federal cycle
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/run-federal-ingestion-loop.mjs --loop='$LOOP' --limit='$LIMIT' --approve-scale-up='$APPROVE_SCALE_UP' --delay-ms=1000" | tee /tmp/federal-cycle.log

      - name: Publish eligible federal cases immediately after ingestion
        if: ${{ env.LOOP != 'publication-quarantine' }}
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -o pipefail
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/run-federal-ingestion-loop.mjs --loop='publication-quarantine' --limit='$LIMIT' --approve-scale-up='false' --delay-ms=0" | tee /tmp/federal-publication.log

      - name: Report corpus, failures, lag, and growth
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5101766948"
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          REPORT_EXIT=0
          if [ -z "${JURVIO_IMAGE:-}" ]; then
            CORPUS='{"report":"unavailable","reason":"active production image unresolved"}'
            REPORT_EXIT=1
          elif CORPUS="$(ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('cases',(SELECT count(*) FROM legal_case),'published',(SELECT count(*) FROM legal_case WHERE publication='published'),'held',(SELECT count(*) FROM legal_case WHERE publication IN ('draft','restricted')),'docket_entries',(SELECT count(*) FROM docket_entry),'documents',(SELECT count(*) FROM document),'opinions',(SELECT count(*) FROM judicial_opinion),'failures',(SELECT count(*) FROM ingestion_run_item WHERE status='failed'),'database_bytes',pg_database_size(current_database()),'latest_source_at',(SELECT max(retrieved_at) FROM raw_artifact),'cost_usd',0);\"" 2>/dev/null)"; then
            :
          else
            REPORT_EXIT=$?
            CORPUS='{"report":"unavailable","reason":"production database query failed"}'
          fi
          CYCLE_RESULT="$(tail -n 1 /tmp/federal-cycle.log 2>/dev/null || true)"
          test -n "$CYCLE_RESULT" || CYCLE_RESULT='{"cycle":"no batch output available"}'
          BODY="$(printf '### Federal ingestion\n\n- Status: **%s**\n- Loop: `%s`\n- Limit: `%s`\n- Updated: `%s`\n- Run: %s/%s/actions/runs/%s\n\nBatch output:\n\n```json\n%s\n```\n\nCorpus totals:\n\n```json\n%s\n```' "$WORKFLOW_STATUS" "${LOOP:-unknown}" "${LIMIT:-unknown}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$CYCLE_RESULT" "$CORPUS")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"
          exit "$REPORT_EXIT"

