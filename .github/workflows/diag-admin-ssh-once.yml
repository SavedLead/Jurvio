name: Diag admin SSH (jurvio-admin)

# Local, unprivileged diagnostic run ON the builder (as the runner user) to find
# why jurvio-admin@127.0.0.1 is refused: checks the account, the sudo group, the
# sshd allow/match/pubkey directives (world-readable), and a verbose client-side
# SSH attempt. No sudo, no SSH-to-self privilege required. Delete after use.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-diag-admin-ssh
  cancel-in-progress: false

jobs:
  diag:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
    steps:
      - name: Prepare key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Inspect locally (no privilege)
        run: |
          set +e
          echo "=== jurvio-admin account ==="
          getent passwd jurvio-admin || echo "MISSING jurvio-admin"
          id jurvio-admin 2>/dev/null || true
          echo "=== sudo group membership ==="
          getent group sudo || true
          echo "=== runner user (for comparison) ==="
          id jurvio-runner 2>/dev/null || true
          echo "=== sshd allow/deny/match/pubkey directives (world-readable) ==="
          grep -RiEn 'allowusers|allowgroups|denyusers|denygroups|^[[:space:]]*match|pubkeyauthentication|authorizedkeysfile|permitrootlogin|passwordauthentication' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/ 2>/dev/null || echo "(cannot read sshd_config)"
          echo "=== verbose client SSH attempt to jurvio-admin@127.0.0.1 ==="
          ssh -vv -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 jurvio-admin@127.0.0.1 'echo LOGIN_OK' 2>&1 | grep -iE 'Offering|Authentications that can continue|Permission denied|Server accepts|publickey|LOGIN_OK|Connection|refused' | tail -25
          echo "=== end ==="
          exit 0
