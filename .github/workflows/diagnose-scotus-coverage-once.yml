name: Diagnose SCOTUS official coverage (once, read-only)

# Fetches the public slip-opinion, orders, and relating-to-orders indexes.
# No database, no PDF body, no publication change.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DIAGNOSE_SCOTUS_COVERAGE"
        required: true
        type: string
      term:
        description: "Two-digit term"
        required: true
        default: "26"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-scotus-coverage
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 10
    steps:
      - name: Require confirm=DIAGNOSE_SCOTUS_COVERAGE
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DIAGNOSE_SCOTUS_COVERAGE" ]; then
            echo "::error::Refusing to run. Re-run with confirm=DIAGNOSE_SCOTUS_COVERAGE."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Fetch official indexes
        env:
          TERM: ${{ inputs.term }}
        run: |
          set -euo pipefail
          case "$TERM" in [0-9][0-9]) ;; *) echo "::error::term must be two digits"; exit 1;; esac
          pnpm exec tsx scripts/diagnose-scotus-coverage.ts --term="$TERM"
