name: Activate pre-500 SCOTUS publication

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=ACTIVATE_PRODUCTION_SCOTUS_PRE500.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ACTIVATE_PRODUCTION_SCOTUS_PRE500 to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-production-scotus-pre500-direct
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 180
    steps:
      - name: Require confirm=ACTIVATE_PRODUCTION_SCOTUS_PRE500
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ACTIVATE_PRODUCTION_SCOTUS_PRE500" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=ACTIVATE_PRODUCTION_SCOTUS_PRE500."
            exit 1
          fi
      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run lease-protected pre-500 coordinator
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          app_id="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}" | head -n1)"
          test -n "$app_id"
          export JURVIO_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$app_id")"
          COMPOSE="docker compose -f docker-compose.production.yml"
          # The coordinator from PR #193 owns ordering, durable checkpoints,
          # retries, publication drains, and a PostgreSQL advisory lease.
          timeout --foreground 170m $COMPOSE exec -T worker node jobs/run-scotus-pre500-backfill.mjs
          REMOTE
