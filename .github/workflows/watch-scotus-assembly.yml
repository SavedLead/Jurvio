name: Watch SCOTUS historical assembly

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=WATCH_SCOTUS_ASSEMBLY.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type WATCH_SCOTUS_ASSEMBLY to run this workflow against production"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: jurvio-scotus-assembly-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 5
    steps:
      - name: Require confirm=WATCH_SCOTUS_ASSEMBLY
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "WATCH_SCOTUS_ASSEMBLY" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=WATCH_SCOTUS_ASSEMBLY."
            exit 1
          fi
      - name: Install GitHub REST helpers (builder-01 has no gh CLI)
        if: always()
        run: |
          # jurvio-builder-01 has curl and jq but no gh CLI. These helpers replace the
          # gh calls this workflow used. Issue comments and report updates are best
          # effort and never fail the job; reads used for decisions still fail loudly.
          cat > "$RUNNER_TEMP/gh-rest.sh" <<'GHREST'
          _gh_curl() {
            local method="$1" path="$2"; shift 2
            curl -fsSL --retry 3 --retry-delay 2 -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN is not set}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" "https://api.github.com/${path#/}"
          }
          gh_api() { _gh_curl GET "$1"; }
          gh_api_post() {
            if [ $# -ge 2 ]; then printf '%s' "$2" | _gh_curl POST "$1" -H "Content-Type: application/json" --data-binary @-
            else _gh_curl POST "$1"; fi
          }
          # Every page of a list endpoint, one JSON document per page (pipe into jq).
          gh_api_paginate() {
            local path="$1" page=1 sep body count
            case "$path" in *\?*) sep='&' ;; *) sep='?' ;; esac
            while [ "$page" -le 50 ]; do
              body="$(gh_api "${path}${sep}page=${page}")" || return 1
              printf '%s\n' "$body"
              count="$(jq '(if type == "array" then . else ([.[] | arrays] | .[0] // []) end) | length' <<<"$body")"
              [ "${count:-0}" -gt 0 ] || break
              page=$((page + 1))
            done
          }
          gh_patch_body() {
            jq -n --arg body "$2" '{body: $body}' \
              | _gh_curl PATCH "$1" -H "Content-Type: application/json" --data-binary @- \
              || { echo "::warning::GitHub update of $1 failed (non-fatal)" >&2; return 0; }
          }
          # Run status goes to the job summary and a run annotation, never to an issue
          # comment or a new issue: GitHub emails the issue author for every one.
          status_note() {
            local body="$1" level=notice line
            case "$body" in *failure*|*cancelled*|*FAIL*) level=warning ;; esac
            printf '%s\n\n' "$body" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            line="${body%%$'\n'*}"; line="${line//'%'/%25}"
            echo "::${level}::${line}"
          }
          # status_report TITLE BODY (BODY may contain literal \n sequences)
          status_report() {
            local level=notice title="${1//'%'/%25}"
            case "$1" in *failure*|*cancelled*|*FAIL*) level=warning ;; esac
            printf '### %s\n\n%b\n\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::${level} title=Run status::${title}"
          }
          # gh_dispatch WORKFLOW REF key=value ...
          gh_dispatch() {
            local wf="$1" ref="$2"; shift 2
            local inputs='{}' kv
            for kv in "$@"; do inputs="$(jq -c --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k): $v}' <<<"$inputs")"; done
            jq -n --arg ref "$ref" --argjson inputs "$inputs" '{ref: $ref, inputs: $inputs}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/dispatches" -H "Content-Type: application/json" --data-binary @- >/dev/null
          }
          export -f _gh_curl gh_api gh_api_post gh_api_paginate gh_patch_body status_note status_report gh_dispatch
          GHREST
      - name: Inspect and recover SCOTUS assembly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLY_WORKFLOW: ingest-production-scotus-official.yml
          PUBLICATION_WORKFLOW: publish-official-scotus-opinions.yml
          XRAY_COMMENT_ID: "5133453027"
          PUBLICATION_COMMENT_ID: "5101767945"
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set -euo pipefail
          NOW="$(date -u +%s)"
          XRAY_JSON="$(gh_api "repos/$GITHUB_REPOSITORY/issues/comments/$XRAY_COMMENT_ID")"
          XRAY_UPDATED="$(jq -r '.updated_at' <<<"$XRAY_JSON")"
          XRAY_BODY="$(jq -r '.body' <<<"$XRAY_JSON")"
          UPDATED_EPOCH="$(date -u -d "$XRAY_UPDATED" +%s)"
          HEARTBEAT_AGE=$((NOW - UPDATED_EPOCH))

          ASSEMBLY_RUNS="$(gh_api "repos/$GITHUB_REPOSITORY/actions/workflows/$ASSEMBLY_WORKFLOW/runs?per_page=30")"
          ASSEMBLY_ACTIVE="$(jq '[.workflow_runs[] | select(.event != "schedule" and (.status == "queued" or .status == "in_progress"))] | length' <<<"$ASSEMBLY_RUNS")"

          ASSEMBLY_ACTION="healthy"
          if [ "$ASSEMBLY_ACTIVE" -eq 0 ] && { [ "$HEARTBEAT_AGE" -ge 600 ] || grep -q 'release pending' <<<"$XRAY_BODY"; }; then
            gh_dispatch "$ASSEMBLY_WORKFLOW" main confirm=INGEST_PRODUCTION_SCOTUS_OFFICIAL term=25 limit=100 resume=true
            ASSEMBLY_ACTION="dispatched"
            gh_patch_body "repos/$GITHUB_REPOSITORY/issues/comments/$XRAY_COMMENT_ID" "### SCOTUS Assembly X-Ray

          - Phase: **watchdog dispatched recovery**
          - Target: U.S. Reports Volumes **567 → 502**
          - Reason: no active historical assembly and heartbeat was stale
          - PDF-to-text workers: 4 on GitHub runner
          - Production staging workers: 2
          - Watchdog run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Last heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
          fi

          PUBLICATION_BODY="$(gh_api "repos/$GITHUB_REPOSITORY/issues/comments/$PUBLICATION_COMMENT_ID" | jq -r '.body')"
          PENDING="$(sed -n 's/.*"pending_official_candidates" : \([0-9][0-9]*\).*/\1/p' <<<"$PUBLICATION_BODY" | tail -n 1)"
          PENDING="${PENDING:-0}"
          PUBLICATION_RUNS="$(gh_api "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLICATION_WORKFLOW/runs?per_page=20")"
          PUBLICATION_ACTIVE="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length' <<<"$PUBLICATION_RUNS")"
          PUBLICATION_ACTION="idle"
          if [ "$PENDING" -gt 0 ] && [ "$PUBLICATION_ACTIVE" -eq 0 ]; then
            gh_dispatch "$PUBLICATION_WORKFLOW" main confirm=PUBLISH_OFFICIAL_SCOTUS_OPINIONS limit=100
            PUBLICATION_ACTION="dispatched"
          elif [ "$PUBLICATION_ACTIVE" -gt 0 ]; then
            PUBLICATION_ACTION="active"
          fi

          jq -n             --arg assemblyAction "$ASSEMBLY_ACTION"             --argjson assemblyActive "$ASSEMBLY_ACTIVE"             --argjson heartbeatAgeSeconds "$HEARTBEAT_AGE"             --arg publicationAction "$PUBLICATION_ACTION"             --argjson pendingCandidates "$PENDING"             '{assemblyAction:$assemblyAction,assemblyActive:$assemblyActive,heartbeatAgeSeconds:$heartbeatAgeSeconds,publicationAction:$publicationAction,pendingCandidates:$pendingCandidates}'
