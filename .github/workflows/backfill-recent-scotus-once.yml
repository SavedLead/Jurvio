name: Backfill recent SCOTUS activity once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-recent-scotus-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurvio-scotus-recent-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 120
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Replay the complete current SCOTUS term and drain publication
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio

          app="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter 'label=com.docker.compose.service=app' --format '{{.ID}}' | head -n1)"
          [ -n "$app" ] || { echo '::error::No running Jurvio app container'; exit 1; }

          month="$(date -u +%m)"
          year="$(date -u +%Y)"
          if [ "$month" -lt 10 ]; then year=$((year - 1)); fi
          term="$(printf '%02d' $((year % 100)))"

          echo "Replaying official SCOTUS term ${term} from the head of the official index."
          # First pass deliberately ignores the saved checkpoint so any opinions missed
          # during the last several months are replayed. Subsequent resume passes advance
          # through the remainder of the official index if it contains more than 100 rows.
          sudo -n docker exec -e RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts -e JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts \
            "$app" node jobs/ingest-enriched-official-scotus.mjs "--term=${term}" --limit=100 --resume=false --attempts=20

          for pass in 1 2 3 4; do
            echo "SCOTUS resume pass ${pass}"
            sudo -n docker exec -e RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts -e JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts \
              "$app" node jobs/ingest-enriched-official-scotus.mjs "--term=${term}" --limit=100 --resume=true --attempts=20
          done

          sudo -n docker exec "$app" node jobs/publish-official-scotus-opinions.mjs --limit=10000
          sudo -n docker exec -e JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts \
            "$app" node jobs/extract-official-scotus-opinion-text.mjs --limit=10000
          REMOTE

      - name: Report last 120 days of published SCOTUS activity
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          pg="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter 'label=com.docker.compose.service=postgres' --format '{{.ID}}' | head -n1)"
          [ -n "$pg" ] || { echo '::error::No running Jurvio postgres container'; exit 1; }

          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -P pager=off -c "
            SELECT count(*) AS published_scotus_cases_last_120_days
              FROM legal_case
              JOIN court ON court.id = legal_case.court_id
             WHERE lower(court.provider_court_id) = 'scotus'
               AND legal_case.publication = 'published'
               AND legal_case.decided_on >= current_date - interval '120 days';

            SELECT legal_case.decided_on,
                   legal_case.docket_number,
                   legal_case.case_name,
                   legal_case.publication
              FROM legal_case
              JOIN court ON court.id = legal_case.court_id
             WHERE lower(court.provider_court_id) = 'scotus'
               AND legal_case.decided_on >= current_date - interval '120 days'
             ORDER BY legal_case.decided_on DESC NULLS LAST, legal_case.docket_number DESC
             LIMIT 250;
          "
          REMOTE
