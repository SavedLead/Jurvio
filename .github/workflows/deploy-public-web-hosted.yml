name: Deploy public web via hosted runner

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to release the current main commit'
        required: true
        type: string
      public_launch:
        description: 'Enable public indexing after this deployment'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: jurvio-public-web
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm == 'DEPLOY')
      }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 60
    environment: production
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/savedlead/jurvio:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENABLE_PUBLIC_INDEXING: ${{ github.event_name == 'workflow_dispatch' && inputs.public_launch && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Install GitHub API helper (builder-01 has no gh CLI)
        run: |
          set -euo pipefail
          # jurvio-builder-01 has curl and jq but not the gh CLI; since #543 moved
          # this job onto it, every `gh` call failed with exit 127.
          cat > "$RUNNER_TEMP/gh-api.sh" <<'EOF'
          gh_api() {
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/$1"
          }
          # Deploy progress goes to the job summary and a run annotation. It used to
          # be posted as a comment on issue #426, which emailed the issue author on
          # every deploy. Never fails the deploy.
          status_note() {
            local body="$1" level=notice line
            case "$body" in *failure*|*cancelled*|*FAIL*) level=warning ;; esac
            printf '%s\n\n' "$body" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            line="${body%%$'\n'*}"; line="${line//'%'/%25}"
            echo "::${level}::${line}"
          }
          # Alias so older call sites (and in-flight branches) still work.
          gh_comment() { status_note "$@"; }
          EOF

      - name: Require current main and successful CI
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-api.sh"
          current="$(gh_api "repos/$GITHUB_REPOSITORY/commits/main" | jq -r .sha)"
          if [ "$TARGET_SHA" != "$current" ]; then
            # CI skips docs, scripts/diag and workflow-only pushes to main (see
            # ci.yml paths-ignore), so a newer commit like that never gets its own
            # CI run. Without this check, one such merge would block every public
            # deploy until the next app change. TARGET_SHA may still deploy, but
            # only if main is strictly ahead of it and every file changed since
            # is in that ignore list. Anything else is refused, as before.
            compare="$(gh_api "repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$current")"
            status="$(jq -r .status <<<"$compare")"
            files="$(jq -r '.files | length' <<<"$compare")"
            app_files="$(jq -r '[.files[].filename
              | select((test("\\.md$") or startswith("scripts/diag/") or startswith(".github/workflows/")) | not)] | length' <<<"$compare")"
            if [ "$status" != "ahead" ] || [ "$files" -ge 300 ] || [ "$app_files" != "0" ]; then
              echo "::error::This run is not the current main commit ($current), and main has app changes since $TARGET_SHA (status=$status, files=$files, app_files=$app_files)."
              exit 1
            fi
            echo "Main ($current) is ahead of $TARGET_SHA only by CI-ignored files ($files); releasing $TARGET_SHA."
          fi
          conclusion="$(gh_api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&status=completed&per_page=20" \
            | jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].conclusion // empty')"
          if [ "$conclusion" != success ]; then
            # TARGET_SHA itself may be a CI-ignored commit (docs, scripts/diag,
            # workflow-only) with no CI run of its own, e.g. a manual dispatch
            # right after a diag merge. Accept it when the newest CI-green main
            # commit is a strict ancestor and everything since is CI-ignored,
            # i.e. the app code is identical to what CI verified.
            green="$(gh_api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].head_sha // empty')"
            test -n "$green" || { echo "::error::Current main does not have a successful CI run."; exit 1; }
            compare="$(gh_api "repos/$GITHUB_REPOSITORY/compare/$green...$TARGET_SHA")"
            status="$(jq -r .status <<<"$compare")"
            files="$(jq -r '.files | length' <<<"$compare")"
            app_files="$(jq -r '[.files[].filename
              | select((test("\\.md$") or startswith("scripts/diag/") or startswith(".github/workflows/")) | not)] | length' <<<"$compare")"
            if [ "$status" != "ahead" ] || [ "$files" -ge 300 ] || [ "$app_files" != "0" ]; then
              echo "::error::Current main does not have a successful CI run (last green $green; status=$status, files=$files, app_files=$app_files)."
              exit 1
            fi
            echo "$TARGET_SHA differs from CI-green $green only by CI-ignored files ($files); releasing."
          fi

      - name: Open temporary /32 SSH access
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          public="$(jq -c '[.droplets[] | select(.name=="jurvio-public-01")][0] // empty' <<<"$droplets")"
          test -n "$public"
          public_id="$(jq -r .id <<<"$public")"
          public_ip="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$public")"
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          firewall_id="$(jq -r --argjson id "$public_id" '[.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty' <<<"$firewalls")"
          test -n "$firewall_id" && test -n "$public_ip"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          runner_cidr="$runner_ip/32"
          {
            echo "PUBLIC_IP=$public_ip"
            echo "FIREWALL_ID=$firewall_id"
            echo "RUNNER_CIDR=$runner_cidr"
          } >> "$GITHUB_ENV"
          rule="$(jq -n --arg src "$runner_cidr" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
          curl -fsS -X POST "${auth[@]}" "$api/firewalls/$firewall_id/rules" -d "$rule" >/dev/null
          source "$RUNNER_TEMP/gh-api.sh"
          status_note '2.6 deploy fallback: temporary /32 SSH route opened to jurvio-public-01.'

      - name: Configure ephemeral SSH
        run: |
          set -euo pipefail
          # builder-01/02/03 are runner services on ONE host sharing one $HOME,
          # so ~/.ssh/config is shared too. Deploy production (builder-01)
          # rewrites ~/.ssh/config and other jobs rm it in cleanup; that wiped
          # the public-web alias mid-run in 41322460589 ("Could not resolve
          # hostname public-web"). Keep this job's key/config in its own
          # $RUNNER_TEMP and put ssh/scp wrappers that use it first on PATH.
          ssh_dir="$RUNNER_TEMP/jurvio-public-ssh"
          install -m 700 -d "$ssh_dir" "$ssh_dir/bin"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          cat > "$ssh_dir/config" <<EOF
          Host public-web
            HostName $PUBLIC_IP
            User root
            IdentityFile $ssh_dir/id_ed25519
            IdentitiesOnly yes
            UserKnownHostsFile $ssh_dir/known_hosts
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 "$ssh_dir/config"
          for tool in ssh scp; do
            printf '#!/bin/sh\nexec /usr/bin/%s -F "%s/config" "$@"\n' "$tool" "$ssh_dir" > "$ssh_dir/bin/$tool"
            chmod 700 "$ssh_dir/bin/$tool"
          done
          echo "$ssh_dir/bin" >> "$GITHUB_PATH"
          "$ssh_dir/bin/ssh" public-web true

      - name: Sync customer email and billing settings to public env
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_POSTAL_ADDRESS: ${{ secrets.EMAIL_POSTAL_ADDRESS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PLUS: ${{ secrets.STRIPE_PRICE_PLUS }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_TEAM: ${{ secrets.STRIPE_PRICE_TEAM }}
        run: |
          set -euo pipefail
          # Customer sign-in email (Resend) and Stripe stay off until David adds
          # these repository secrets. Each set secret is upserted into the public
          # box env as one line, sent over stdin so values never appear in argv or
          # logs; unset secrets leave the box env untouched (never deleted here).
          # "Replace public app container" below re-reads env_file.
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          chmod 600 "$payload"
          for name in RESEND_API_KEY EMAIL_FROM EMAIL_POSTAL_ADDRESS STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_PLUS STRIPE_PRICE_PRO STRIPE_PRICE_TEAM; do
            value="${!name:-}"
            [ -n "$value" ] || continue
            case "$value" in *$'\n'*|*$'\r'*) echo "::error::$name contains a newline"; exit 1;; esac
            printf '%s=%s\n' "$name" "$value" >> "$payload"
          done
          if [ ! -s "$payload" ]; then
            echo "::notice title=Customer email/billing not configured::No RESEND_*/EMAIL_*/STRIPE_* secrets set; sign-in stays 'temporarily unavailable' and checkout stays 'coming soon'."
            exit 0
          fi
          ssh public-web '
            set -euo pipefail
            umask 077
            env_file=/opt/jurvio/.env.production
            touch "$env_file"
            updates="$(mktemp)"; tmp="$(mktemp)"
            cat > "$updates"
            cp "$env_file" "$tmp"
            while IFS= read -r line; do
              key="${line%%=*}"
              grep -v "^${key}=" "$tmp" > "$tmp.next" || true
              mv "$tmp.next" "$tmp"
              printf "%s\n" "$line" >> "$tmp"
              echo "$key synced (value not printed)."
            done < "$updates"
            chmod 600 "$tmp"
            mv "$tmp" "$env_file"
            rm -f "$updates"
          ' < "$payload"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate build runner to image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish current main image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate public server to image registry
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | ssh public-web 'docker login ghcr.io -u SavedLead --password-stdin'

      - id: migrations
        name: Hold the release if database migrations are pending
        run: |
          set -euo pipefail
          # This workflow NEVER runs migrations. Deploy production applies them
          # after its pre-release database backup (release-production.sh backs up
          # only when migrations are pending); when this job used to run
          # the migration script first, Deploy production then saw "No pending
          # migrations" and skipped the backup (0173/0174, Nov 1, 2026).
          # Code-only releases (0 pending) continue exactly as before. Anything
          # else - a count, or "unknown" when the check itself fails - holds the
          # release before the container is switched; Deploy production applies
          # the migrations with its backup, then dispatches this workflow again.
          pending="$(ssh public-web bash -s -- "${IMAGE,,}" <<'REMOTE' | tail -n1
          set -uo pipefail
          cd /opt/jurvio
          docker pull -q "$1" >/dev/null 2>&1 || { echo unknown; exit 0; }
          docker run --rm --env-file .env.production "$1" node jobs/list-pending-migrations.mjs 2>/dev/null | tail -n1 || echo unknown
          REMOTE
          )" || pending=unknown
          case "$pending" in unknown) ;; ''|*[!0-9]*) pending=unknown;; esac
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" = "0" ]; then
            echo "No pending migrations; releasing the public app."
            echo "held=false" >> "$GITHUB_OUTPUT"
          else
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Public release held: pending migrations::$pending pending migration(s) for $TARGET_SHA. The public app was NOT switched. Run Deploy production (confirm=DEPLOY_PRODUCTION): it backs up the database, applies the migrations, then dispatches this workflow to release the public app."
            {
              echo '### Public release held'
              echo ''
              echo "Pending migrations: **$pending** for \`$TARGET_SHA\`. The public app keeps its current image."
              echo ''
              echo 'Next: run **Deploy production** (confirm=DEPLOY_PRODUCTION). It backs up, migrates, then dispatches this deploy.'
            } >> "$GITHUB_STEP_SUMMARY"
            source "$RUNNER_TEMP/gh-api.sh"
            status_note "Public deploy held for $TARGET_SHA: $pending pending migration(s). Deploy production applies them after its backup, then re-dispatches the public deploy."
          fi

      - name: Replace public app container
        if: ${{ steps.migrations.outputs.held == 'false' }}
        run: |
          set -euo pipefail
          scp docker-compose.public.yml public-web:/opt/jurvio/docker-compose.public.yml
          ssh public-web bash -s -- "${IMAGE,,}" "$ENABLE_PUBLIC_INDEXING" <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          test -s .env.production
          test -s docker-compose.public.yml

          if [ "$2" = "true" ]; then
            env_tmp="$(mktemp)"
            grep -v '^JURVIO_PUBLIC_LAUNCH=' .env.production > "$env_tmp" || true
            printf '%s\n' 'JURVIO_PUBLIC_LAUNCH=true' >> "$env_tmp"
            chmod 600 "$env_tmp"
            mv "$env_tmp" .env.production
            echo "Public indexing launch switch enabled."
          fi

          current_id="$(JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml ps -q app 2>/dev/null || true)"
          test -n "$current_id" || { echo "::error::current public app container was not found"; exit 1; }
          previous_image="$(docker inspect -f '{{.Config.Image}}' "$current_id")"
          test -n "$previous_image"
          docker image inspect "$previous_image" >/dev/null
          umask 077
          printf '%s\n' "$previous_image" > .previous-public-image
          echo "Rollback target recorded: $previous_image"

          docker pull "$1"
          # No migrations here: see "Hold the release if database migrations are pending".
          JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml up -d --no-deps app
          app_id="$(JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml ps -q app)"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$app_id")" = healthy ] && break
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$app_id")" = healthy ]
          local_robots="$(curl -fsS -H 'Host: jurvio.com' http://127.0.0.1:3000/robots.txt)"
          if grep -Eq '^JURVIO_PUBLIC_LAUNCH=true$' .env.production; then
            printf '%s' "$local_robots" | grep -Fq 'Allow: /'
            printf '%s' "$local_robots" | grep -Fq 'Sitemap: https://jurvio.com/sitemap.xml'
          else
            printf '%s' "$local_robots" | grep -Fq 'Disallow: /'
          fi
          rollback_image="$(cat .previous-public-image)"
          test -n "$rollback_image"
          docker image inspect "$rollback_image" >/dev/null
          printf 'ROLLBACK_READY=%s\n' "$rollback_image"
          REMOTE
          source "$RUNNER_TEMP/gh-api.sh"
          status_note '1.5 rollback readiness: previous public image recorded and retained locally; new container health and noindex verified.'

      - name: Verify public and private boundaries externally
        if: ${{ steps.migrations.outputs.held == 'false' }}
        run: |
          set -euo pipefail
          robots_body="$(curl -fsS --retry 12 --retry-delay 5 --max-time 30 https://jurvio.com/robots.txt)"
          if printf '%s' "$robots_body" | grep -Fq 'Sitemap: https://jurvio.com/sitemap.xml'; then
            printf '%s' "$robots_body" | grep -Fq 'Allow: /'
            indexing_status="enabled"
            if curl -fsSI --retry 5 --retry-delay 2 --max-time 30 https://jurvio.com/ |
              tr -d '\r' | grep -Fiq 'x-robots-tag: noindex'; then
              echo "::error::Homepage still sends an X-Robots-Tag noindex header."
              exit 1
            fi
          else
            printf '%s' "$robots_body" | grep -Fq 'Disallow: /'
            indexing_status="disabled"
          fi
          echo "INDEXING_STATUS=$indexing_status" >> "$GITHUB_ENV"
          login_body="$(curl -fsS --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 https://z.jurvio.com/login)"
          printf '%s' "$login_body" | grep -Fiq 'PRIVATE COMMAND CENTER'
          public_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://jurvio.com/login)"
          test "$public_status" = 404
          source "$RUNNER_TEMP/gh-api.sh"
          status_note "2.6 deploy fallback: current main deployed to jurvio.com; indexing $indexing_status and public/private route boundaries verified."

      - name: Verify launch routes and performance
        if: ${{ steps.migrations.outputs.held == 'false' }}
        run: |
          set -euo pipefail
          results="$(mktemp)"
          trap 'rm -f "$results"' EXIT

          check_route() {
            name="$1"
            url="$2"
            limit="$3"
            metrics="$(curl -sS -o /dev/null --retry 2 --retry-delay 2 --max-time 30 \
              -w '%{http_code} %{time_starttransfer} %{time_total}' "$url")"
            read -r code ttfb total <<<"$metrics"
            printf '%s|%s|%s|%s\n' "$name" "$code" "$ttfb" "$total" >> "$results"
            test "$code" = 200 || {
              echo "::error::$name returned HTTP $code"
              return 1
            }
            awk -v value="$total" -v ceiling="$limit" 'BEGIN { exit !(value <= ceiling) }' || {
              echo "::error::$name took ${total}s; launch ceiling is ${limit}s"
              return 1
            }
          }

          # Populate application/data caches after the container restart so the
          # timed checks represent visitor traffic, not one-time startup work.
          warm_route() {
            curl -fsS -o /dev/null --retry 2 --retry-delay 2 --max-time 45 "$1"
          }
          warm_route https://jurvio.com/
          warm_route https://jurvio.com/cases
          warm_route https://jurvio.com/coverage
          # Build the cached sitemap count before Googlebot reaches the new container.
          sitemap_index="$(curl -fsS --retry 2 --retry-delay 3 --max-time 120 https://jurvio.com/sitemap.xml)"
          printf '%s' "$sitemap_index" | grep -Fq '<sitemapindex'
          printf '%s' "$sitemap_index" | grep -Fq 'https://jurvio.com/sitemaps/static.xml'
          warm_route 'https://jurvio.com/search?q=Trump%20v.%20Slaughter'

          check_route Homepage https://jurvio.com/ 10
          check_route Cases https://jurvio.com/cases 10
          check_route Coverage https://jurvio.com/coverage 10
          check_route Sitemap https://jurvio.com/sitemap.xml 10
          check_route Search 'https://jurvio.com/search?q=Trump%20v.%20Slaughter' 15

          {
            echo '### Live health and performance gate'
            echo ''
            echo '| Route | HTTP | TTFB | Total |'
            echo '|---|---:|---:|---:|'
            while IFS='|' read -r name code ttfb total; do
              printf '| %s | %s | %ss | %ss |\n' "$name" "$code" "$ttfb" "$total"
            done < "$results"
          } >> "$GITHUB_STEP_SUMMARY"

          summary="$(while IFS='|' read -r name code ttfb total; do printf '%s: HTTP %s, %ss total; ' "$name" "$code" "$total"; done < "$results")"
          source "$RUNNER_TEMP/gh-api.sh"
          status_note "1.6/2.6 live gate passed. $summary Indexing is $INDEXING_STATUS."

      - name: Remove temporary SSH access
        if: always()
        run: |
          set +e
          api=https://api.digitalocean.com/v2
          if [ -n "${FIREWALL_ID:-}" ] && [ -n "${RUNNER_CIDR:-}" ]; then
            rule="$(jq -n --arg src "$RUNNER_CIDR" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
            curl -fsS -X DELETE               -H "Authorization: Bearer $DO_TOKEN"               -H "Content-Type: application/json"               "$api/firewalls/$FIREWALL_ID/rules" -d "$rule"
          fi
          # Only this job's private SSH dir; never ~/.ssh, which other runners use.
          rm -rf "$RUNNER_TEMP/jurvio-public-ssh"
          source "$RUNNER_TEMP/gh-api.sh"
          status_note "2.6 deploy fallback finished with status: **${{ job.status }}**. Temporary SSH rule removal attempted. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
