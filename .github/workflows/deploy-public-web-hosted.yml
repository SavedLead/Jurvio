name: Deploy public web via hosted runner

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to release the current main commit'
        required: true
        type: string
      public_launch:
        description: 'Enable public indexing after this deployment'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: write
  issues: write

concurrency:
  group: jurvio-public-web
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm == 'DEPLOY')
      }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 60
    environment: production
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/savedlead/jurvio:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENABLE_PUBLIC_INDEXING: ${{ github.event_name == 'workflow_dispatch' && inputs.public_launch && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Require current main and successful CI
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$TARGET_SHA" = "$current" || {
            echo "::error::This run is not the current main commit ($current)."
            exit 1
          }
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&status=completed&per_page=20"             --jq '[.workflow_runs[] | select(.conclusion=="success")][0].conclusion // empty')"
          test "$conclusion" = success || {
            echo "::error::Current main does not have a successful CI run."
            exit 1
          }

      - name: Open temporary /32 SSH access
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          public="$(jq -c '[.droplets[] | select(.name=="jurvio-public-01")][0] // empty' <<<"$droplets")"
          test -n "$public"
          public_id="$(jq -r .id <<<"$public")"
          public_ip="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$public")"
          firewalls="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200")"
          firewall_id="$(jq -r --argjson id "$public_id" '[.firewalls[] | select((.droplet_ids // []) | index($id))][0].id // empty' <<<"$firewalls")"
          test -n "$firewall_id" && test -n "$public_ip"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          runner_cidr="$runner_ip/32"
          {
            echo "PUBLIC_IP=$public_ip"
            echo "FIREWALL_ID=$firewall_id"
            echo "RUNNER_CIDR=$runner_cidr"
          } >> "$GITHUB_ENV"
          rule="$(jq -n --arg src "$runner_cidr" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
          curl -fsS -X POST "${auth[@]}" "$api/firewalls/$firewall_id/rules" -d "$rule" >/dev/null
          gh issue comment 426 --repo "$GITHUB_REPOSITORY"             --body '2.6 deploy fallback: temporary /32 SSH route opened to jurvio-public-01.'

      - name: Configure ephemeral SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          cat > ~/.ssh/config <<EOF
          Host public-web
            HostName $PUBLIC_IP
            User root
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 120
            TCPKeepAlive yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          ssh public-web true

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate build runner to image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish current main image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate public server to image registry
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | ssh public-web 'docker login ghcr.io -u SavedLead --password-stdin'

      - name: Replace public app container
        run: |
          set -euo pipefail
          scp docker-compose.public.yml public-web:/opt/jurvio/docker-compose.public.yml
          ssh public-web bash -s -- "${IMAGE,,}" "$ENABLE_PUBLIC_INDEXING" <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          test -s .env.production
          test -s docker-compose.public.yml

          if [ "$2" = "true" ]; then
            env_tmp="$(mktemp)"
            grep -v '^JURVIO_PUBLIC_LAUNCH=' .env.production > "$env_tmp" || true
            printf '%s\n' 'JURVIO_PUBLIC_LAUNCH=true' >> "$env_tmp"
            chmod 600 "$env_tmp"
            mv "$env_tmp" .env.production
            echo "Public indexing launch switch enabled."
          fi

          current_id="$(JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml ps -q app 2>/dev/null || true)"
          test -n "$current_id" || { echo "::error::current public app container was not found"; exit 1; }
          previous_image="$(docker inspect -f '{{.Config.Image}}' "$current_id")"
          test -n "$previous_image"
          docker image inspect "$previous_image" >/dev/null
          umask 077
          printf '%s\n' "$previous_image" > .previous-public-image
          echo "Rollback target recorded: $previous_image"

          docker pull "$1"
          docker run --rm --env-file .env.production "$1" node scripts/migrate.mjs
          JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml up -d --no-deps app
          app_id="$(JURVIO_IMAGE="$1" docker compose -f docker-compose.public.yml ps -q app)"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$app_id")" = healthy ] && break
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$app_id")" = healthy ]
          local_robots="$(curl -fsS -H 'Host: jurvio.com' http://127.0.0.1:3000/robots.txt)"
          if grep -Eq '^JURVIO_PUBLIC_LAUNCH=true$' .env.production; then
            printf '%s' "$local_robots" | grep -Fq 'Allow: /'
            printf '%s' "$local_robots" | grep -Fq 'Sitemap: https://jurvio.com/sitemap.xml'
          else
            printf '%s' "$local_robots" | grep -Fq 'Disallow: /'
          fi
          rollback_image="$(cat .previous-public-image)"
          test -n "$rollback_image"
          docker image inspect "$rollback_image" >/dev/null
          printf 'ROLLBACK_READY=%s\n' "$rollback_image"
          REMOTE
          gh issue comment 426 --repo "$GITHUB_REPOSITORY" \
            --body '1.5 rollback readiness: previous public image recorded and retained locally; new container health and noindex verified.'

      - name: Verify public and private boundaries externally
        run: |
          set -euo pipefail
          robots_body="$(curl -fsS --retry 12 --retry-delay 5 --max-time 30 https://jurvio.com/robots.txt)"
          if printf '%s' "$robots_body" | grep -Fq 'Sitemap: https://jurvio.com/sitemap.xml'; then
            printf '%s' "$robots_body" | grep -Fq 'Allow: /'
            indexing_status="enabled"
            if curl -fsSI --retry 5 --retry-delay 2 --max-time 30 https://jurvio.com/ |
              tr -d '\r' | grep -Fiq 'x-robots-tag: noindex'; then
              echo "::error::Homepage still sends an X-Robots-Tag noindex header."
              exit 1
            fi
          else
            printf '%s' "$robots_body" | grep -Fq 'Disallow: /'
            indexing_status="disabled"
          fi
          echo "INDEXING_STATUS=$indexing_status" >> "$GITHUB_ENV"
          login_body="$(curl -fsS --retry 12 --retry-delay 5 --max-time 30 https://z.jurvio.com/login)"
          printf '%s' "$login_body" | grep -Fiq 'PRIVATE COMMAND CENTER'
          public_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://jurvio.com/login)"
          test "$public_status" = 404
          gh issue comment 426 --repo "$GITHUB_REPOSITORY"             --body "2.6 deploy fallback: current main deployed to jurvio.com; indexing $indexing_status and public/private route boundaries verified."

      - name: Verify launch routes and performance
        run: |
          set -euo pipefail
          results="$(mktemp)"
          trap 'rm -f "$results"' EXIT

          check_route() {
            name="$1"
            url="$2"
            limit="$3"
            metrics="$(curl -sS -o /dev/null --retry 2 --retry-delay 2 --max-time 30 \
              -w '%{http_code} %{time_starttransfer} %{time_total}' "$url")"
            read -r code ttfb total <<<"$metrics"
            printf '%s|%s|%s|%s\n' "$name" "$code" "$ttfb" "$total" >> "$results"
            test "$code" = 200 || {
              echo "::error::$name returned HTTP $code"
              return 1
            }
            awk -v value="$total" -v ceiling="$limit" 'BEGIN { exit !(value <= ceiling) }' || {
              echo "::error::$name took ${total}s; launch ceiling is ${limit}s"
              return 1
            }
          }

          # Populate application/data caches after the container restart so the
          # timed checks represent visitor traffic, not one-time startup work.
          warm_route() {
            curl -fsS -o /dev/null --retry 2 --retry-delay 2 --max-time 45 "$1"
          }
          warm_route https://jurvio.com/
          warm_route https://jurvio.com/cases
          warm_route https://jurvio.com/coverage
          # Build the cached sitemap count before Googlebot reaches the new container.
          sitemap_index="$(curl -fsS --retry 2 --retry-delay 3 --max-time 120 https://jurvio.com/sitemap.xml)"
          printf '%s' "$sitemap_index" | grep -Fq '<sitemapindex'
          printf '%s' "$sitemap_index" | grep -Fq 'https://jurvio.com/sitemaps/static.xml'
          warm_route 'https://jurvio.com/search?q=Trump%20v.%20Slaughter'

          check_route Homepage https://jurvio.com/ 10
          check_route Cases https://jurvio.com/cases 10
          check_route Coverage https://jurvio.com/coverage 10
          check_route Sitemap https://jurvio.com/sitemap.xml 10
          check_route Search 'https://jurvio.com/search?q=Trump%20v.%20Slaughter' 15

          {
            echo '### Live health and performance gate'
            echo ''
            echo '| Route | HTTP | TTFB | Total |'
            echo '|---|---:|---:|---:|'
            while IFS='|' read -r name code ttfb total; do
              printf '| %s | %s | %ss | %ss |\n' "$name" "$code" "$ttfb" "$total"
            done < "$results"
          } >> "$GITHUB_STEP_SUMMARY"

          summary="$(while IFS='|' read -r name code ttfb total; do printf '%s: HTTP %s, %ss total; ' "$name" "$code" "$total"; done < "$results")"
          gh issue comment 426 --repo "$GITHUB_REPOSITORY" \
            --body "1.6/2.6 live gate passed. $summary Indexing is $INDEXING_STATUS."

      - name: Remove temporary SSH access
        if: always()
        run: |
          set +e
          api=https://api.digitalocean.com/v2
          if [ -n "${FIREWALL_ID:-}" ] && [ -n "${RUNNER_CIDR:-}" ]; then
            rule="$(jq -n --arg src "$RUNNER_CIDR" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$src]}}]}')"
            curl -fsS -X DELETE               -H "Authorization: Bearer $DO_TOKEN"               -H "Content-Type: application/json"               "$api/firewalls/$FIREWALL_ID/rules" -d "$rule"
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/config
          gh issue comment 426 --repo "$GITHUB_REPOSITORY"             --body "2.6 deploy fallback finished with status: **${{ job.status }}**. Temporary SSH rule removal attempted. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
