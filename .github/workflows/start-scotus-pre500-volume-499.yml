name: Start first pre-500 SCOTUS volume

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=START_SCOTUS_PRE500_VOLUME_499.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type START_SCOTUS_PRE500_VOLUME_499 to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-production-scotus-pre500-volume-499
  cancel-in-progress: false

jobs:
  ingest-publish:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 60
    steps:
      - name: Require confirm=START_SCOTUS_PRE500_VOLUME_499
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "START_SCOTUS_PRE500_VOLUME_499" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=START_SCOTUS_PRE500_VOLUME_499."
            exit 1
          fi
      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ingest verify publish and extract Volume 499
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$DO_USER@$DO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
          set -- $ids
          test "$#" -eq 1
          export JURVIO_IMAGE="$(docker inspect --format "{{.Config.Image}}" "$1")"
          compose="docker compose -f docker-compose.production.yml"
          timeout --foreground 35m $compose run --rm -T --no-deps app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/ingest-loc-us-reports-volume.mjs --volume=499 --limit=1000 --resume=true
          $compose exec -T app node jobs/publish-official-scotus-opinions.mjs --limit=10000
          $compose exec -T app env JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/extract-official-scotus-opinion-text.mjs --limit=1000
          REMOTE
