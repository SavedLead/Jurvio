name: Scout CourtListener people API (one-shot, read-only)

# Read-only recon of the CourtListener /people/ + /positions/ API to design the
# Article I (magistrate + bankruptcy) enrichment lane: how a judge record looks,
# whether/where a portrait is exposed (has_photo / thumbnail), how positions
# encode magistrate vs bankruptcy + court + termination, and how our stored cl_id
# maps to a person. Runs on the builder using the CL API token secret.
# No writes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-scout-courtlistener-people-once
  cancel-in-progress: false

jobs:
  scout:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    env:
      CL_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      BASE: https://www.courtlistener.com/api/rest/v4
    steps:
      - name: Probe people + positions
        run: |
          set -uo pipefail
          auth=( -H "Authorization: Token $CL_TOKEN" -H "User-Agent: Jurvio/1.0" )

          echo "=== A) person search by name (Alan Trust — bankruptcy, EDNY) ==="
          curl -s "${auth[@]}" "$BASE/people/?name_last=Trust&name_first=Alan" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("count", d.get("count")); r=(d.get("results") or [{}])[0]; print(json.dumps({k:r.get(k) for k in ["id","name_first","name_last","fjc_id","has_photo","date_dob","slug","positions","thumbnail","photo"]}, indent=1))' 2>&1 | head -40

          echo ""
          echo "=== B) raw keys available on a person record ==="
          curl -s "${auth[@]}" "$BASE/people/?name_last=Trust&name_first=Alan" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); r=(d.get("results") or [{}])[0]; print(sorted(r.keys()))' 2>&1 | head -10

          echo ""
          echo "=== C) positions for that person (magistrate/bankruptcy + court + termination) ==="
          pid=$(curl -s "${auth[@]}" "$BASE/people/?name_last=Trust&name_first=Alan" | python3 -c 'import sys,json; d=json.load(sys.stdin); r=(d.get("results") or [{}])[0]; print(r.get("id",""))')
          echo "person id: $pid"
          curl -s "${auth[@]}" "$BASE/positions/?person=$pid" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("count",d.get("count")); [print(json.dumps({k:p.get(k) for k in ["position_type","court","date_start","date_termination","how_selected"]})) for p in (d.get("results") or [])[:6]]' 2>&1 | head -30

          echo ""
          echo "=== D) does our stored cl_id resolve? try id + fjc_id lookups for 'fjc-bk-4' style ==="
          echo "-- /people/?fjc_id=4 --"
          curl -s "${auth[@]}" "$BASE/people/?fjc_id=4" | head -c 400; echo
          echo "-- /people/?id=4 --"
          curl -s "${auth[@]}" "$BASE/people/?id=4" | python3 -c 'import sys,json; d=json.load(sys.stdin); r=(d.get("results") or [{}])[0]; print(r.get("name_first"),r.get("name_last"),"has_photo=",r.get("has_photo"))' 2>&1 | head -3

          echo ""
          echo "=== E) portrait URL convention (free.law portraits) for a person with has_photo ==="
          echo "If has_photo is true, portraits are at https://portraits.free.law/v2/<id>-<slug>.256.jpeg (to be confirmed by the fields above)."
