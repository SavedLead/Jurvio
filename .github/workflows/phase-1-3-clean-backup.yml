name: Phase 1.3 clean production backup

# Keeps a fresh recovery point independent of deploys. Because ordinary app-only
# releases now skip the slow pre-release backup (see scripts/release-production.sh),
# this scheduled job guarantees the database is backed up at least nightly. Runs on
# the box over the private VPC and reuses the same backup-production.sh the release
# uses (compressed pg_dump, retains the last few on the box).
#
# The dump is then copied to ENCRYPTED OFF-DROPLET object storage. An on-box dump
# alone is a release-rollback aid, not disaster recovery: it dies with the box.
# docs/38-production-readiness-checklist.md makes the off-site copy plus a
# successful restore test a precondition of public launch. The restore rehearsal
# that reads these objects back is verify-backup-restore.yml.
#
# Note on `ssh host bash -s <<'REMOTE'`: the remote script arrives on stdin, so any
# command inside it that drains stdin consumes the script's own remaining lines.
# That is not hypothetical -- it silently truncated this workflow on 2026-09-09.
# Hence `< /dev/null` on remote commands here, and the dump path is carried by a
# step output on the runner rather than a file on the box, so a truncated remote
# script fails loudly instead of appearing to succeed.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=PHASE_1_3_CLEAN_BACKUP.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PHASE_1_3_CLEAN_BACKUP to run this workflow against production"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: jurvio-phase-1-3-clean-backup-v4
  cancel-in-progress: false

jobs:
  backup:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 90
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require confirm=PHASE_1_3_CLEAN_BACKUP
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PHASE_1_3_CLEAN_BACKUP" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=PHASE_1_3_CLEAN_BACKUP."
            exit 1
          fi
      - name: Install GitHub REST helpers (builder-01 has no gh CLI)
        if: always()
        run: |
          # jurvio-builder-01 has curl and jq but no gh CLI. These helpers replace the
          # gh calls this workflow used. Issue comments and report updates are best
          # effort and never fail the job; reads used for decisions still fail loudly.
          cat > "$RUNNER_TEMP/gh-rest.sh" <<'GHREST'
          _gh_curl() {
            local method="$1" path="$2"; shift 2
            curl -fsSL --retry 3 --retry-delay 2 -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN is not set}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" "https://api.github.com/${path#/}"
          }
          gh_api() { _gh_curl GET "$1"; }
          gh_api_post() {
            if [ $# -ge 2 ]; then printf '%s' "$2" | _gh_curl POST "$1" -H "Content-Type: application/json" --data-binary @-
            else _gh_curl POST "$1"; fi
          }
          # Every page of a list endpoint, one JSON document per page (pipe into jq).
          gh_api_paginate() {
            local path="$1" page=1 sep body count
            case "$path" in *\?*) sep='&' ;; *) sep='?' ;; esac
            while [ "$page" -le 50 ]; do
              body="$(gh_api "${path}${sep}page=${page}")" || return 1
              printf '%s\n' "$body"
              count="$(jq '(if type == "array" then . else ([.[] | arrays] | .[0] // []) end) | length' <<<"$body")"
              [ "${count:-0}" -gt 0 ] || break
              page=$((page + 1))
            done
          }
          gh_patch_body() {
            jq -n --arg body "$2" '{body: $body}' \
              | _gh_curl PATCH "$1" -H "Content-Type: application/json" --data-binary @- \
              || { echo "::warning::GitHub update of $1 failed (non-fatal)" >&2; return 0; }
          }
          # Run status goes to the job summary and a run annotation, never to an issue
          # comment or a new issue: GitHub emails the issue author for every one.
          status_note() {
            local body="$1" level=notice line
            case "$body" in *failure*|*cancelled*|*FAIL*) level=warning ;; esac
            printf '%s\n\n' "$body" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            line="${body%%$'\n'*}"; line="${line//'%'/%25}"
            echo "::${level}::${line}"
          }
          # status_report TITLE BODY (BODY may contain literal \n sequences)
          status_report() {
            local level=notice title="${1//'%'/%25}"
            case "$1" in *failure*|*cancelled*|*FAIL*) level=warning ;; esac
            printf '### %s\n\n%b\n\n' "$1" "$2" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::${level} title=Run status::${title}"
          }
          # gh_dispatch WORKFLOW REF key=value ...
          gh_dispatch() {
            local wf="$1" ref="$2"; shift 2
            local inputs='{}' kv
            for kv in "$@"; do inputs="$(jq -c --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k): $v}' <<<"$inputs")"; done
            jq -n --arg ref "$ref" --argjson inputs "$inputs" '{ref: $ref, inputs: $inputs}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/dispatches" -H "Content-Type: application/json" --data-binary @- >/dev/null
          }
          export -f _gh_curl gh_api gh_api_post gh_api_paginate gh_patch_body status_note status_report gh_dispatch
          GHREST
      - name: Configure SSH
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
          status_note '1.3 backup: `█░░░░░░░░░ 10%` Builder acquired; private-VPC SSH configured.'

      - name: Run compressed database backup on the box
        id: dump
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set -euo pipefail
          out="$(ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          test -x scripts/backup-production.sh || { echo "::error::backup script missing on box"; exit 1; }
          # </dev/null so nothing inside the script can drain -- and thereby eat --
          # the rest of THIS script, which bash is reading from stdin.
          backup_path="$(scripts/backup-production.sh </dev/null | tail -1)"
          test -s "$backup_path" || { echo "::error::backup script produced no file"; exit 1; }
          echo "=== backups on box (newest first) ==="
          ls -lh backups/ | head -6
          # Last line, and the only one the runner parses.
          printf 'BACKUP_PATH=%s\n' "$backup_path"
          REMOTE
          )"
          printf '%s\n' "$out"

          path="$(printf '%s\n' "$out" | sed -n 's/^BACKUP_PATH=//p' | tail -1)"
          # If the remote script were truncated (see the header note), the marker
          # would be missing while ssh still exited 0. Refuse to call that a backup.
          test -n "$path" || {
            echo "::error::the remote backup step finished without reporting a dump path — its script was truncated or the dump did not complete"
            exit 1
          }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          status_note "1.3 backup: \`██████░░░░ 55%\` Database dump completed and gzip verified: $path"

      - name: Copy the dump to encrypted off-site storage
        env:
          BACKUP_PATH: ${{ steps.dump.outputs.path }}
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s -- "$BACKUP_PATH" <<'REMOTE'
          set -euo pipefail
          backup_path="$1"
          cd /opt/jurvio
          test -s "$backup_path" || { echo "::error::dump $backup_path is missing on the box"; exit 1; }
          test -s .env.production || { echo "::error::.env.production missing on box"; exit 1; }

          # JURVIO_IMAGE is never persisted on the box (release-production.sh passes
          # it at deploy time), so derive the exact production tag from the running
          # app container rather than requiring the variable — requiring it is what
          # broke every nightly backup between at least 2026-08-19 and 2026-09-07.
          image="$(docker inspect -f '{{.Config.Image}}' \
            "$(docker ps --filter 'label=com.docker.compose.project=jurvio' \
                         --filter 'label=com.docker.compose.service=app' \
                         --format '{{.ID}}' | head -n1)")"
          test -n "$image" || { echo "::error::could not resolve the running app image"; exit 1; }

          # Run as the invoking user so the container can read the mode-600 dump
          # owned by the deployment account. Read-only mount: the uploader never
          # writes to the backup directory.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env-file .env.production \
            -v /opt/jurvio/backups:/backups:ro \
            "$image" \
            node jobs/upload-database-backup.mjs --file "/backups/$(basename "$backup_path")" </dev/null
          REMOTE
          status_note '1.3 backup: `████████░░ 80%` Encrypted off-site upload completed.'

      - name: Confirm an off-site recovery point exists
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          image="$(docker inspect -f '{{.Config.Image}}' \
            "$(docker ps --filter 'label=com.docker.compose.project=jurvio' \
                         --filter 'label=com.docker.compose.service=app' \
                         --format '{{.ID}}' | head -n1)")"
          # Cheap freshness gate: the newest off-site object must exist, be
          # non-empty, and be younger than the nightly cadence. Pulling multiple
          # gigabytes back down every night would be wasteful, so the full
          # decrypt-and-restore rehearsal runs weekly (verify-backup-restore.yml).
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env-file .env.production \
            "$image" \
            node jobs/verify-database-backup.mjs --head-only --max-age-hours 36 </dev/null
          REMOTE
      - name: Record phase receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_STATUS: ${{ job.status }}
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          status_note "1.3 backup finished with status: **$GATE_STATUS**. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          status_report "Phase 1.3 backup [$GATE_STATUS]" "Status: **$GATE_STATUS**\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nRecorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
