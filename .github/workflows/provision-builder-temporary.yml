name: Finalize Jurvio builder security (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Attach existing builder and firewall
        shell: bash
        run: |
          set -euo pipefail
          droplet_id=$(curl --fail --silent --show-error --header "Authorization: Bearer $DO_TOKEN" "https://api.digitalocean.com/v2/droplets?name=jurvio-builder-01" | jq -r '.droplets[0].id // empty')
          test -n "$droplet_id"
          jq -n --arg resource "do:droplet:$droplet_id" '{resources:[$resource]}' > project.json
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $DO_TOKEN" --header "Content-Type: application/json" "https://api.digitalocean.com/v2/projects/71f13689-d3ce-43d8-9ec1-c58215514a0a/resources" --data-binary @project.json >/dev/null
          existing_fw=$(curl --fail --silent --show-error --header "Authorization: Bearer $DO_TOKEN" "https://api.digitalocean.com/v2/firewalls" | jq -r '.firewalls[] | select(.name=="jurvio-builder-01-firewall") | .id' | head -1)
          if [ -z "$existing_fw" ]; then
            jq -n --argjson droplet_id "$droplet_id" '{name:"jurvio-builder-01-firewall",droplet_ids:[$droplet_id],inbound_rules:[],outbound_rules:[{protocol:"tcp",ports:"all",destinations:{addresses:["0.0.0.0/0","::/0"]}},{protocol:"udp",ports:"all",destinations:{addresses:["0.0.0.0/0","::/0"]}},{protocol:"icmp",destinations:{addresses:["0.0.0.0/0","::/0"]}}]}' > firewall.json
            curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $DO_TOKEN" --header "Content-Type: application/json" "https://api.digitalocean.com/v2/firewalls" --data-binary @firewall.json >/dev/null
          fi
          echo "Builder attached to project with zero inbound firewall rules."
