name: Provision public web server once

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=PROVISION_PUBLIC_WEB.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROVISION_PUBLIC_WEB to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-provision-public-web-once
  cancel-in-progress: false

jobs:
  provision:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      CURRENT_HOST: ${{ secrets.DO_HOST }}
      SERVER_NAME: jurvio-public-01
      REPLACE_DROPLET_ID: "590270408"
    steps:
      - name: Require confirm=PROVISION_PUBLIC_WEB
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PROVISION_PUBLIC_WEB" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=PROVISION_PUBLIC_WEB."
            exit 1
          fi
      - name: Create isolated Jurvio public web droplet
        id: create
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")

          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          target="$(jq -c --argjson id "$REPLACE_DROPLET_ID" '.droplets[]? | select(.id==$id)' <<<"$droplets" | head -1)"
          if [ -n "$target" ]; then
            [ "$(jq -r .name <<<"$target")" = "$SERVER_NAME" ] || { echo "::error::Refusing to delete: droplet ID name mismatch"; exit 1; }
            jq -e '(.tags // []) | index("jurvio-public-web")' <<<"$target" >/dev/null || { echo "::error::Refusing to delete: target lacks jurvio-public-web tag"; exit 1; }
            curl -fsS -X DELETE "${auth[@]}" "$api/droplets/$REPLACE_DROPLET_ID"
            for _ in $(seq 1 60); do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$api/droplets/$REPLACE_DROPLET_ID")"
              [ "$status" = 404 ] && break
              sleep 5
            done
            [ "$status" = 404 ] || { echo "::error::Replacement target was not deleted within timeout"; exit 1; }
            droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          fi
          current="$(jq -c --arg host "$CURRENT_HOST" --arg server "$SERVER_NAME" '
            ([.droplets[] | select(any(.networks.v4[]?; .ip_address == $host))][0]) //
            ([.droplets[]
              | select(.name != $server and .name != "jurvio-builder-01")
              | select((.tags // []) | index("jurvio"))
            ] | sort_by(.memory) | reverse | .[0]) //
            ([.droplets[]
              | select(.name != $server and .name != "jurvio-builder-01")
              | select(.size.slug == "s-4vcpu-8gb")
            ][0]) //
            empty
          ' <<<"$droplets")"
          test -n "$current" || {
            echo "::error::Jurvio ingestion droplet was not found by configured IP, Jurvio tag, or approved 4 vCPU/8 GB size"
            exit 1
          }
          region="$(jq -r '.region.slug' <<<"$current")"
          vpc="$(jq -r '.vpc_uuid' <<<"$current")"
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          deployment_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519)"
          ssh_keys="$(curl -fsS "${auth[@]}" "$api/account/keys?per_page=200")"
          ssh_key="$(jq -r --arg key "$deployment_public_key" '.ssh_keys[] | select((.public_key | split(" ")[0:2] | join(" ")) == ($key | split(" ")[0:2] | join(" "))) | .id' <<<"$ssh_keys" | head -1)"
          if [ -z "$ssh_key" ] || [ "$ssh_key" = null ]; then
            key_suffix="$(printf '%s' "$deployment_public_key" | sha256sum | cut -c1-12)"
            key_payload="$(jq -n --arg name "jurvio-deployment-$key_suffix" --arg public_key "$deployment_public_key" '{name:$name,public_key:$public_key}')"
            ssh_key="$(curl -fsS -X POST "${auth[@]}" -d "$key_payload" "$api/account/keys" | jq -r '.ssh_key.id')"
          fi
          test -n "$ssh_key" && test "$ssh_key" != null || { echo "::error::Could not resolve or register the Jurvio deployment SSH key"; exit 1; }

          existing="$(curl -fsS "${auth[@]}" "$api/droplets?tag_name=jurvio-public-web&per_page=200" | jq -c --arg n "$SERVER_NAME" '.droplets[]? | select(.name == $n)' | head -1)"
          if [ -n "$existing" ]; then
            droplet="$existing"
            created=false
          else
            user_data='#!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl nginx
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          mkdir -p /opt/jurvio
          systemctl enable --now docker nginx
          touch /var/lib/jurvio-web-bootstrap-complete'
            payload="$(jq -n               --arg name "$SERVER_NAME"               --arg region "$region"               --arg vpc "$vpc"               --argjson key "$ssh_key"               --arg user_data "$user_data"               '{name:$name,region:$region,size:"s-2vcpu-4gb",image:"ubuntu-24-04-x64",vpc_uuid:$vpc,ssh_keys:[$key],tags:["jurvio","jurvio-public-web"],monitoring:true,ipv6:false,backups:false,user_data:$user_data}')"
            droplet="$(curl -fsS -X POST "${auth[@]}" -d "$payload" "$api/droplets" | jq -c '.droplet')"
            created=true
          fi

          id="$(jq -r '.id' <<<"$droplet")"
          for _ in $(seq 1 60); do
            droplet="$(curl -fsS "${auth[@]}" "$api/droplets/$id" | jq -c '.droplet')"
            [ "$(jq -r '.status' <<<"$droplet")" = active ] && break
            sleep 5
          done
          [ "$(jq -r '.status' <<<"$droplet")" = active ] || { echo "::error::Droplet did not become active"; exit 1; }

          public_ip="$(jq -r '.networks.v4[] | select(.type=="public") | .ip_address' <<<"$droplet" | head -1)"
          private_ip="$(jq -r '.networks.v4[] | select(.type=="private") | .ip_address' <<<"$droplet" | head -1)"

          firewall="$(curl -fsS "${auth[@]}" "$api/firewalls?per_page=200" | jq -r '.firewalls[]? | select(.name=="jurvio-public-web-bootstrap") | .id' | head -1)"
          if [ -z "$firewall" ]; then
            fw_payload="$(jq -n --argjson id "$id" '{
              name:"jurvio-public-web-bootstrap",
              droplet_ids:[$id],
              inbound_rules:[],
              outbound_rules:[
                {protocol:"tcp",ports:"all",destinations:{addresses:["0.0.0.0/0","::/0"]}},
                {protocol:"udp",ports:"all",destinations:{addresses:["0.0.0.0/0","::/0"]}},
                {protocol:"icmp",destinations:{addresses:["0.0.0.0/0","::/0"]}}
              ]
            }')"
            curl -fsS -X POST "${auth[@]}" -d "$fw_payload" "$api/firewalls" >/dev/null
          fi

          project_id="$(curl -fsS "${auth[@]}" "$api/projects?per_page=200" | jq -r '.projects[] | select(.is_default==true) | .id' | head -1)"
          if [ -n "$project_id" ]; then
            curl -fsS -X POST "${auth[@]}" -d "$(jq -n --arg urn "do:droplet:$id" '{resources:[$urn]}')" "$api/projects/$project_id/resources" >/dev/null || true
          fi

          {
            echo "### Jurvio public web server provisioned"
            echo "- Name: $SERVER_NAME"
            echo "- Droplet ID: $id"
            echo "- Public IP: $public_ip"
            echo "- Private IP: $private_ip"
            echo "- Created in this run: $created"
            echo "- Firewall: zero inbound ports during bootstrap"
            echo "- Size: 2 vCPU, 4 GB RAM, 80 GB disk (\$24/month)"
          } >> "$GITHUB_STEP_SUMMARY"

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Infrastructure report: Jurvio public web server provisioned" \
            --body "Provisioning completed for ${SERVER_NAME} (droplet ${id}). Public IP: ${public_ip}; private IP: ${private_ip}. The bootstrap firewall has zero inbound ports. Next step: private deployment and verification before any DNS change."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
