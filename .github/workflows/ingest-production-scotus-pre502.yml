name: SCOTUS Assembly X-Ray
# Immediate production probe trigger: 2026-08-02 06:02 ET.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=INGEST_PRODUCTION_SCOTUS_PRE502.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INGEST_PRODUCTION_SCOTUS_PRE502 to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-scotus-xray
  cancel-in-progress: true

jobs:
  report:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Require confirm=INGEST_PRODUCTION_SCOTUS_PRE502
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "INGEST_PRODUCTION_SCOTUS_PRE502" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=INGEST_PRODUCTION_SCOTUS_PRE502."
            exit 1
          fi
      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read live coordinator state
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail
          ssh "$DO_USER@$DO_HOST" 'bash -s' > live-state.txt <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          app_id="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}" | head -n1)"
          worker_id="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=worker" --format "{{.ID}}" | head -n1)"
          postgres_id="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=postgres" --format "{{.ID}}" | head -n1)"
          test -n "$app_id"
          test -n "$worker_id"
          test -n "$postgres_id"
          APP_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$app_id")"
          WORKER_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$worker_id")"
          printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
          printf 'WORKER_IMAGE=%s\n' "$WORKER_IMAGE"

          # Do not call Docker Compose here. Compose interpolation can fail before
          # exec and previously hid the exact scheduler/coordinator failure.
          printf '%s\n' 'STATE_BEGIN'
          if ! state="$(docker exec "$worker_id" sh -c 'cat /var/lib/jurvio/artifacts/scheduler/scotus-pre500/status.json' 2>/tmp/scotus-xray-state.err)"; then
            printf '{"status":"probe-error","pendingVolumes":[],"completedVolumes":[],"failedVolumes":[]}'
          else
            printf '%s' "$state"
          fi
          printf '\n%s\n' 'STATE_END'

          printf '%s\n' 'FAILURES_BEGIN'
          if ! failures="$(docker exec "$worker_id" sh -c 'for f in /var/lib/jurvio/artifacts/scheduler/scotus-pre500/*.failed.json; do test -f "$f" && cat "$f"; done' 2>/tmp/scotus-xray-failures.err)"; then
            printf '[]'
          else
            printf '%s' "$failures"
          fi
          printf '\n%s\n' 'FAILURES_END'

          printf '%s\n' 'TOTALS_BEGIN'
          if ! totals="$(docker exec "$postgres_id" psql -U jurvio -d jurvio -Atc "SELECT json_build_object('published_cases',(SELECT count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND legal_case.publication='published'),'published_documents',(SELECT count(*) FROM document JOIN judicial_opinion ON judicial_opinion.document_id=document.id JOIN opinion_cluster ON opinion_cluster.id=judicial_opinion.cluster_id JOIN legal_case ON legal_case.id=opinion_cluster.case_id JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND document.publication='published'),'pending_candidates',(SELECT count(*) FROM official_opinion_candidate WHERE review_status='pending_review'),'readable_documents',(SELECT count(*) FROM document_content JOIN document ON document.id=document_content.document_id JOIN legal_case ON legal_case.id=document.case_id JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND document.publication='published'));" 2>/tmp/scotus-xray-totals.err)"; then
            printf '{}'
          else
            printf '%s' "$totals"
          fi
          printf '\n%s\n' 'TOTALS_END'

          # The report stays internal and redacts URLs and secret-like values.
          printf '%s\n' 'DIAGNOSTICS_BEGIN'
          {
            printf '%s\n' '[scheduler + coordinator tail]'
            docker exec "$worker_id" sh -c 'tail -c 6144 /var/lib/jurvio/artifacts/scheduler/scotus-pre500-backfill.log 2>/dev/null || true; tail -c 6144 /var/lib/jurvio/artifacts/scheduler/scotus-pre500/*.attempt-*.log 2>/dev/null || true'
            docker logs --tail 100 "$worker_id"
            cat /tmp/scotus-xray-state.err /tmp/scotus-xray-failures.err /tmp/scotus-xray-totals.err 2>/dev/null || true
          } 2>&1 | tail -c 6144 | sed -E -e 's#https?://[^[:space:]"'"'"'<>]+#<url>#g' -e 's#(DATABASE_URL|PASSWORD|TOKEN|SECRET|AUTHORIZATION|COOKIE)[=:][^[:space:]]+#\1=<redacted>#gI'
          printf '\n%s\n' 'DIAGNOSTICS_END'
          REMOTE

          node <<'NODE'
          const fs = require('node:fs');
          const input = fs.readFileSync('live-state.txt', 'utf8');
          const field = (name) => input.match(new RegExp(`^${name}=(.*)$`, 'm'))?.[1] ?? 'unresolved';
          const section = (name) => input.match(new RegExp(`${name}_BEGIN\\n([\\s\\S]*?)\\n${name}_END`))?.[1]?.trim();
          const state = JSON.parse(section('STATE') || '{}');
          const totals = JSON.parse(section('TOTALS') || '{}');
          const failures = section('FAILURES') || '[]';
          const diagnostics = section('DIAGNOSTICS') || 'no diagnostic output captured';
          const completed = Array.isArray(state.completedVolumes) ? state.completedVolumes : [];
          const failed = Array.isArray(state.failedVolumes) ? state.failedVolumes : [];
          const pending = Array.isArray(state.pendingVolumes) ? state.pendingVolumes : [];
          const values = {
            APP_IMAGE: field('APP_IMAGE'),
            WORKER_IMAGE: field('WORKER_IMAGE'),
            COORDINATOR_STATUS: state.status || 'unknown',
            COORDINATOR_UPDATED_AT: state.updatedAt || 'not-yet-written',
            NEWEST: String(state.newestVolume ?? 499),
            OLDEST: String(state.oldestVolume ?? 477),
            WORKERS: String(state.volumeWorkers ?? 8),
            COMPLETED_COUNT: String(completed.length),
            COMPLETED_LIST: completed.join(','),
            FAILED_COUNT: String(failed.length),
            FAILED_LIST: failed.join(','),
            PENDING_COUNT: String(pending.length),
            PENDING_LIST: pending.join(','),
            TOTALS: JSON.stringify(totals),
            FAILURES_B64: Buffer.from(failures).toString('base64'),
            DIAGNOSTICS_B64: Buffer.from(diagnostics).toString('base64'),
          };
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Update X-Ray comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_COMMENT_ID: "5133453027"
        run: |
          set -euo pipefail
          if [ "$APP_IMAGE" = "$WORKER_IMAGE" ]; then IMAGE_MATCH="yes"; else IMAGE_MATCH="NO"; fi
          FAILURES="$(printf '%s' "$FAILURES_B64" | base64 --decode)"
          DIAGNOSTICS="$(printf '%s' "$DIAGNOSTICS_B64" | base64 --decode)"
          BODY="$(printf '### SCOTUS Assembly X-Ray\n\n- Coordinator: **%s**\n- App image: `%s`\n- Worker image: `%s`\n- Images match: **%s**\n- Range: Volumes `%s → %s`\n- Concurrent volume workers: **%s**\n- Completed volumes: **%s** [%s]\n- Pending volumes: **%s** [%s]\n- Failed volumes: **%s** [%s]\n- Coordinator updated: `%s`\n- X-Ray checked: `%s`\n- Run: %s/%s/actions/runs/%s\n\nLive funnel:\n\n```json\n%s\n```\n\nSaved coordinator failure records:\n\n```json\n%s\n```\n\nSanitized scheduler/coordinator diagnostics:\n\n```text\n%s\n```' \
            "$COORDINATOR_STATUS" "$APP_IMAGE" "$WORKER_IMAGE" "$IMAGE_MATCH" "$NEWEST" "$OLDEST" "$WORKERS" \
            "$COMPLETED_COUNT" "$COMPLETED_LIST" "$PENDING_COUNT" "$PENDING_LIST" "$FAILED_COUNT" "$FAILED_LIST" \
            "$COORDINATOR_UPDATED_AT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TOTALS" "${FAILURES:-[]}" "${DIAGNOSTICS:-no diagnostic output captured}")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$REPORT_COMMENT_ID" --raw-field body="$BODY"