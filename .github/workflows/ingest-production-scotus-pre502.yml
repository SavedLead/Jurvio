name: Ingest pre-502 SCOTUS cases

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ingest-production-scotus-pre502.yml"
  workflow_dispatch:
    inputs:
      newest_volume:
        description: Newest U.S. Reports volume
        required: true
        default: "501"
      oldest_volume:
        description: Oldest U.S. Reports volume
        required: true
        default: "498"
      resume:
        description: Resume from durable volume checkpoints
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-production-scotus-pre502
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - name: Validate range
        env:
          NEWEST: ${{ inputs.newest_volume || '501' }}
          OLDEST: ${{ inputs.oldest_volume || '498' }}
          RESUME: ${{ github.event_name == 'push' && 'false' || inputs.resume }}
        run: |
          set -euo pipefail
          test "$NEWEST" -ge 2
          test "$NEWEST" -le 501
          test "$OLDEST" -ge 2
          test "$OLDEST" -le "$NEWEST"
          test $((NEWEST - OLDEST + 1)) -le 25
          test "$RESUME" = "true" || test "$RESUME" = "false"
          printf 'NEWEST=%s\nOLDEST=%s\nRESUME=%s\n' "$NEWEST" "$OLDEST" "$RESUME" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve deployed image containing the pre-502 job
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 60); do
            JURVIO_IMAGE="$(ssh "$DO_USER@$DO_HOST" '
              ids="$(docker ps --filter "label=com.docker.compose.project=jurvio" --filter "label=com.docker.compose.service=app" --format "{{.ID}}")"
              set -- $ids
              test "$#" -eq 1
              docker inspect --format "{{.Config.Image}}" "$1"
            ' 2>/dev/null || true)"
            if [ "$JURVIO_IMAGE" = "ghcr.io/savedlead/jurvio:$EXPECTED_SHA" ] && ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app test -f /app/jobs/ingest-loc-us-reports-volume.mjs" 2>/dev/null; then
              printf 'JURVIO_IMAGE=%s\n' "$JURVIO_IMAGE" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the deployed pre-502 ingestion job"
          exit 1

      - name: Ingest newest-to-oldest and drain continuously
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -uo pipefail
          RESULT_DIR="$(mktemp -d)"
          trap 'rm -rf "$RESULT_DIR"' EXIT
          run_volume() {
            VOLUME="$1"
            if ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env RAW_ARTIFACT_DIR=/var/lib/jurvio/artifacts JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/ingest-loc-us-reports-volume.mjs --volume='$VOLUME' --limit=1000 --resume='$RESUME'" > "$RESULT_DIR/$VOLUME.log" 2>&1; then
              : > "$RESULT_DIR/$VOLUME.ok"
              echo "::notice title=Pre-502 Volume $VOLUME::staged successfully"
            else
              : > "$RESULT_DIR/$VOLUME.failed"
              echo "::warning title=Pre-502 Volume $VOLUME::isolated and skipped; older volumes continue"
            fi
          }
          export -f run_volume
          export DO_USER DO_HOST JURVIO_IMAGE RESULT_DIR RESUME
          seq "$NEWEST" -1 "$OLDEST" | xargs -P 4 -n 1 bash -c 'run_volume "$1"' _ &
          INGEST_PID=$!
          while kill -0 "$INGEST_PID" 2>/dev/null; do
            if ! ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit=10000"; then
              echo "::warning title=SCOTUS publication drain::heartbeat failed; ingestion continues and final drain will retry"
            fi
            if ! ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/extract-official-scotus-opinion-text.mjs --limit=10000"; then
              echo "::warning title=SCOTUS text drain::heartbeat failed; ingestion continues and final drain will retry"
            fi
            sleep 30
          done
          wait "$INGEST_PID"
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app node jobs/publish-official-scotus-opinions.mjs --limit=10000"
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T app env JURVIO_ARTIFACT_ROOT=/var/lib/jurvio/artifacts node jobs/extract-official-scotus-opinion-text.mjs --limit=10000"
          for VOLUME in $(seq "$NEWEST" -1 "$OLDEST"); do
            echo "===== Volume $VOLUME ====="
            cat "$RESULT_DIR/$VOLUME.log"
          done
          COMPLETED_VOLUMES="$(find "$RESULT_DIR" -name '*.ok' -type f | wc -l)"
          FAILED_VOLUMES="$(find "$RESULT_DIR" -name '*.failed' -type f | wc -l)"
          COMPLETED_LIST="$(find "$RESULT_DIR" -name '*.ok' -type f -printf '%f\n' | sed 's/\.ok$//' | sort -rn | paste -sd, -)"
          FAILED_LIST="$(find "$RESULT_DIR" -name '*.failed' -type f -printf '%f\n' | sed 's/\.failed$//' | sort -rn | paste -sd, -)"
          printf 'COMPLETED_VOLUMES=%s\nFAILED_VOLUMES=%s\nCOMPLETED_LIST=%s\nFAILED_LIST=%s\n' \
            "$COMPLETED_VOLUMES" "$FAILED_VOLUMES" "$COMPLETED_LIST" "$FAILED_LIST" >> "$GITHUB_ENV"

      - name: Report live funnel
        if: always()
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          test -n "${JURVIO_IMAGE:-}" || exit 0
          printf 'Assembly range %s -> %s; completed=%s [%s]; failed=%s [%s]\n' \
            "$NEWEST" "$OLDEST" "${COMPLETED_VOLUMES:-0}" "${COMPLETED_LIST:-}" \
            "${FAILED_VOLUMES:-0}" "${FAILED_LIST:-}"
          ssh "$DO_USER@$DO_HOST" "cd /opt/jurvio && JURVIO_IMAGE='$JURVIO_IMAGE' docker compose -f docker-compose.production.yml exec -T postgres psql -U jurvio -d jurvio -Atc \"SELECT json_build_object('published_cases',(SELECT count(DISTINCT legal_case.id) FROM legal_case JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND legal_case.publication='published'),'published_documents',(SELECT count(*) FROM document JOIN judicial_opinion ON judicial_opinion.document_id=document.id JOIN opinion_cluster ON opinion_cluster.id=judicial_opinion.cluster_id JOIN legal_case ON legal_case.id=opinion_cluster.case_id JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND document.publication='published'),'pending_candidates',(SELECT count(*) FROM official_opinion_candidate WHERE review_status='pending_review'),'readable_documents',(SELECT count(*) FROM document_content JOIN document ON document.id=document_content.document_id JOIN legal_case ON legal_case.id=document.case_id JOIN court ON court.id=legal_case.court_id WHERE lower(court.provider_court_id)='scotus' AND document.publication='published'));\""
