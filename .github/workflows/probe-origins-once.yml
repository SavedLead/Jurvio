name: Probe origins once

# Hosted (ubuntu-latest) read-only diagnostic. Times key public routes on both
# the OLD origin (jurvio-web-01, currently live) and the NEW origin
# (jurvio-public-01) by resolving jurvio.com to each IP over the public path.
# Uses -k because the origin serves a Cloudflare Origin certificate. Performs
# no writes, no SSH, no ingestion, and no DNS changes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-probe-origins
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Time routes on both origins
        run: |
          set -uo pipefail
          OLD=104.248.239.68
          NEW=104.248.237.187
          routes="/api/ready /api/health / /cases /scotus /supreme-court /courts"
          probe() {
            # $1=ip  $2=path -> prints "code time_total" ; curl exit is tolerated
            curl -ksS -o /dev/null \
              -w '%{http_code} %{time_total}' \
              --resolve "jurvio.com:443:$1" --max-time 60 \
              "https://jurvio.com$2" 2>/dev/null || echo "ERR --"
          }
          for label_ip in "OLD:$OLD" "NEW:$NEW"; do
            label="${label_ip%%:*}"; ip="${label_ip##*:}"
            echo "==================================================="
            echo "$label origin ($ip)"
            echo "---------------------------------------------------"
            printf '%-16s %-6s %-8s\n' "ROUTE" "CODE" "SECONDS"
            for r in $routes; do
              out="$(probe "$ip" "$r")"
              code="${out%% *}"; t="${out##* }"
              printf '%-16s %-6s %-8s\n' "$r" "$code" "$t"
            done
            echo ""
          done
