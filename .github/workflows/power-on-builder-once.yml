name: Power on builder once

# Hosted (ubuntu-latest) helper that powers on jurvio-builder-01 so the
# self-hosted Actions runner comes online to pick up queued jobs. Uses the
# repo-scoped DigitalOcean token only to issue a power_on action. Performs no
# SSH, no ingestion, no writes to any server, and no DNS changes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-power-on-builder
  cancel-in-progress: false

jobs:
  power-on:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Power on jurvio-builder-01
        run: |
          set -euo pipefail
          api=https://api.digitalocean.com/v2
          auth=(-H "Authorization: Bearer $DO_TOKEN" -H "Content-Type: application/json")
          droplets="$(curl -fsS "${auth[@]}" "$api/droplets?per_page=200")"
          id="$(jq -r '.droplets[] | select(.name=="jurvio-builder-01") | .id' <<<"$droplets" | head -1)"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Could not find droplet jurvio-builder-01"; exit 1
          fi
          status="$(jq -r --argjson id "$id" '.droplets[] | select(.id==$id) | .status' <<<"$droplets")"
          echo "jurvio-builder-01 id=$id status=$status"
          if [ "$status" = "active" ]; then
            echo "Builder already active; nothing to do."
            exit 0
          fi
          echo "Issuing power_on ..."
          curl -fsS -X POST "${auth[@]}" "$api/droplets/$id/actions" -d '{"type":"power_on"}' >/dev/null
          for _ in $(seq 1 30); do
            st="$(curl -fsS "${auth[@]}" "$api/droplets/$id" | jq -r '.droplet.status')"
            echo "status=$st"
            [ "$st" = "active" ] && { echo "Builder is active."; exit 0; }
            sleep 5
          done
          echo "::error::Builder did not reach active state in time"; exit 1
