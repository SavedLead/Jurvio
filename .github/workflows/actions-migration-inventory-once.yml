name: Actions migration infrastructure inventory
on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=ACTIONS_MIGRATION_INVENTORY.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ACTIONS_MIGRATION_INVENTORY to run this workflow against production"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: actions-migration-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 5
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    steps:
      - name: Require confirm=ACTIONS_MIGRATION_INVENTORY
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ACTIONS_MIGRATION_INVENTORY" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=ACTIONS_MIGRATION_INVENTORY."
            exit 1
          fi
      - name: Inspect host capacity and DigitalOcean droplet inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME user=$(id -un)"
          nproc
          free -m
          df -h /
          systemctl list-units 'actions.runner.*' --all --no-legend
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DigitalOcean credential unavailable"
            exit 1
          fi
          curl -fsS --max-time 25 -H "Authorization: Bearer $DO_TOKEN" https://api.digitalocean.com/v2/droplets?per_page=200 |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"name":x["name"],"id":x["id"],"status":x["status"],"memory":x["memory"],"vcpus":x["vcpus"],"networks":x["networks"]} for x in d["droplets"]],indent=2))'
