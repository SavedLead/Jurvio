name: Ingest official SCOTUS orders (dry-run)

# Fetches the public orders index and prints the parsed rows.
# This workflow has no apply mode. Writing rows is a later dispatch after
# migration 0201 is deployed. Nothing here notifies subscribers.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DIAGNOSE_SCOTUS_ORDERS"
        required: true
        type: string
      term:
        description: "Two-digit term"
        required: true
        default: "26"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-scotus-orders
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 10
    steps:
      - name: Require confirm=DIAGNOSE_SCOTUS_ORDERS
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DIAGNOSE_SCOTUS_ORDERS" ]; then
            echo "::error::Refusing to run. Re-run with confirm=DIAGNOSE_SCOTUS_ORDERS."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Parse the public orders index
        env:
          TERM: ${{ inputs.term }}
        run: |
          set -euo pipefail
          case "$TERM" in [0-9][0-9]) ;; *) echo "::error::term must be two digits"; exit 1;; esac
          pnpm exec tsx scripts/diagnose-scotus-coverage.ts --term="$TERM"
