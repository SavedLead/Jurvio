name: Stop federal extractor (once)

# Stop a running/orphaned federal opinion EXTRACTOR process (jobs/split-federal-opinions.mjs)
# inside the worker container. A cancelled extract workflow can leave its node process
# running (the process is a child of the container, not the SSH session), so this scans
# /proc for the splitter and terminates it. It does NOT touch chunk files or ledger rows:
# extraction writes each chunk to a .tmp then renames, so a mid-flight chunk is just a
# discardable .tmp, completed/ready ledger rows are untouched, and the splitter's advisory
# lock auto-releases when the process (its reserved connection) dies.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=STOP_FEDERAL_EXTRACTOR.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type STOP_FEDERAL_EXTRACTOR to run this workflow against production"
        required: true
        type: string
      service:
        description: Worker container the extractor runs in
        required: false
        default: worker-core
        type: choice
        options:
        - worker-core
        - worker-coa
        - app

permissions:
  contents: read

concurrency:
  group: jurvio-federal-extractor-stop
  cancel-in-progress: false

jobs:
  stop:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Require confirm=STOP_FEDERAL_EXTRACTOR
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "STOP_FEDERAL_EXTRACTOR" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=STOP_FEDERAL_EXTRACTOR."
            exit 1
          fi
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Stop extractor over private VPC
        run: |
          set -euo pipefail
          case "$SERVICE" in worker-core|worker-coa|app) ;; *) echo "::error::invalid service"; exit 1;; esac
          ssh "$INGESTION_USER@$DB_HOST" "SERVICE='$SERVICE' bash -se" <<'REMOTE'
          set -euo pipefail
          SERVICE="${SERVICE:-worker-core}"
          find_svc() { sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' \
            --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1; }
          worker="$(find_svc "$SERVICE")"
          [ -n "$worker" ] || { echo "::error::no worker container"; exit 1; }

          # Match ONLY node processes whose cmdline runs the splitter. Guarding on comm=node
          # excludes this scan's own shell/grep (whose cmdline contains the pattern string)
          # and the resident worker node (a different script).
          echo "=== extractor processes BEFORE stop ==="
          PROCS="$(sudo -n docker exec "$worker" sh -lc '
            n=0; for p in /proc/[0-9]*; do
              [ "$(cat "$p/comm" 2>/dev/null)" = node ] || continue
              if grep -qa "jobs/split-federal-opinions.mjs" "$p/cmdline" 2>/dev/null; then
                echo "pid=${p#/proc/}" 1>&2; n=$((n+1)); fi; done; echo "$n"')"
          echo "running extractor processes: ${PROCS}"
          if [ "${PROCS:-0}" -lt 1 ]; then
            echo "no extractor process running; nothing to stop"
            echo "=== DONE (no-op) ==="
            exit 0
          fi

          echo "=== STOP (scan /proc for node splitter, SIGTERM then SIGKILL) ==="
          sudo -n docker exec "$worker" sh -lc '
            for p in /proc/[0-9]*; do
              [ "$(cat "$p/comm" 2>/dev/null)" = node ] || continue
              if grep -qa "jobs/split-federal-opinions.mjs" "$p/cmdline" 2>/dev/null; then
                pid=${p#/proc/}; echo "stopping $pid"; kill "$pid" 2>/dev/null || true; fi; done
            sleep 3
            for p in /proc/[0-9]*; do
              [ "$(cat "$p/comm" 2>/dev/null)" = node ] || continue
              if grep -qa "jobs/split-federal-opinions.mjs" "$p/cmdline" 2>/dev/null; then
                pid=${p#/proc/}; echo "SIGKILL $pid"; kill -9 "$pid" 2>/dev/null || true; fi; done
            sleep 1'

          echo "=== extractor processes AFTER stop (expect count=0) ==="
          sudo -n docker exec "$worker" sh -lc '
            n=0; for p in /proc/[0-9]*; do
              [ "$(cat "$p/comm" 2>/dev/null)" = node ] || continue
              grep -qa "jobs/split-federal-opinions.mjs" "$p/cmdline" 2>/dev/null && n=$((n+1)); done; echo "count=$n"'
          echo "=== DONE ==="
          REMOTE
