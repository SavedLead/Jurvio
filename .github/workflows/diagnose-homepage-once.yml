name: Diagnose homepage query once

# Self-hosted (builder) read-only diagnostic for the homepage timeout.
# Connects to the production DB on jurvio-web-01 over the private VPC and,
# with a 25s statement_timeout, reports table sizes, the homepage query plan,
# and a bounded timing of the homepage query. Also times the live homepage
# through Cloudflare. Read-only: SELECT/EXPLAIN only, no writes, no DDL, no
# ingestion, no DNS change.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-diagnose-homepage
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 15
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Live homepage through Cloudflare (from builder)
        run: |
          set -uo pipefail
          echo "GET https://jurvio.com/ (through Cloudflare, live site):"
          curl -s -o /dev/null -w 'code=%{http_code} time=%{time_total}s\n' --max-time 45 https://jurvio.com/ \
            || echo "curl failed/timed out"
          echo "GET https://jurvio.com/api/ready :"
          curl -s -o /dev/null -w 'code=%{http_code} time=%{time_total}s\n' --max-time 20 https://jurvio.com/api/ready \
            || echo "curl failed/timed out"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 12
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 300
          CFG
          chmod 600 ~/.ssh/config

      - name: Inspect homepage query on production DB (read-only, bounded)
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" bash -s <<'REMOTE'
          set -e
          cid="$(sudo -n docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')"
          if [ -z "$cid" ]; then echo "No postgres container found"; exit 1; fi
          echo "postgres container: $cid"
          sudo -n docker exec -i "$cid" psql -U jurvio -d jurvio -v ON_ERROR_STOP=0 <<'SQL'
          SET statement_timeout='25s';
          \timing on
          \echo '--- table sizes (approx live rows) ---'
          SELECT relname, n_live_tup
          FROM pg_stat_user_tables
          WHERE relname IN ('legal_case','docket_entry','document','publication_decision','court')
          ORDER BY n_live_tup DESC;
          \echo '--- EXPLAIN homepage query (plan only) ---'
          EXPLAIN
          SELECT legal_case.public_id AS "publicId",
            legal_case.caption,
            legal_case.docket_number AS "docketNumber",
            court.name AS "courtName",
            GREATEST(
              legal_case.updated_at,
              COALESCE(legal_case.source_updated_at, legal_case.updated_at),
              COALESCE((SELECT max(docket_entry.updated_at) FROM docket_entry WHERE docket_entry.case_id = legal_case.id), legal_case.updated_at),
              COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)), legal_case.updated_at)
            )::text AS "activityDate",
            EXISTS (SELECT 1 FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)) AS "hasPublicDocument"
          FROM legal_case
          JOIN court ON court.id = legal_case.court_id
          WHERE legal_case.publication = 'published'
            AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'legal_case' AND decision.object_id = legal_case.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)
          ORDER BY "activityDate" DESC, legal_case.id
          LIMIT 6;
          \echo '--- bounded actual run (will error if it exceeds 25s) ---'
          SELECT legal_case.public_id AS "publicId",
            legal_case.caption,
            court.name AS "courtName",
            GREATEST(
              legal_case.updated_at,
              COALESCE(legal_case.source_updated_at, legal_case.updated_at),
              COALESCE((SELECT max(docket_entry.updated_at) FROM docket_entry WHERE docket_entry.case_id = legal_case.id), legal_case.updated_at),
              COALESCE((SELECT max(document.updated_at) FROM document WHERE document.case_id = legal_case.id AND document.publication = 'published' AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'document' AND decision.object_id = document.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)), legal_case.updated_at)
            )::text AS "activityDate"
          FROM legal_case
          JOIN court ON court.id = legal_case.court_id
          WHERE legal_case.publication = 'published'
            AND COALESCE((SELECT decision.displayable FROM publication_decision decision WHERE decision.object_type = 'legal_case' AND decision.object_id = legal_case.id ORDER BY decision.decided_at DESC, decision.id DESC LIMIT 1), false)
          ORDER BY "activityDate" DESC, legal_case.id
          LIMIT 6;
          SQL
          REMOTE
