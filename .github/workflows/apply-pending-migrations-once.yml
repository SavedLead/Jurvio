name: Apply pending migrations (once)

# Out-of-band apply of migration 0110 for when the release-time pre-migration
# backup is too slow on a CPU-loaded box and blows the release SSH timeout
# (exit 124), blocking the deploy before migrate/recreate ever run. 0110 is two
# trivial `ADD COLUMN IF NOT EXISTS ... jsonb` statements; applying them directly
# via psql (no image pull, no full backup) is safe -- the nightly backup is the
# recovery point. We also insert the schema_migration record so the next normal
# deploy sees 0 pending migrations, SKIPS the backup, and recreates fast.
#
# Runs on the self-hosted builder and reaches jurvio-web-01 over the private VPC.

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=APPLY_PENDING_MIGRATIONS.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_PENDING_MIGRATIONS to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
    steps:
      - name: Require confirm=APPLY_PENDING_MIGRATIONS
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY_PENDING_MIGRATIONS" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=APPLY_PENDING_MIGRATIONS."
            exit 1
          fi
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Apply migration 0110 directly via psql (no image, no backup)
        run: |
          set -euo pipefail
          ssh "$INGESTION_USER@$DB_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          name='0110_courtlistener_bulk_provider_metadata.sql'
          pg="$(sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' \
            --filter 'label=com.docker.compose.service=postgres' --format '{{.ID}}' | head -n1)"
          [ -n "$pg" ] || { echo "::error::no running jurvio postgres container"; exit 1; }

          echo "=== already applied? ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc \
            "SELECT 'applied='||count(*) FROM schema_migration WHERE name='${name}';"

          echo "=== apply 0110 (idempotent) + record it ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE opinion_cluster ADD COLUMN IF NOT EXISTS provider_metadata jsonb;" \
            -c "ALTER TABLE judicial_opinion ADD COLUMN IF NOT EXISTS provider_metadata jsonb;" \
            -c "INSERT INTO schema_migration (name) VALUES ('${name}') ON CONFLICT (name) DO NOTHING;"

          echo "=== verify columns exist ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc "
            SELECT table_name||'.'||column_name||'='||data_type
            FROM information_schema.columns
            WHERE column_name='provider_metadata'
              AND table_name IN ('opinion_cluster','judicial_opinion')
            ORDER BY 1;"

          echo "=== verify migration recorded (next deploy will see 0 pending) ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -Atc \
            "SELECT 'recorded='||count(*) FROM schema_migration WHERE name='${name}';"
          REMOTE
