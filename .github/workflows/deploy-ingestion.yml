name: Build image preflight (no deploy)

# RETIRED as a production release path. Production releases to jurvio-web-01 go
# through deploy-production.yml ONLY — that is the single authoritative pipeline
# for the ingestion box, with the `jurvio-production` deploy lock and the
# current-main release gate. This workflow no longer copies compose, writes
# secrets, restarts services, or touches the box in any way. It only builds the
# image for a commit as a pre-release sanity check, so a broken build is caught
# before a real release is dispatched. It never pushes and never connects to the
# ingestion box.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to the current branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Deliberately NOT the production deploy lock. This build check must never
  # queue behind or block a real release, and it cannot deploy.
  group: jurvio-image-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build the production image (no push, no deploy)
        run: |
          set -euo pipefail
          echo "Preflight build only — production releases go through deploy-production.yml."
          docker build -t jurvio-preflight:${{ github.sha }} .
          echo "Image built successfully for ${{ github.sha }} (not pushed, not deployed)."
