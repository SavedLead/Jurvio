name: Measure CourtListener bulk docket load (once)

# Manual only. Downloads one dockets CSV, merges the first 100,000 eligible
# rows (or the next 100,000 if a checkpoint already exists), prints rows/hour
# and database size, then deletes the file. Dispatch this only after
# deploy-production.yml has released the image that contains
# jobs/load-courtlistener-bulk-dockets.mjs and migration 0131.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MEASURE to run the 100k bulk docket measurement"
        required: true
        type: string
      snapshot_date:
        description: "YYYY-MM-DD, or latest"
        required: true
        default: "latest"
        type: string
      row_limit:
        description: "Eligible rows to merge this run"
        required: true
        default: "100000"
        type: string
      allow_anytime:
        description: "true skips the 1–7am ET window. Use true for this measurement."
        required: true
        default: "true"
        type: string
      reset_checkpoint:
        description: "true starts this snapshot over at the first row"
        required: true
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: jurvio-bulk-docket-load
  cancel-in-progress: false

jobs:
  measure:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 180
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      CONFIRM: ${{ inputs.confirm }}
      SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
      ROW_LIMIT: ${{ inputs.row_limit }}
      ALLOW_ANYTIME: ${{ inputs.allow_anytime }}
      RESET_CHECKPOINT: ${{ inputs.reset_checkpoint }}
    steps:
      - name: Require confirm=MEASURE
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "MEASURE" ]; then
            echo "::error::Refusing to load dockets. Re-run with confirm=MEASURE."
            exit 1
          fi
          case "$ROW_LIMIT" in
            ''|*[!0-9]*) echo "::error::row_limit must be a positive integer"; exit 1;;
          esac
          if [ "$ROW_LIMIT" -lt 1 ] || [ "$ROW_LIMIT" -gt 100000 ]; then
            echo "::error::row_limit must be 1-100000 for this measurement"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: ./.github/actions/vpc-ssh
        with:
          ssh_key_b64: ${{ secrets.DO_SSH_KEY_B64 }}

      - name: Load one measured chunk and delete the file
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$HOME/vpc-ssh.sh"
          vpc_ssh "$INGESTION_USER@$DB_HOST" "SNAPSHOT_DATE='$SNAPSHOT_DATE' ROW_LIMIT='$ROW_LIMIT' ALLOW_ANYTIME='$ALLOW_ANYTIME' RESET_CHECKPOINT='$RESET_CHECKPOINT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          find_svc() {
            sudo -n docker ps --filter 'label=com.docker.compose.project=jurvio' --filter "label=com.docker.compose.service=$1" --format '{{.ID}}' | head -n1
          }
          app="$(find_svc app)"
          pg="$(find_svc postgres)"
          [ -n "$app" ] && [ -n "$pg" ] || { echo "::error::app or postgres container missing"; exit 1; }
          if ! sudo -n docker exec "$app" test -f jobs/load-courtlistener-bulk-dockets.mjs; then
            echo "::error::jobs/load-courtlistener-bulk-dockets.mjs is not in the running image. Release this commit with deploy-production.yml first."
            exit 1
          fi
          bucket="https://com-courtlistener-storage.s3-us-west-2.amazonaws.com"
          snap="$SNAPSHOT_DATE"
          if [ "$snap" = "latest" ]; then
            snap="$(curl -fsS "${bucket}/?list-type=2&prefix=bulk-data/dockets-" \
              | grep -oE 'dockets-[0-9]{4}-[0-9]{2}-[0-9]{2}\.csv\.bz2' | sort | tail -1 \
              | sed -E 's/dockets-([0-9-]+)\.csv\.bz2/\1/')"
          fi
          case "$snap" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::could not resolve snapshot date ($snap)"; exit 1;;
          esac
          url="${bucket}/bulk-data/dockets-${snap}.csv.bz2"
          echo "snapshot=${snap}"
          echo "url=${url}"
          bytes="$(curl -fsSI "$url" | awk 'tolower($1)=="content-length:" {print $2}' | tr -d '\r' | tail -1)"
          [ -n "$bytes" ] || { echo "::error::docket file has no Content-Length"; exit 1; }
          echo "content_length_bytes=${bytes}"
          read -r total avail < <(df -B1 --output=size,avail / | tail -1)
          python3 - "$total" "$avail" "$bytes" <<'PY'
          import sys
          total, avail, nbytes = (int(x) for x in sys.argv[1:4])
          remain = avail - nbytes
          print(f"disk_total={total} disk_avail={avail} after_download={remain} ratio={remain / total:.3f}")
          if remain / total < 0.30:
              raise SystemExit("refusing download: free disk would fall under 30%")
          PY
          echo "=== database size before ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -c "SELECT pg_size_pretty(pg_database_size('jurvio')) AS db_size, pg_database_size('jurvio') AS db_bytes;"
          dest="/tmp/jurvio-dockets-${snap}.csv.bz2"
          trap 'rm -f "$dest"' EXIT
          curl -fL --retry 3 --retry-delay 2 -o "$dest" "$url"
          sudo -n docker exec "$app" mkdir -p /var/lib/jurvio/artifacts/bulk
          sudo -n docker cp "$dest" "$app:/var/lib/jurvio/artifacts/bulk/dockets-${snap}.csv.bz2"
          rm -f "$dest"
          set +e
          sudo -n docker exec "$app" node jobs/load-courtlistener-bulk-dockets.mjs \
            "--file=/var/lib/jurvio/artifacts/bulk/dockets-${snap}.csv.bz2" \
            "--snapshot-date=${snap}" \
            "--row-limit=${ROW_LIMIT}" \
            "--budget-minutes=90" \
            "--allow-anytime=${ALLOW_ANYTIME}" \
            "--reset-checkpoint=${RESET_CHECKPOINT}" \
            "--include-bankruptcy=false"
          code=$?
          set -e
          sudo -n docker exec "$app" rm -f "/var/lib/jurvio/artifacts/bulk/dockets-${snap}.csv.bz2"
          echo "=== database size after ==="
          sudo -n docker exec "$pg" psql -U jurvio -d jurvio -c "SELECT pg_size_pretty(pg_database_size('jurvio')) AS db_size, pg_database_size('jurvio') AS db_bytes;"
          echo "=== disk after ==="
          df -h /
          echo "loader_exit=${code}"
          exit "$code"
          REMOTE
