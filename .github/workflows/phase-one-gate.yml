name: Phase 1 launch gate audit

on:
  # Dispatch-only, by policy (tests/workflow-triggers.test.ts). No push,
  # pull_request, workflow_run or schedule trigger may start this workflow;
  # every job fails closed unless confirm=PHASE_ONE_GATE.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PHASE_ONE_GATE to run this workflow against production"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: jurvio-phase-one-gate
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 20
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      REMOTE_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Require confirm=PHASE_ONE_GATE
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PHASE_ONE_GATE" ]; then
            echo "::error::Refusing to run. Re-run this workflow by hand with confirm=PHASE_ONE_GATE."
            exit 1
          fi
      - name: Install GitHub REST helpers (builder-01 has no gh CLI)
        if: always()
        run: |
          # jurvio-builder-01 has curl and jq but no gh CLI. These helpers replace the
          # gh calls this workflow used. Issue comments and report updates are best
          # effort and never fail the job; reads used for decisions still fail loudly.
          cat > "$RUNNER_TEMP/gh-rest.sh" <<'GHREST'
          _gh_curl() {
            local method="$1" path="$2"; shift 2
            curl -fsSL --retry 3 --retry-delay 2 -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN:?GH_TOKEN is not set}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@" "https://api.github.com/${path#/}"
          }
          gh_api() { _gh_curl GET "$1"; }
          gh_api_post() {
            if [ $# -ge 2 ]; then printf '%s' "$2" | _gh_curl POST "$1" -H "Content-Type: application/json" --data-binary @-
            else _gh_curl POST "$1"; fi
          }
          # Every page of a list endpoint, one JSON document per page (pipe into jq).
          gh_api_paginate() {
            local path="$1" page=1 sep body count
            case "$path" in *\?*) sep='&' ;; *) sep='?' ;; esac
            while [ "$page" -le 50 ]; do
              body="$(gh_api "${path}${sep}page=${page}")" || return 1
              printf '%s\n' "$body"
              count="$(jq '(if type == "array" then . else ([.[] | arrays] | .[0] // []) end) | length' <<<"$body")"
              [ "${count:-0}" -gt 0 ] || break
              page=$((page + 1))
            done
          }
          gh_patch_body() {
            jq -n --arg body "$2" '{body: $body}' \
              | _gh_curl PATCH "$1" -H "Content-Type: application/json" --data-binary @- \
              || { echo "::warning::GitHub update of $1 failed (non-fatal)" >&2; return 0; }
          }
          gh_comment() {
            jq -n --arg body "$2" '{body: $body}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/issues/$1/comments" -H "Content-Type: application/json" --data-binary @- >/dev/null \
              || echo "::warning::comment on issue #$1 failed (non-fatal)" >&2
          }
          gh_issue_create() {
            jq -n --arg title "$1" --arg body "$2" '{title: $title, body: $body}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/issues" -H "Content-Type: application/json" --data-binary @- >/dev/null \
              || echo "::warning::issue creation failed (non-fatal)" >&2
          }
          # gh_dispatch WORKFLOW REF key=value ...
          gh_dispatch() {
            local wf="$1" ref="$2"; shift 2
            local inputs='{}' kv
            for kv in "$@"; do inputs="$(jq -c --arg k "${kv%%=*}" --arg v "${kv#*=}" '. + {($k): $v}' <<<"$inputs")"; done
            jq -n --arg ref "$ref" --argjson inputs "$inputs" '{ref: $ref, inputs: $inputs}' \
              | _gh_curl POST "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/dispatches" -H "Content-Type: application/json" --data-binary @- >/dev/null
          }
          export -f _gh_curl gh_api gh_api_post gh_api_paginate gh_patch_body gh_comment gh_issue_create gh_dispatch
          GHREST
      - name: Resolve servers and configure SSH
        id: hosts
        run: |
          set -euo pipefail
          droplets="$(curl -fsS -H "Authorization: Bearer $DO_TOKEN" https://api.digitalocean.com/v2/droplets?per_page=200)"
          public="$(jq -r '.droplets[] | select(.name=="jurvio-public-01") | .networks.v4[] | select(.type=="private") | .ip_address' <<<"$droplets" | head -1)"
          ingestion="10.116.0.2"
          test -n "$public"
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "ingestion=$ingestion" >> "$GITHUB_OUTPUT"
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Public health and admin indexing boundary
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://jurvio.com/api/health | grep -q '"status":"ok"'
          curl -fsS --max-time 20 https://jurvio.com/api/ready | grep -q '"status":"ready"'
          curl -fsS --max-time 20 https://z.jurvio.com/robots.txt | grep -qi 'Disallow: /'
          curl -LfsS --max-time 20 https://z.jurvio.com/ | grep -qi 'noindex'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://jurvio.com/internal/publication)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://jurvio.com/internal/analytics)" = "404"

      - name: Ingestion services, backup and rollback image
        env:
          HOST: ${{ steps.hosts.outputs.ingestion }}
        run: |
          set -euo pipefail
          ssh "$REMOTE_USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/jurvio
          test -s .env.production
          test "$(docker ps --filter 'label=com.docker.compose.project=jurvio' --format '{{.ID}}' | wc -l)" -gt 0
          latest="$(find backups -maxdepth 1 -type f -name '*.sql.gz' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$latest" && test -s "$latest"
          gzip -t "$latest"
          current="$(docker inspect -f '{{.Config.Image}}' "$(docker ps --filter 'label=com.docker.compose.project=jurvio' --filter 'label=com.docker.compose.service=app' --format '{{.ID}}' | head -1)")"
          test -n "$current"
          repo="${current%:*}"
          count="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -F "$repo:" | sort -u | wc -l)"
          echo "ingestion current image=$current retained release images=$count latest backup=$latest"
          test "$count" -ge 2
          REMOTE

      - name: Public container and rollback image
        env:
          HOST: ${{ steps.hosts.outputs.public }}
        run: |
          set -euo pipefail
          ssh "$REMOTE_USER@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          current="$(docker inspect -f '{{.Config.Image}}' jurvio-public-app)"
          test -n "$current"
          repo="${current%:*}"
          count="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -F "$repo:" | sort -u | wc -l)"
          echo "public current image=$current retained release images=$count"
          test "$count" -ge 2
          REMOTE
      - name: Record Gate 1 receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_STATUS: ${{ job.status }}
        run: |
          source "$RUNNER_TEMP/gh-rest.sh"
          gh_issue_create "Gate 1 audit [$GATE_STATUS]" "Status: **$GATE_STATUS**\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nRecorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
