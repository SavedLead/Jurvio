name: Harden builder once (P5)

# One-off: harden the self-hosted runner on jurvio-builder-01 entirely remotely.
# The job runs ON the builder as the (sudo-less) runner user, then escalates via
# an SSH-to-loopback as the DO_USER admin account (passwordless sudo, key already
# in CI secrets; loopback bypasses the cloud firewall). It sets Restart=always,
# enables the runner, and blocks unattended-upgrades auto-reboot -- WITHOUT
# restarting the runner (that would kill this job). Delete after use.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jurvio-harden-builder
  cancel-in-progress: false

jobs:
  harden:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe local privilege on the builder
        id: probe
        run: |
          set -uo pipefail
          echo "whoami: $(whoami)"; id
          echo "--- sudo -n -l ---"
          if sudo -n -l 2>&1; then :; fi
          if sudo -n true 2>/dev/null; then
            echo "direct passwordless sudo: YES"
            echo "have_sudo=yes" >> "$GITHUB_OUTPUT"
          else
            echo "direct passwordless sudo: NO"
            echo "have_sudo=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply hardening directly (no runner restart)
        if: steps.probe.outputs.have_sudo == 'yes'
        run: |
          set -euo pipefail
          sudo -n bash scripts/ops/harden-builder.sh
      - name: Diagnostics when no direct sudo (choose next mechanism)
        if: steps.probe.outputs.have_sudo != 'yes'
        run: |
          set -uo pipefail
          echo "No direct passwordless sudo for the runner user. Enumerating options:"
          echo "--- /etc/sudoers.d (if readable) ---"; ls -la /etc/sudoers.d/ 2>&1 || true
          echo "--- runner unit (systemctl cat, no root needed to read) ---"
          systemctl cat 'actions.runner.*.service' 2>&1 | head -40 || true
          echo "--- current runner Restart/enabled/active ---"
          U="$(systemctl list-units 'actions.runner.*.service' --no-legend --all 2>/dev/null | awk '{print $1}' | head -1)"
          echo "unit=$U"
          [ -n "$U" ] && systemctl show "$U" -p Restart -p UnitFileState -p ActiveState 2>&1 || true
          echo "--- local login users ---"; getent passwd | awk -F: '$7 ~ /(ba)?sh$/ {print $1}' || true
          echo "(Failing this step on purpose so the run is marked failed and I revisit the mechanism.)"
          exit 1
