name: Citation coverage report (read-only)

# One dispatch report with every number the citation web plan tracks (ADR 0090,
# plan PR A4): table and database sizes, queue sizes (estimates + exact live
# counts), precomputed edge totals, count-table coverage, CourtListener import,
# stub and live-text counters, lane health and case-page list/count latency for
# probe cases. Optional full mode adds the exact linked-cite join (minutes).
# The job runs in the deployed worker image on THIS builder runner with a READ
# ONLY database session (scripts/report-citation-coverage.ts). Writes nothing.

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the exact linked-cite join (heavy read, minutes)
        required: false
        default: false
        type: boolean
      probe:
        description: Comma-separated case public ids to time (lists and counts)
        required: false
        default: 'jv-psa0531m28,jv-s53fb7vdoj,jv-hv6c1ufmo6,jv-n77naroa4h'
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: jurvio-citation-coverage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: [self-hosted, Linux, X64, jurvio, builder, trusted]
    environment: production
    timeout-minutes: 45
    env:
      DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
      INGESTION_USER: ${{ secrets.DO_USER }}
      DB_HOST: 10.116.0.2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FULL: ${{ inputs.full }}
      PROBE: ${{ inputs.probe }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'CFG'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config
      - name: Report (read-only session)
        run: |
          set -euo pipefail
          [[ "$PROBE" =~ ^[a-z0-9,-]*$ ]] || { echo "::error::probe must be comma-separated public ids"; exit 1; }
          set -- --probe="$PROBE"
          if [ "$FULL" = "true" ]; then set -- "$@" --full; fi
          out="$(mktemp)"
          JOB_CPUS=1 JOB_MEMORY=1500m bash scripts/ops/builder-job.sh jobs/report-citation-coverage.mjs "$@" 2>&1 | tee "$out"
          grep -E '^\{"coverage":' "$out" | while IFS= read -r line; do
            title="$(printf '%s' "$line" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read()); print("Citation coverage " + d["coverage"] + (" " + d["case"] if "case" in d else ""))')"
            echo "::notice title=${title}::${line}"
          done || true
      - name: Remove ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config
