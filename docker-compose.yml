services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jurvio
      POSTGRES_USER: jurvio
      POSTGRES_PASSWORD: jurvio
    ports:
      - "5432:5432"
    volumes:
      - jurvio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurvio -d jurvio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jurvio_postgres:
