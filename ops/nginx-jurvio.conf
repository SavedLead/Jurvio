server {
    listen 80;
    listen [::]:80;
    server_name jurvio.com www.jurvio.com;
    return 301 https://jurvio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jurvio.com;

    ssl_certificate /etc/ssl/cloudflare/jurvio.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jurvio.key;
    return 301 https://jurvio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jurvio.com;

    ssl_certificate /etc/ssl/cloudflare/jurvio.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jurvio.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
