# Real client IP when Cloudflare is in front. $remote_addr alone is a
# Cloudflare edge, which would put every visitor in one bucket.
map $http_cf_connecting_ip $jurvio_case_limit_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# 5 requests/second sustained, with a burst of 40. A person opening a case and
# its docket, documents, parties, and timeline stays inside the burst. One IP
# cannot hold the case-page database pool.
limit_req_zone $jurvio_case_limit_key zone=jurvio_case:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jurvio.com www.jurvio.com;
    return 301 https://jurvio.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name z.jurvio.com;
    return 301 https://z.jurvio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jurvio.com;

    ssl_certificate /etc/ssl/cloudflare/jurvio-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jurvio-origin.key;
    return 301 https://jurvio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jurvio.com z.jurvio.com;

    ssl_certificate /etc/ssl/cloudflare/jurvio-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jurvio-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /case/ {
        limit_req zone=jurvio_case burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jurvio_case_limit_key;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
