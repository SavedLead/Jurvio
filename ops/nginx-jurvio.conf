# Per TCP peer after the real_ip module. install-public-nginx-conf-once.yml
# writes /etc/nginx/conf.d/jurvio-cloudflare-real-ip.conf so Cloudflare
# connections rewrite $remote_addr from CF-Connecting-IP, and only when the
# peer is a Cloudflare range. A direct client cannot spoof that address.
# 5 requests/second sustained, burst 40: a person opening a case and its
# subpages stays inside the burst.
limit_req_zone $binary_remote_addr zone=jurvio_case:10m rate=5r/s;

# Refuse the scrapers that ignore robots.txt. Google and Bing are listed
# first: nginx uses the first matching regex, so a UA that contains
# Googlebot or bingbot is never refused, even if it also contains AionBot.
map $http_user_agent $jurvio_block_scraper {
    default 0;
    "~*Googlebot" 0;
    "~*AdsBot-Google" 0;
    "~*Mediapartners-Google" 0;
    "~*Google-InspectionTool" 0;
    "~*Storebot-Google" 0;
    "~*bingbot" 0;
    "~*AionBot" 1;
    "~*MJ12bot" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name jurvio.com www.jurvio.com;
    return 301 https://jurvio.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name z.jurvio.com;
    return 301 https://z.jurvio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jurvio.com;

    ssl_certificate /etc/ssl/cloudflare/jurvio-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jurvio-origin.key;
    return 301 https://jurvio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jurvio.com z.jurvio.com;

    ssl_certificate /etc/ssl/cloudflare/jurvio-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jurvio-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if ($jurvio_block_scraper) {
        return 403;
    }

    location /case/ {
        limit_req zone=jurvio_case burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
